<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ermittlungsakte Dorfteich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--paper:#fffdf7;--ink:#1c1917;--muted:#57534e;--line:#e7dfcf;--teal:#0f5f5c;--teal2:#0a4644;--rust:#b45309;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--r:16px;--shadow:0 6px 22px rgba(60,40,10,.10)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,'Segoe UI',sans-serif;font-size:17px;line-height:1.55}
button,input,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#1f2a2a;color:#f5f5f4}
.top-in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:'Special Elite',monospace;font-size:20px;white-space:nowrap;cursor:pointer}
.spacer{flex:1}
.xp{font-weight:900;background:#fef3c7;color:#92400e;border-radius:999px;padding:3px 12px;white-space:nowrap}
.nav{background:#2b3838;overflow-x:auto}
.nav-in{max-width:1000px;margin:0 auto;padding:6px 12px;display:flex;gap:6px}
.nav button{flex:none;border:0;background:transparent;color:#d6d3d1;font-weight:800;padding:6px 10px;border-radius:10px;font-size:15px;white-space:nowrap}
.nav button.on{background:#f5f5f4;color:#1f2a2a}
.nav button.done::after{content:" ✓";color:#4ade80}
main{max-width:1000px;margin:0 auto;padding:20px 16px 70px}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 26px;border:1px solid var(--line);margin-bottom:16px;position:relative}
.stamp{font-family:'Special Elite',monospace;color:#b91c1c;border:3px solid #b91c1c;border-radius:8px;padding:2px 10px;display:inline-block;transform:rotate(-4deg);font-size:15px;letter-spacing:.08em;opacity:.85;margin-bottom:8px}
h1{font-family:'Special Elite',monospace;font-size:32px;line-height:1.15;margin:.1em 0 .3em;font-weight:400}
h2{font-size:23px;margin:.1em 0 .5em;font-weight:900}
h3{font-size:18px;margin:1em 0 .4em;font-weight:900;color:var(--teal2)}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:900;font-size:16px;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal2)}
.btn.ghost{background:#fff;color:var(--teal2);box-shadow:0 0 0 2px var(--line) inset}
.btn.rust{background:var(--rust);box-shadow:0 4px 0 #78350f}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.akte{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;position:relative}
.akte:hover{border-color:var(--teal)}
.akte b{display:block;font-size:16px}.akte small{color:var(--muted);font-weight:700}
.akte .nr{font-family:'Special Elite',monospace;color:var(--rust);font-size:14px}
.akte.done{background:#f0fdf4;border-color:#86efac}
.akte.done::after{content:"✓";position:absolute;right:12px;top:10px;color:var(--ok);font-weight:900;font-size:20px}
audio{width:100%;margin:6px 0 4px}
.summary{font-size:18px;background:#fbf7ec;border-left:5px solid var(--rust);padding:12px 16px;border-radius:0 12px 12px 0}
.kp{margin:0;padding-left:1.2em}.kp li{margin:4px 0}
.q{border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:#fff}
.q .qq{font-weight:900;font-size:17.5px}
.q textarea{width:100%;min-height:62px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;resize:vertical}
.ans{display:none;margin-top:10px;background:#ecfdf5;border:2px solid #a7f3d0;border-radius:12px;padding:10px 14px}
.ans.show{display:block}
.quote{margin-top:6px;font-style:italic;color:var(--muted)}
.quote::before{content:"📖 Im Buch: "}
.opts{display:grid;gap:9px;margin-top:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:700;text-align:left}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt[disabled]{color:var(--ink);opacity:1;cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:10px;border-radius:12px;padding:10px 14px;font-weight:700}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.qtext{font-size:20px;font-weight:900;margin:6px 0}
.progress{display:flex;gap:4px;margin:2px 0 10px}.progress i{flex:1;height:8px;border-radius:4px;background:#e7e5e4}.progress i.ok{background:var(--ok)}.progress i.bad{background:var(--bad)}.progress i.cur{background:#5eead4}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{border:2px solid var(--line);background:#fff;border-radius:14px;padding:0;overflow:hidden;text-align:left}
.pc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#e7e5e4}
.pc div{padding:8px 10px}.pc b{display:block;font-size:16px;line-height:1.2}.pc small{color:var(--muted);font-size:13px;line-height:1.25;display:block;margin-top:2px}
.pc.seen{border-color:var(--teal)}.pc.seen b::after{content:" \2713";color:var(--ok)}
.phead{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:20px;align-items:start}
.phead img{width:100%;border-radius:14px;box-shadow:var(--shadow)}
@media(max-width:640px){.phead{grid-template-columns:1fr}.phead img{max-width:320px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:.3em 0}.chip{background:#ecfdf5;color:var(--teal2);border-radius:999px;padding:3px 11px;font-weight:800;font-size:14px}
.looks li{margin:.15em 0}
.howto{background:#fff7ed;border:2px dashed #fdba74;border-radius:14px;padding:12px 16px}
.howto ol{margin:.3em 0;padding-left:1.3em}
.abk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.abk .flip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;min-height:110px}
.abk .flip .a{font-family:'Special Elite',monospace;font-size:28px;color:var(--rust)}
.abk .flip .f{display:none;font-weight:800;margin-top:6px}.abk .flip.open .f{display:block}.abk .flip .x{display:none;font-size:14px;color:var(--muted);margin-top:4px}.abk .flip.open .x{display:block}
input.tin{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:17px}
.person{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.person b{font-size:17px}.person small{color:var(--rust);font-weight:800}
.tl{border-left:4px solid var(--teal);margin-left:10px;padding-left:18px}
.tl div{position:relative;margin:0 0 14px}.tl div::before{content:"";position:absolute;left:-27px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--rust);border:3px solid var(--paper)}
.inp{font-size:22px;font-weight:800;padding:10px 14px;border-radius:12px;border:3px solid var(--line);width:100%;max-width:420px}
.inp.ok{border-color:var(--ok);background:var(--okbg)}.inp.bad{border-color:var(--bad);background:var(--badbg)}
.wrongword{font-size:26px;font-weight:900;color:var(--bad);text-decoration:line-through wavy}
.grade{font-family:'Special Elite',monospace;font-size:58px;color:var(--teal2);line-height:1.1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(160%);opacity:0;background:#1c1917;color:#fff;border-radius:14px;padding:10px 18px;font-weight:900;transition:all .3s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){h1{font-size:25px}.card{padding:18px}.brand span{display:none}}
</style>
</head>

<header class="top"><div class="top-in"><div class="brand" id="home">🔍 <span>Ermittlungsakte Dorfteich</span></div><span class="spacer"></span><span class="xp" id="xp">⭐ 0</span></div>
<nav class="nav"><div class="nav-in" id="nav"></div></nav></header>
<main id="main"></main>

<script>
const DATA={"chapters": [{"nr": 1, "title": "Ankunft in Ribberow", "summary": "Jannek ist sechzehn Jahre alt und wohnt mit seiner Mutter in der Stadt Pinzlau. In den Herbstferien soll er eine Woche bei seiner Oma Hanne im Dorf Ribberow verbringen, denn Hanne ist seit dem Tod von Opa allein. Jannek hat überhaupt keine Lust, denn das Dorf ist langweilig und Hanne ist sehr streng. Unterwegs trifft er seinen alten Kinderfreund Till, der jetzt Polizist ist. Till erzählt ihm von Rike und ihrem seltsamen Vater, den alle nur Waldeinstein nennen. Bei Hanne ist es still, nur die Uhr tickt. Auf dem Küchentisch ist Blut, aber es stammt nur von einem Kaninchen. Die Kekse von Janneks Mutter will Hanne nicht essen. Zwischendurch erfährt der Leser, dass tief in einem Teich ein Skelett liegt.", "keypoints": ["Jannek (16) fährt in den Herbstferien eine Woche zu Oma Hanne nach Ribberow.", "Grund: Seine Mutter will, dass jemand Hanne Gesellschaft leistet. Opa ist vor einem halben Jahr gestorben.", "Die Mutter kommt nicht mit, weil sie zwei Jobs hat und zur Abendschule geht.", "Till (21), Janneks Kinderfreund, ist jetzt Polizeimeister in der Probezeit und nimmt Jannek im Auto mit.", "In Hannes Haus hört Jannek zuerst nur das Ticken der Uhr. Das Blut auf dem Tisch stammt von einem Kaninchen.", "Kurze Zwischenteile zeigen ein Skelett auf einer Pflugschar tief im Wasser."], "questions": [{"q": "Wo genau sitzt Jannek im Zug?", "answer": "Jannek sitzt im Zug am Fenster und lehnt den Kopf an die Fensterscheibe. Im Bus nach Ribberow setzt er sich auf einen hinteren Fensterplatz in der Nähe einer jungen Frau mit einem Kleinkind.", "quote": "Jannek lehnte mit dem Kopf an der Fensterscheibe."}, {"q": "Was war das erste, was Jannek hört, als er in Hannes Haus lief?", "answer": "Jannek hört zuerst nur das Ticken der Uhr im Wohnzimmer. Sonst ist im Haus alles still, sogar zu still.", "quote": "Im Haus roch es nach alten Leuten, und bis auf das Ticken der Uhr im Wohnzimmer war alles still."}, {"q": "Warum fährt Jannek in den Herbstferien zu Hanne?", "answer": "Seine Mutter möchte, dass jemand Hanne Gesellschaft leistet, weil Hanne seit Opas Tod vor einem halben Jahr allein lebt. Die Mutter selbst kann nicht fahren, weil sie zwei Jobs hat und zur Abendschule geht.", "quote": "»Hanne braucht etwas Gesellschaft. Sonst wird sie noch seltsamer. Meint zumindest meine Mutter.«"}, {"q": "Wie beschäftigen sich Jannek und Till in Ribberow?", "answer": "Till schlägt vor, angeln zu gehen oder später im Dorfkrug Darts zu spielen. Am selben Abend gehen die beiden zusammen am Weiher angeln.", "quote": "»Wir könnten angeln gehen oder später im Krug ’ne Runde Darts spielen.«"}], "quiz": [{"q": "Wer hält auf der Landstraße an und nimmt Jannek mit?", "o": ["Polizeihauptkommissar Rädke", "Till", "Herr Hempel", "Rike"], "a": 1, "e": "Jannek ruft einem vorbeirasenden Auto etwas nach, es setzt zurück, und am Steuer sitzt sein alter Freund Till."}, {"q": "Woher stammt das Blut auf Hannes Küchentisch?", "o": ["Hanne hat sich in den Finger geschnitten", "Von einem Huhn", "Von einem Kaninchen", "Es ist rote Farbe"], "a": 2, "e": "Hanne sagt nur „Kaninchen“, sie hat ein Kaninchen geschlachtet."}, {"q": "Was hat Janneks Mutter für Hanne mitgeschickt?", "o": ["Selbst gebackene Kekse", "Einen Blumenstrauß", "Ein Fotoalbum", "Eine Rheumacreme"], "a": 0, "e": "Die Mutter hat bis spät in die Nacht Kekse gebacken, aber Hanne rührt die Dose nicht an."}, {"q": "Welche Arbeit gibt Hanne Jannek gleich am ersten Tag?", "o": ["Die Hühner füttern", "Im Dorf einkaufen", "Die Scheune aufräumen", "Holz auf dem Hof hacken"], "a": 3, "e": "Jannek soll Opas Stiefel anziehen und Holz hacken. Dabei bekommt er Blasen an den Händen."}, {"q": "Warum nennt man Rikes Vater „Waldeinstein“?", "o": ["Weil er sehr klug ist", "Weil er Physiklehrer ist", "Weil er Einstein heißt", "Wegen seiner abstehenden Haare und weil er am Waldrand wohnt"], "a": 3, "e": "Till sagt, seine Haare stehen nach allen Seiten ab, als würde er den Finger in die Steckdose stecken, und das Haus steht am Waldrand."}], "questions2": [], "audio": "audio/kap1_6ffe4981.mp3"}, {"nr": 2, "title": "Der grausige Fang", "summary": "Am Abend läuft Jannek durch Ribberow. Das Dorf hat sich kaum verändert, aber er fühlt sich dort fremd. Er holt Till bei den Hempels ab, und die beiden gehen zum Weiher angeln. Unterwegs treffen sie Rike Steinmann, ein Mädchen mit lockigen Haaren und einem Fahrradkorb voller Pflanzen. Am Weiher ist wegen der langen Trockenheit nur wenig Wasser. Plötzlich hängt an Janneks Angel eine Hand aus Knochen mit einem Siegelring. Jannek wird ganz schwach, und ihm wird kurz schwarz vor Augen. Dann entdecken die beiden im Wasser ein ganzes Skelett. Till ruft die Polizei. Polizeihauptkommissar Rädke stellt Jannek viele Fragen, die ihn nerven. Das Skelett bleibt über Nacht im Weiher.", "keypoints": ["Ribberow hat sich in zehn Jahren kaum verändert, nur ein paar Häuser sind neu gestrichen. Jannek fühlt sich fremd.", "Rike Steinmann wird vorgestellt: einzige Violinistin und Vegetarierin des Dorfes.", "Beim Angeln zieht Jannek eine Knochenhand mit Siegelring aus dem Weiher, dann sehen sie ein Skelett.", "Körpergefühl: Arme weich, rechtes Augenlid zuckt, Beine scheinen im Boden zu versinken, ihm wird schwarz vor Augen.", "Polizeihauptkommissar Rädke befragt Jannek. Jannek ist genervt und gereizt.", "Am nächsten Tag soll der Weiher abgepumpt werden."], "questions": [{"q": "Welchen Eindruck macht Polizeihauptmeister Rädke auf Jannek?", "answer": "Rädke trägt ein braunes Cordjackett und hat eine Knollennase und buschige Augenbrauen. Jannek findet ihn nervig, weil er ihm Fragen stellt, die ihm sinnlos vorkommen, fast wie in einem Verhör. Jannek hat sogar das Gefühl, dass sich Rädke mehr für ihn interessiert als für die Leiche, und wird gereizt.", "quote": "Jannek nervte die Befragung allmählich. Erst die zwei Polizisten, bei denen er sich wie im Kreuzverhör vorkam, und jetzt diese alte Knollennase."}, {"q": "Wie findet Jannek Ribberow jetzt, wo er älter geworden ist?", "answer": "Das Dorf hat sich kaum verändert. Nur ein paar Häuser haben einen neuen Anstrich, die meisten sind alt, grau und verrostet. Je älter Jannek wird, desto fremder fühlt er sich in Ribberow, und es nervt ihn, dass er für alle immer noch „der kleine Jensen“ ist.", "quote": "Erst hatte Jannek Ribberow vermisst, doch je älter er wurde, desto fremder fühlte er sich bei den Besuchen im Dorf."}, {"q": "Welches Körpergefühl hatte Jannek, als sie die Hand im Weiher gefischt haben?", "answer": "Janneks Arme werden weich und schwach, sein rechtes Augenlid beginnt zu zucken, und er hat das Gefühl, dass seine Beine im Boden versinken. Ihm schnürt es die Kehle zu, und kurz danach wird ihm sogar schwarz vor Augen.", "quote": "Jannek spürte, wie seine Arme weich wurden. Sein rechtes Augenlid begann zu zucken. Er hatte das Gefühl, seine Beine versanken im Boden."}], "quiz": [{"q": "Was hängt plötzlich an Janneks Angelhaken?", "o": ["Ein alter Stiefel", "Eine Knochenhand mit Siegelring", "Ein großer Hecht", "Ein Fahrradreifen"], "a": 1, "e": "Der Haken hat sich im Siegelring am Ringfinger einer Skeletthand verfangen."}, {"q": "Warum ist im Weiher so wenig Wasser?", "o": ["Jemand hat das Wasser abgelassen", "Die Polizei hat es schon abgepumpt", "Ein Damm ist gebrochen", "Wegen der langen Dürre im Sommer"], "a": 3, "e": "Till erklärt, dass es seit Monaten nicht richtig geregnet hat."}, {"q": "Wie stellt Till Rike vor?", "o": ["Als einzige Violinistin und Vegetarierin des Dorfes", "Als seine Freundin", "Als beste Fußballerin im Landkreis", "Als Tochter des Bürgermeisters"], "a": 0, "e": "Till sagt: „Rike Steinmann, einzige Violinistin und Vegetarierin des Dorfes.“"}, {"q": "In welcher Stadt wohnt Jannek jetzt?", "o": ["Sandemünde", "Berlin", "Pinzlau", "Großkumerow"], "a": 2, "e": "Jannek ist mit sechs Jahren mit seiner Mutter nach Pinzlau gezogen."}, {"q": "Was macht Till, nachdem sie das Skelett entdeckt haben?", "o": ["Er rennt weg", "Er holt Hanne", "Er ruft mit dem Handy die Polizei", "Er zieht das Skelett ans Ufer"], "a": 2, "e": "Jannek fragt Till, was man als Polizist macht, und Till antwortet: „Man ruft die Polizei.“"}], "questions2": [{"q": "Wie viele Jahre sind vergangen, seit Jannek mit seiner Mutter aus Ribberow weggezogen ist?", "answer": "Seit Jannek mit seiner Mutter aus Ribberow weggezogen ist, sind zehn Jahre vergangen. Er war damals sechs Jahre alt.", "quote": "Zehn Jahre waren vergangen, seit Jannek mit seiner Mutter weggezogen war. Er war damals sechs gewesen"}, {"q": "Beschreibe, in welchem Zustand Jannek Ribberow wieder entdeckt anhand eines Beispiels.", "answer": "Das Dorf hat sich in den zehn Jahren kaum verändert. Nur ein paar Häuser in der Hauptstraße haben einen neuen Anstrich bekommen, zum Beispiel ist die ehemalige Drogerie jetzt schweinchenrosa und ein altes, villaähnliches Haus strahlt in neuem Weiß mit blauen Fensterläden. Die meisten Häuser sind aber noch grau oder backsteinrot, manche haben graue Gardinen und verrostete Zäune und Briefkästen.", "quote": "Das Dorf hatte sich in all der Zeit kaum verändert."}, {"q": "Wo genau wohnen die Hempels?", "answer": "Die Hempels wohnen in einem einzeln stehenden, zweigeschossigen Haus. Man kommt dorthin, wenn man an der Straßenecke mit der kleinen braunen Bank in die Gasse geht, an den dreistöckigen Häuserblöcken aus den 70er Jahren vorbeiläuft und dann auf einen Sandweg abbiegt.", "quote": "bog auf einen Sandweg, der zu einem einzeln stehenden, zweigeschossigen Haus führte. Dort wohnten die Hempels."}, {"q": "Wie lautet der vollständige Name von Tills Vater?", "answer": "Tills Vater heißt Dietmar Hempel. Er ist ebenfalls Polizist.", "quote": "Dietmar bin ich, schon vergessen?"}], "audio": "audio/kap2_bc6889fa.mp3"}, {"nr": 3, "title": "Mord im Weiher?", "summary": "In der Nacht kann Jannek kaum schlafen. Er sieht den Weiher im Nebel und hört Stimmen und einen schrecklichen Schrei. Er fragt sich, ob der Mörder vielleicht noch im Dorf lebt. Am Morgen läuft er zum Weiher. Das halbe Dorf steht dort und schaut ihn misstrauisch an. Das Wasser ist abgepumpt, und das Skelett liegt auf einem alten, halben Ackerpflug. Till ruft an: Der Tote war ein Mann um die vierzig, er lag etwa fünf Jahre im Wasser und war wohl an den Pflug gebunden. Also war es Mord. Als Jannek das Hanne erzählt, zittert ihre Hand. Dann schickt sie ihn zur Apotheke nach Großkumerow. Dort trifft er Rike, und auf dem Heimweg gewinnt sie ein Radrennen gegen ihn.", "keypoints": ["Jannek kann nicht schlafen: Er sieht den Weiher im Nebel, hört Lachen, ein Knirschen und einen markerschütternden Schrei.", "Er denkt an Unfall, Selbstmord oder Mord und daran, dass der Mörder noch im Dorf sein könnte.", "Der Weiher wird abgepumpt. Das Skelett lag auf einem halben Ackerpflug, mit Seilresten: also Mord.", "Hanne erschrickt bei der Nachricht: Die Hand mit der Tasse zittert.", "Jannek holt Hannes Rheumacreme in der Apotheke in Großkumerow und trifft dort Rike, die Schlaftabletten für ihren Vater kauft.", "Rike gewinnt das Radrennen nach Ribberow knapp."], "questions": [{"q": "Wieso konnte Jannek am Abend nicht schlafen? Woran dachte er?", "answer": "Jannek ist nach dem Fund noch geschockt. Wenn er die Augen schließt, sieht er den Weiher im Nebel und hört Stimmen, Lachen, ein Knirschen und einen markerschütternden Schrei. Er denkt darüber nach, ob es ein Unfall, Selbstmord oder Mord war und ob der Mörder vielleicht noch im Dorf lebt, vielleicht sogar jemand, den er kennt.", "quote": "Ein Mord in Ribberow. Janneks Atem ging schneller. Womöglich war der Mörder noch im Dorf. Direkt in der Nachbarschaft."}, {"q": "Wie reagierte Hanne auf die Nachricht von Jannek?", "answer": "Hanne erschrickt sichtlich: Sie stellt die Tasse langsam ab, ihre Hand zittert, und sie starrt Jannek an. Danach spielt sie die Sache herunter, schneidet eine viel zu dünne Brotscheibe, meint, solche Untersuchungen funktionieren nur im Fernsehen, und beendet das Frühstück.", "quote": "Hanne setzte die Tasse langsam wieder ab, die sie gerade zum Mund führen wollte. Auf dem letzten Stück fing die Hand leicht zu zittern an."}, {"q": "Warum ging Jannek zur Apotheke? Wen traf er dort?", "answer": "Hanne schickt Jannek mit dem Fahrrad zur Apotheke nach Großkumerow, weil ihre Rheumacreme alle ist. Dort trifft er Rike, die Schlaftabletten für ihren Vater kauft.", "quote": "»Aber du kannst mit dem Rad rüber nach Großkumerow zur Apotheke fahren. Meine Rheumacreme ist alle.«"}], "quiz": [{"q": "Worauf lag das Skelett im Weiher?", "o": ["Auf einem alten Fahrrad", "Auf einem Autoreifen", "Auf einem halben Ackerpflug", "Auf einem Holzboot"], "a": 2, "e": "Till erzählt am Telefon, dass der Tote auf einem halben Ackerpflug lag und Seilreste gefunden wurden."}, {"q": "Was schätzt die Polizei zuerst über den Toten?", "o": ["Ein Mann um die 40, etwa fünf Jahre im Wasser", "Eine Frau, über hundert Jahre im Wasser", "Ein Jugendlicher, ein Jahr im Wasser", "Ein alter Mann, zwanzig Jahre im Wasser"], "a": 0, "e": "Jannek erzählt Hanne, dass es ein Mann um die 40 war, der circa fünf Jahre im Wasser lag."}, {"q": "Wie verhalten sich die Dorfbewohner am Weiher Jannek gegenüber?", "o": ["Sie begrüßen ihn freundlich", "Sie fragen ihn nach dem Fund aus", "Sie beachten ihn überhaupt nicht", "Sie verstummen und mustern ihn misstrauisch"], "a": 3, "e": "Wenn er sich einem Grüppchen nähert, hören die Gespräche auf, und manche schauen geradezu feindselig."}, {"q": "Für wen kauft Rike die Schlaftabletten?", "o": ["Für sich selbst", "Für ihren Vater", "Für Hanne", "Für ihre Mutter"], "a": 1, "e": "Rike sagt, ihr Vater nimmt die Tabletten seit fünf Jahren, weil er nicht gut einschlafen kann."}, {"q": "Wer gewinnt das Radrennen von Großkumerow nach Ribberow?", "o": ["Jannek", "Unentschieden", "Rike", "Till"], "a": 2, "e": "Kurz vor dem Ortsschild schießt Rike an Jannek vorbei, ohne aus dem Sattel zu gehen."}], "questions2": [{"q": "Beschreibe, wie Hannes Bett aussieht?", "answer": "Hanne schläft in einem großen Massivholzbett, das in der Nähe des Fensters steht. Es ist ein Ehebett, und obwohl Opa tot ist, lässt Hanne auf der rechten Seite immer noch Platz für ihn.", "quote": "er erkannte das große Massivholzbett in der Nähe des Fensters."}, {"q": "Was passiert, nachdem Jannek wieder bei Hanne ist?", "answer": "Hanne schläft schon, Jannek flüstert ihr nur »Gute Nacht« zu. In seinem Zimmer versucht er seiner Mutter eine SMS zu schreiben, aber seine Finger zittern so sehr, dass er es aufgibt. Als er die Augen schließt, sieht er den Weiher im Nebel, hört Stimmen, Lachen, ein Knirschen und einen markerschütternden Schrei, sodass er erschrocken hochfährt.", "quote": "Seine Finger zitterten, er traf die Tasten kaum."}, {"q": "Welches Buch liest Jannek gerade?", "answer": "Jannek liest ein Buch über das Leben in der Tiefsee.", "quote": "Er knipste die kleine Stehlampe an und nahm sein Buch über das Leben in der Tiefsee."}, {"q": "Wie geht es Jannek, als er am Morgen aufwacht, nach dem Fund der Leiche im Weiher? Beschreibe wie es ihm körperlich geht!", "answer": "Jannek fühlt sich ausgelaugt und verquollen wie nach einer Nachtfahrt mit dem Bus. Sein Mund ist trocken und hat einen schalen Geschmack. Er ist übermüdet, spürt aber gleichzeitig eine Unruhe und großen Hunger.", "quote": "fühlte sich so ausgelaugt und verquollen wie nach einer Nachtfahrt mit dem Bus. Sein Mund war trocken und hatte einen schalen Geschmack."}, {"q": "Wie heißt der Bäcker in der Hauptstraße?", "answer": "Die Bäckerei in der Hauptstraße heißt »Bäckerei Suckrow«. Hinter der Theke steht Frau Suckrow.", "quote": "»Bäckerei Suckrow« stand auf einem glänzenden weiß-orangefarbenen Schild."}, {"q": "Warum möchte Jannek am Morgen direkt wieder zum Weiher?", "answer": "Jannek spürt eine starke Unruhe, die ihn zum Weiher treibt. Er denkt, es ist »sein Toter«, weil er die Leiche gefunden hat, deshalb muss er so schnell wie möglich hin.", "quote": "Er musste zum Weiher. So schnell wie möglich. Es war sein Toter. Oder seine Tote. Er hatte die Leiche gefunden."}, {"q": "Was findet Jannek vor, als er wieder beim Weiher ist?", "answer": "Das halbe Dorf steht in kleinen Grüppchen am Weiher, redet leise und mustert Jannek misstrauisch. Der Weiher ist mit gelbem Plastikband abgesperrt und komplett abgepumpt, überall sind Polizisten. Im Schlamm untersuchen zwei Leute in Gummistiefeln das Skelett, das auf einem alten Metallkarren oder einer Art Pflug liegt.", "quote": "Das halbe Dorf war am Weiher versammelt. Die Bewohner standen in kleinen Grüppchen zusammen, redeten leise und sahen immer wieder zum Weiher."}, {"q": "Welche Details erfahren wir über die Todesursachen?", "answer": "Der Tote lag auf einem halben alten Ackerpflug, und es wurden Seilreste gefunden. Man vermutet, dass er an den Pflug gebunden und ertränkt wurde, also war es Mord. Es war ein Mann um die 40, der schon ungefähr fünf Jahre im Wasser lag.", "quote": "Nur, dass es ein Mann um die 40 war. Die Polizei schätzt, dass er schon circa fünf Jahre im Wasser gelegen hat."}, {"q": "Wie reagiert Hanne auf die Informationen von Jannek? Womit sollte sich die Polizei ihrer Meinung nach beschäftigen?", "answer": "Hanne erschrickt: Sie setzt langsam die Tasse ab, ihre Hand zittert, die Fingerknöchel werden weiß und sie starrt Jannek an. Sie hält die Untersuchung für sinnlos und meint, die Polizei solle sich lieber um die Raser auf der Landstraße kümmern.", "quote": "»Die sollen sich lieber mal um die Raser auf der Landstraße kümmern.«"}, {"q": "Was soll Jannek für Hanne in der Apotheke besorgen? Wo ist die Apotheke?", "answer": "Jannek soll für Hanne eine Rheumacreme kaufen, weil ihre alle ist. Die Apotheke ist im Nachbarort Großkumerow, in einer kleinen Querstraße hinter der Kirche, und sie ist ganz neu.", "quote": "»Aber du kannst mit dem Rad rüber nach Großkumerow zur Apotheke fahren. Meine Rheumacreme ist alle.«"}, {"q": "Wie viele Kilometer sind es zur Apotheke?", "answer": "Bis nach Großkumerow zur Apotheke sind es ungefähr sechs Kilometer. Jannek fährt mit dem Fahrrad etwa fünfzehn Minuten.", "quote": "Großkumerow war ungefähr sechs Kilometer entfernt und die Strecke eben."}, {"q": "Wen trifft Jannek in der Apotheke und worüber unterhält sie sich mit dem Apotheker?", "answer": "Jannek trifft Rike in der Apotheke. Sie holt Tabletten für ihren Vater, und der Apotheker ermahnt sie, dass er sich an die Dosierung halten muss. Rike antwortet genervt, dass ihr Vater weiß, was er tut, weil er die Tabletten seit fünf Jahren nimmt.", "quote": "»Mein Vater weiß, was er tut. Er nimmt diese Tabletten seit fünf Jahren«"}, {"q": "Mit welcher Geschichte irritiert Rike Jannek?", "answer": "Rike erzählt, dass der Apotheker Heinke auch in seiner Freizeit gern redet. Wenn man sich bei ihm ein Pillenrezept holt, weiß deshalb der ganze Landkreis, wie man verhütet. Jannek versteht nicht, warum sie ihm das mit der Pille erzählt.", "quote": "Wenn du dir ein Pillenrezept holst, weiß der ganze Landkreis, wie du verhütest.« Jannek sah Rike irritiert an."}, {"q": "Rike hat Janneks Meinung nach einen seltsamen Humor, warum?", "answer": "Rike macht den Witz, ihr Vater wolle sich mit den Schlaftabletten »ins Jenseits befördern«, also sich umbringen. Jannek findet das seltsam, vor allem weil Rikes Mutter wirklich Selbstmord begangen hat.", "quote": "Jannek fand, dass das ein seltsamer Humor war. Vor allem, wenn Rikes Mutter tatsächlich Selbstmord begangen hatte."}], "audio": "audio/kap3_cd19b9b5.mp3"}, {"nr": 4, "title": "Der Pflug in der Scheune", "summary": "Am Montagabend spielen Jannek und Till im Dorfkrug Darts. Alle Gäste starren sie an, und der neugierige alte Gustav will heimlich mithören. Die beiden überlegen, wer der Tote sein könnte und warum ausgerechnet ein schwerer Ackerpflug im Weiher lag. Ein Raubmord war es wohl nicht, denn der Siegelring war noch da. Till erzählt, dass Rikes Mutter sich vor etwa fünf Jahren das Leben genommen hat. Jannek sagt, dass er Rike anders findet als andere Mädchen. Am nächsten Morgen schleicht er in Opas alte Scheune. Unter einer Plane findet er die fehlende Hälfte eines Ackerpflugs. Als er herauskommt, steht Hanne da und starrt ihn schweigend an. Jannek beschließt, erst einmal niemandem davon zu erzählen.", "keypoints": ["Im Dorfkrug spekulieren Jannek und Till über den Toten und den Ackerpflug.", "Kein Raubmord, denn der Siegelring war noch da. Für Leiche und Pflug braucht man wohl zwei Leute.", "Gustav ist ein alter, neugieriger Mann mit Schirmmütze, der mithören will.", "Rikes Mutter hat sich vor etwa fünf Jahren im Wald das Leben genommen.", "In Hannes abgeschlossener Scheune findet Jannek unter einer Plane den Pflugkörper, die fehlende Hälfte des Pflugs aus dem Weiher.", "Hanne sieht ihn schweigend und eisig an. Jannek erzählt vorerst niemandem davon."], "questions": [{"q": "Worüber unterhalten sich Jannek und Till im Dorfkrug?", "answer": "Sie reden über den Toten im Weiher: wer er gewesen sein könnte, warum man ihn an einen schweren Ackerpflug gebunden hat und dass es kein Raubmord war, weil der Siegelring noch da war. Danach sprechen sie über Rike, ihren Vater und den Tod von Rikes Mutter vor etwa fünf Jahren.", "quote": "Das Einzige, was wir schon mal ausschließen können, ist Raubmord. Den fetten Siegelring hätte sich der Mörder nicht entgehen lassen."}, {"q": "Was steht in der Scheune von Janneks Opa?", "answer": "In der Scheune steht viel altes Gerümpel, zum Beispiel ein Traktor ohne Vorderräder, eine Hollywoodschaukel und eine Weihnachtspyramide. Unter einer dunklen Plane versteckt findet Jannek einen halben Ackerpflug, den Pflugkörper. Es ist genau die Hälfte, die bei dem Pflug im Weiher fehlte.", "quote": "Unter der Schutzplane lag ein halber Ackerpflug. Es war genau die Hälfte, die bei dem Ackerpflug, auf dem das Skelett gelegen hatte, fehlte."}, {"q": "Welche Informationen erhalten wir über Gustav?", "answer": "Gustav ist ein alter Mann mit Schirmmütze, der im Dorfkrug sitzt. Er kommt in die Dartecke und tut so, als würde er sich die Bilder an der Wand ansehen, weil er heimlich mithören will. Till schickt ihn weg und nennt ihn einen alten, neugierigen Mann.", "quote": "»Ein alter, neugieriger Mann. Davon gibt’s in Ribberow jede Menge.«"}], "quiz": [{"q": "Warum glaubt Till zuerst, dass der Tote nicht aus dem Dorf stammt?", "o": ["Weil er so teure Kleidung trug", "Weil in Ribberow jeder jeden kennt und niemand unbemerkt verschwindet", "Weil seine DNA unbekannt war", "Weil Hanne es gesagt hat"], "a": 1, "e": "Till sagt: „In so einem Nest wie Ribberow verschwindet man nicht einfach unbemerkt, hier kennt doch jeder jeden.“"}, {"q": "Warum schließt Till einen Raubmord aus?", "o": ["Weil der Tote kein Geld hatte", "Weil der Täter gefasst ist", "Weil der Siegelring noch an der Hand war", "Weil es nachts passiert ist"], "a": 2, "e": "Den wertvollen Siegelring hätte sich ein Räuber nicht entgehen lassen."}, {"q": "Wie kommt Jannek in die Scheune?", "o": ["Er quetscht sich durch eine Lücke bei einer losen Holzlatte", "Hanne gibt ihm den Schlüssel", "Er klettert durch das Dach", "Das Tor ist offen"], "a": 0, "e": "Beide Tore haben ein Vorhängeschloss, deshalb schiebt Jannek eine lose Latte zur Seite."}, {"q": "Wie reagiert Hanne, als Jannek aus der Scheune kommt?", "o": ["Sie schimpft laut mit ihm", "Sie fragt, was er gefunden hat", "Sie lacht", "Sie starrt ihn schweigend an, schüttelt den Kopf und geht ins Haus"], "a": 3, "e": "Hanne sagt kein Wort, ihre Augen wirken noch eisiger als sonst."}, {"q": "Was beschließt Jannek nach dem Fund in der Scheune?", "o": ["Er ruft sofort Rädke an", "Er erzählt vorerst niemandem davon", "Er wirft den Pflugkörper in den Weiher", "Er fährt nach Hause"], "a": 1, "e": "Er will warten, bis mehr bekannt ist, weil er Hanne keinen Ärger machen möchte."}], "questions2": [{"q": "In welcher Stadt befindet sich das Kriminalkommissariat?", "answer": "Das Kriminalkommissariat befindet sich in Sandemünde.", "quote": "Eine verrottete Leiche im Weiher von Ribberow hat für die Herren in Sandemünde nicht oberste Priorität."}, {"q": "Jannek meint, dass der Leichenfund auf dem Ackerpflug auch was Symbolisches hatte? Was meint er damit?", "answer": "Jannek findet, dass das Skelett auf dem Ackerpflug aussah, als würde es dort präsentiert werden. Es erinnert ihn an eine Zeremonie oder sogar an eine Opferung, so als hätte der Täter damit etwas zeigen wollen.", "quote": "»Das Skelett sah aus, als würde es auf dem Ackerpflug präsentiert werden.« Das Bild erinnerte Jannek schon die ganze Zeit an etwas. »Wie bei einer Zeremonie oder … oder einer Opferung.«"}, {"q": "Welche Vermutung hat Till, was Rike in Großkumerow gemacht haben könnte?", "answer": "Till vermutet, dass Rike in Großkumerow beim Schippereit zum Geigenunterricht war. In Wirklichkeit hat sie dort Schlaftabletten für ihren Vater geholt.", "quote": "»War wahrscheinlich beim Schippereit zum Geigenunterricht.«"}, {"q": "Wie wird Rikes Vater genannt?", "answer": "Rikes Vater wird im Dorf »Waldeinstein« genannt. Der Name kommt von seinen Haaren, die wie bei Einstein nach allen Seiten abstehen, und davon, dass er mit Rike in einem Haus am Waldrand wohnt.", "quote": "»Das kann ich mir gut vorstellen, dass der Waldeinstein die Hammerschlaftabletten braucht."}, {"q": "Was erfahren wir über Rikes Mutter?", "answer": "Rikes Mutter hat sich vor ungefähr fünf Jahren im Wald erhängt. Ihr Mann hat sie gefunden, aber erst am nächsten Tag die Polizei geholt. Sie hat keinen Abschiedsbrief hinterlassen, und im Dorf gibt es Gerüchte über ihren Tod.", "quote": "»Muss ungefähr fünf Jahre her sein. Sie hat sich im Wald erhängt. Er hat sie gefunden und erst am nächsten Tag die Polizei geholt."}, {"q": "Wofür stehen die Buchstaben LPG?", "answer": "LPG steht für Landwirtschaftliche Produktionsgenossenschaft. Darin haben sich die Bauern im Ort zusammengeschlossen, Janneks Opa nannte es eine Zwangszusammenschließung.", "quote": "zur LPG, der Landwirtschaftlichen Produktionsgenossenschaft, zusammenschlossen."}, {"q": "Warum hatte Jannek Mühe, in die Scheune zu kommen?", "answer": "Die Scheune war abgeschlossen: Am vorderen Holztor hing ein Vorhängeschloss und auch das hintere Tor war verschlossen. Früher war die Scheune nie abgeschlossen gewesen.", "quote": "Am vorderen Holztor war ein Vorhängeschloss angebracht. Früher war die Scheune nie abgeschlossen gewesen."}, {"q": "Wie gelang ihm der Eintritt, wie kam er rein?", "answer": "Jannek rüttelte am vorderen Tor und merkte, dass eine lange Holzlatte lose war. Er schob sie zur Seite, hielt die Luft an und quetschte sich durch den Spalt in die Scheune.", "quote": "Er hielt die Luft an und quetschte sich durch den Spalt in die Scheune."}, {"q": "Welchen Gegenstand in der Scheune verbindet Jannek mit seiner Mutter?", "answer": "Jannek verbindet die alte Hollywoodschaukel mit seiner Mutter. Es gibt viele Fotos von ihr und ihm auf der Schaukel, und sie liebte sie.", "quote": "Es gab etliche Fotos von seiner Mutter und ihm auf dieser Schaukel. Sie liebte das Teil."}, {"q": "Welche Entdeckung macht Jannek in der Scheune?", "answer": "Unter einer dunklen Schutzplane findet Jannek einen halben Ackerpflug. Es ist genau die Hälfte, die bei dem Ackerpflug fehlte, auf dem das Skelett im Weiher lag.", "quote": "Unter der Schutzplane lag ein halber Ackerpflug. Es war genau die Hälfte, die bei dem Ackerpflug, auf dem das Skelett gelegen hatte, fehlte."}, {"q": "Wie reagiert Hanne darauf?", "answer": "Hanne steht plötzlich auf dem Hof und sieht Jannek regungslos und mit eisigen Augen an. Sie sagt kein Wort, schüttelt nur langsam den Kopf, als hätte er etwas Schlimmes getan, und geht dann schweigend zurück ins Haus.", "quote": "Dann wandte Hanne den Blick ab, drehte sich um und ging ohne ein Wort zurück ins Haus."}], "audio": "audio/kap4_562f1eef.mp3"}, {"nr": 5, "title": "Der Tote hat einen Namen", "summary": "Till kommt in der Mittagspause und hat Neuigkeiten. Der Tote heißt Frank Schelk, war sechsunddreißig Jahre alt und kam aus Großkumerow. Er ist nicht ertrunken, sondern durch Gewalt gestorben. Erst danach wurde er an den Pflug gebunden. Die Polizei kannte seine DNA aus einem alten Verdachtsfall. Jannek hat das Gefühl, dass Hanne heimlich zuhört. Am Telefon ist Janneks Mutter geschockt, denn sie kannte Schelk aus der Schule. Sie fragt besorgt, ob Hanne etwas gesagt hat. Am Abend erzählt Tills Vater, dass Schelk ein unbeliebter Frauenheld war und krumme Geschäfte gemacht hat. Am nächsten Morgen liest Jannek einen Artikel über den Fall in der Zeitung. Vor dem Konsum tratschen Leute aus dem Dorf und verdächtigen Rikes Vater.", "keypoints": ["Der Tote ist Frank Schelk aus Großkumerow, beim Tod 36 Jahre alt, seit fünf Jahren im Weiher.", "Er starb durch äußere Gewalt und wurde erst danach an das Pflugteil gebunden: Mord.", "Er war in der DNA-Kartei, weil er einmal in einem Fall in Sandemünde verdächtigt wurde. Nachgewiesen wurde ihm nichts.", "Janneks Mutter ist geschockt: Sie kannte Schelk von der Schule in Großkumerow und fragt nach Hanne.", "Herr Hempel: Schelk war Frauenheld, Schmarotzer, machte krumme Geschäfte bei der LPG-Auflösung und zog nach Berlin.", "Im Dorf wird getratscht, dass Rikes Vater, der „Waldeinstein“, der Mörder sei."], "questions": [{"q": "Warum war Janneks Mutter so schockiert?", "answer": "Janneks Mutter kannte Frank Schelk persönlich, denn sie war mit ihm auf derselben Schule in Großkumerow. Als sie den Namen hört, wird ihre Stimme belegt, sie atmet schwer und fragt besorgt, ob Hanne davon weiß und ob sie etwas gesagt hat.", "quote": "Jannek hörte, wie seine Mutter schwer atmete. Sie antwortete erst nach ein paar Sekunden. »Ja, ich kannte ihn.«"}, {"q": "Welche Informationen erhalten wir über das Mordopfer?", "answer": "Der Tote heißt Frank Schelk, kam aus Großkumerow, war bei seinem Tod 36 Jahre alt und starb vor fünf Jahren durch äußere Gewalt, erst danach wurde er an den Pflug gebunden. Er war in der DNA-Kartei der Polizei, weil er früher einmal bei einer Vergewaltigung in Sandemünde zu den Verdächtigen gehörte, nachgewiesen wurde ihm aber nichts. Er galt als Frauenheld, machte krumme Geschäfte bei der Auflösung der LPG, war unbeliebt und zog vor etwa 17 Jahren nach Berlin.", "quote": "Er muss zum Todeszeitpunkt 36 Jahre alt gewesen sein. Er war in der Datei, weil er bei einer Vergewaltigung in Sandemünde mal zu den Verdächtigen gezählt hatte."}], "quiz": [{"q": "Woran ist Frank Schelk laut Polizei gestorben?", "o": ["Er ist im Weiher ertrunken", "An einer Vergiftung", "Durch äußere Gewalt, danach wurde er an den Pflug gebunden", "Er ist erfroren"], "a": 2, "e": "Till sagt, Schelk starb nicht durch Ertrinken. Die Leiche wurde nachträglich an das Pflugteil gebunden."}, {"q": "Wie hat die Polizei herausgefunden, wer der Tote ist?", "o": ["Durch seine DNA, die schon in der Polizeikartei war", "Durch einen Ausweis in seiner Tasche", "Durch den Namen im Siegelring", "Durch einen Zeugen"], "a": 0, "e": "Aus den Knochen wurde eine DNA-Analyse gemacht, und Schelk war bereits in der Kartei."}, {"q": "Warum wurde Schelk nie als vermisst gemeldet?", "o": ["Weil alle froh waren, dass er weg war", "Weil er nach China ausreisen wollte und keine lebenden Angehörigen hatte", "Weil die Polizei die Meldung verloren hat", "Weil er einen falschen Namen hatte"], "a": 1, "e": "Das steht im Zeitungsartikel: Ein Geschäftspartner sagt, Schelk wollte vor fünf Jahren nach China."}, {"q": "Wen hält Herr Hempel für den Täter?", "o": ["Rikes Vater", "Hanne", "Einen Durchreisenden", "Einen Geschäftspartner aus Berlin"], "a": 3, "e": "Herr Hempel glaubt, Schelk schuldete einem Geschäftspartner Geld oder hatte ihn betrogen."}, {"q": "Wen verdächtigen die Frauen vor dem Konsum?", "o": ["Till", "Den Waldeinstein, also Rikes Vater", "Den Apotheker", "Die Barfrau Sabine"], "a": 1, "e": "Sie tratschen, dass der „verrückte“ Waldeinstein Schelk umgebracht haben könnte. Beweise gibt es dafür keine."}], "questions2": [{"q": "Welche Erkenntnis gewinnt Jannek über die Todesursache?", "answer": "Der Tote ist nicht ertrunken, sondern durch äußere Gewalt gestorben: Seine Schädeldecke war zertrümmert, vermutlich hatte er einen Genickbruch und eine Hand war gebrochen. Er war schon tot, als man ihn an das Pflugteil band und in den Weiher warf, deshalb muss es Mord gewesen sein.", "quote": "Fakt ist auch: Der Tote starb nicht durch Ertrinken.«"}, {"q": "Welche Erkenntnisse gewinnt Jannek über den Toten?", "answer": "Der Tote heißt Frank Schelk und war beim Tod 36 Jahre alt. Die Polizei kennt ihn aus ihrer DNA-Kartei, weil er einmal bei einer Vergewaltigung in Sandemünde verdächtigt wurde. Er kam aus Großkumerow, ist vor über fünfzehn Jahren weggezogen und war laut Herrn Hempel ein unbeliebter Frauenheld mit krummen Geschäften.", "quote": "»Unser Toter heißt beziehungsweise hieß Frank Schelk. Er muss zum Todeszeitpunkt 36 Jahre alt gewesen sein."}, {"q": "Warum hat Till aufgehört zu rauchen?", "answer": "Till hat mit achtzehn aufgehört zu rauchen, weil er eine schwere Bronchitis hatte. Das ist ungefähr drei Jahre her.", "quote": "»Aber das ist Gift für meine Lungen. Hatte doch mal ’ne schwere Bronchitis. Was meinst du denn, warum ich nicht mehr rauche?«"}, {"q": "Welche Vermutung hat Tills Vater, wie und warum Schelk umgebracht wurde?", "answer": "Herr Hempel glaubt, dass Schelks Geschäftsfreunde aus Berlin ihn umgebracht haben, weil er einem Geschäftspartner Geld schuldete, ihn betrogen oder sitzen gelassen hatte. Den Ackerpflug hätten sie irgendwo in der Nähe gefunden, vielleicht auf dem Gerümpelhaufen vom Waldeinstein, und Schelk als makabren Scherz im Teich seiner Kindheit versenkt.", "quote": "»Wenn ihr mich fragt, ist der Fall ziemlich klar. Schelk schuldete einem Geschäftspartner Geld oder hatte ihn betrogen oder sitzen gelassen"}, {"q": "Wo erledigt Jannek den kleinen Einkauf?", "answer": "Jannek kauft im Dorfkonsum ein. Der Konsum liegt direkt neben dem Festplatz des Dorfes.", "quote": "Der Konsum lag direkt neben dem Festplatz des Dorfes."}, {"q": "Was kauft er alles ein?", "answer": "Jannek kauft Nudeln, Bockwürste, Schinken, Sahne und andere Lebensmittel. Dazu nimmt er Chips, eine Cola und die Zeitung, den Sandemünder Generalanzeiger.", "quote": "Jannek füllte seinen Einkaufskorb mit Nudeln, Bockwürsten, Schinken, Sahne und anderen Lebensmitteln. Dann legte er noch ein paar Chips und eine Cola in den Korb"}, {"q": "Jannek hört einem Gespräch zu, das die Dorfbewohner führen. Was ist der Inhalt des Gesprächs? Was wird spekuliert?", "answer": "Zwei Frauen um die 50 und ein alter Mann reden vor dem Konsum über den Mord. Die Frauen verdächtigen den Waldeinstein: Er sei verrückt, vielleicht liege die andere Pflughälfte auf seinem Gerümpelhaufen, und vielleicht war auch der Tod seiner Frau gar kein Selbstmord. Sie vermuten, er habe Schelk und seine Frau zusammen erwischt und deshalb umgebracht, während der alte Mann nur erzählt, wie nett Schelk als Junge war.", "quote": "»Also, wenn ich Kriminalkommissarin wäre, würde ich mir mal folgende Theorie durch den Kopf gehen lassen: Der Waldeinstein hat damals den Schelk und seine Frau zusammen beim trauten Stelldichein erwischt, und dann …«"}], "audio": "audio/kap5_f1796948.mp3"}, {"nr": 6, "title": "Schrott wird lebendig", "summary": "Jannek trifft Rike im Dorf und hilft ihr, ihre Einkäufe nach Hause zu bringen. Unterwegs erzählt er ihr, dass er seinen Vater nie kennengelernt hat. Vor dem Haus der Steinmanns liegt ein großer Schrotthaufen, aber kein Ackerpflug. Rikes Vater Robert hat einen festen Händedruck und wilde Haare. Er baut aus Schrott Figuren und nennt das Reinkarnation. Eine Figur aus Draht sieht für Jannek aus wie eine Nymphe. Rike erzählt, dass ihr Vater erst ungefähr ein Jahr nach dem Tod ihrer Mutter mit dem Schrottsammeln angefangen hat. Kurz glaubt Rike, dass Jannek nur spionieren will. Danach trifft Jannek Till. Als er erzählt, dass er bei Rike war, wird Till wütend und fährt einfach davon.", "keypoints": ["Jannek hilft Rike Steinmann mit den Einkäufen und darf mit ins Haus.", "Jannek hat seinen Vater nie kennengelernt.", "Robert baut aus Schrott Figuren und Wesen („Reinkarnation“). Eine Drahtfigur nennt Jannek Nymphe.", "Robert sammelt Schrott erst seit etwa einem Jahr nach dem Tod seiner Frau, also seit drei bis vier Jahren. Vor fünf Jahren hatte er also noch keinen Schrott.", "Rike vermutet kurz, dass Jannek spionieren will.", "Till wird wütend, weil Jannek bei Rike war und die Theorie seines Vaters unlogisch findet."], "questions": [{"q": "Was macht Robert mit all dem Schrott?", "answer": "Robert baut aus dem Schrott Figuren und Wesen, die wie Menschen, Tiere oder Fantasiewesen aussehen. Er sagt, er haucht dem Schrott Leben ein, wie bei einer Reinkarnation.", "quote": "»Dem Schrott hauche ich Leben ein und verwandle ihn in neue Wesen. Ein bisschen wie Reinkarnation.«"}, {"q": "Wie nennt Jannek die Figur?", "answer": "Jannek nennt die weibliche Figur aus Drahtgitter eine Nymphe.", "quote": "»Sie sieht aus wie eine Nymphe.«"}, {"q": "Wie lautet Rikes voller Name?", "answer": "Rike heißt mit vollem Namen Rike Steinmann. Till stellt sie Jannek so vor, als sie sich im zweiten Kapitel zum ersten Mal begegnen.", "quote": "Darf ich vorstellen: Rike Steinmann, einzige Violinistin und Vegetarierin des Dorfes."}, {"q": "Warum war Till sauer auf Jannek?", "answer": "Till ärgert sich, weil Jannek einfach bei Rike im Haus war, wo sonst kaum jemand hineindarf, und weil Jannek die Theorie von Tills Vater über den Berliner Geschäftsmann unlogisch findet. Till sagt, Jannek solle nicht den großen Macker aus der Stadt spielen. Der eigentliche Grund ist Eifersucht, denn Till ist in Rike verliebt, wie man in Kapitel 7 erfährt.", "quote": "»Du hast was?« Till starrte Jannek einen Moment an. »Niemand besucht Rike einfach so.«"}, {"q": "Wann hat Robert mit dem Sammeln von Schrott angefangen?", "answer": "Robert hat ungefähr ein Jahr nach dem Tod seiner Frau angefangen, Schrott zu sammeln. Das ist etwa drei bis vier Jahre her.", "quote": "»Ungefähr ein Jahr nach dem Tod meiner Mutter hat er angefangen, Schrott zu sammeln«"}], "quiz": [{"q": "Was will Rike mit den vielen Pflanzen machen?", "o": ["Sie verkaufen", "Einen Wintergarten im neuen Anbau anlegen", "Sie Hanne schenken", "Tee daraus kochen"], "a": 1, "e": "Ihr Vater hat einen Anbau mit großen Glasfenstern gebaut. Dort soll es im Winter grün sein."}, {"q": "Wie viel wollte ein angeblicher Kunstkenner pro Figur bezahlen?", "o": ["Tausend Euro", "Hundert Euro", "Fünfzig Euro", "Zehn Euro"], "a": 3, "e": "Robert ist darüber so empört, dass er dem Käufer am liebsten einen Tritt geben würde."}, {"q": "Was erzählt Jannek Rike über seinen Vater?", "o": ["Er hat ihn nie kennengelernt", "Er wohnt in Berlin", "Er ist Polizist", "Er ist vor einem Jahr gestorben"], "a": 0, "e": "Jannek sagt, seine Mutter habe ihm nicht viel über ihn erzählt. Er fühlt sich manchmal, als würde ihm ein Teil fehlen."}, {"q": "Warum hält Jannek das Gerücht über Robert für unlogisch?", "o": ["Weil Robert ein Alibi hat", "Weil Robert Vegetarier ist", "Weil Robert vor fünf Jahren noch gar keinen Schrott gesammelt hat", "Weil Robert damals im Ausland war"], "a": 2, "e": "Robert sammelt Schrott erst seit etwa drei oder vier Jahren, der Mord war aber vor fünf Jahren."}, {"q": "Wie reagiert Rike, als Jannek nach dem Zeitpunkt fragt?", "o": ["Sie lacht ihn aus", "Sie wird misstrauisch und fragt, ob er spionieren will", "Sie weint", "Sie ruft ihren Vater"], "a": 1, "e": "Rike fragt: „Hast du mir deshalb geholfen? Um hier rumzuspionieren?“"}], "questions2": [], "audio": "audio/kap6_fd5373f9.mp3"}, {"nr": 7, "title": "Zwei Freunde, ein Mädchen", "summary": "Am Abend sucht Jannek seinen Freund Till und findet ihn am leeren Weiher. Till gibt zu, dass er schon seit sechs Jahren in Rike verliebt ist. Jannek merkt, dass er auch Gefühle für sie hat. Die beiden beschließen, dass Rike selbst entscheiden soll und sie trotzdem Freunde bleiben. In Tills Zimmer erzählt Jannek ihm von dem Pflugteil in Hannes Scheune. Tills Eltern wollen über Schelk nicht reden, und Herr Hempel schlägt sogar wütend auf den Tisch. Dann fragt Jannek endlich Hanne nach dem Pflug. Sie sagt nur, er hätte Opa fragen müssen, und geht in ihr Zimmer. Im Dorfkrug erfahren die Jungen von der Barfrau Sabine, dass Schelk dort früher oft getrunken hat.", "keypoints": ["Till ist in Rike verliebt, seit sie hergezogen ist (er war 15, sie 11). Er wartet seit sechs Jahren.", "Jannek merkt, dass Rike „etwas mit ihm gemacht“ hat. Beide wollen, dass Rike selbst entscheidet, und Freunde bleiben.", "Jannek erzählt Till vom Pflugkörper: Es ist der alte Ackerpflug der Jensens.", "Herr Hempel will nicht über Schelk und Schwericke reden und schlägt auf den Tisch.", "Hanne sagt zum Pflug nur: „Das hättest du Opa fragen müssen.“", "Plan: Schule in Großkumerow und Bibliothek in Sandemünde durchsuchen."], "questions": [{"q": "Was denken Jannek und Till über Rike?", "answer": "Beide sind in Rike verliebt. Till ist schon in sie verknallt, seit sie ins Dorf gezogen ist, er hat sie oft eingeladen und wartet seit sechs Jahren, doch sie hat ihn immer abgewiesen. Jannek merkt, dass Rike etwas mit ihm gemacht hat, und beide beschließen, dass Rike selbst entscheiden soll und sie trotzdem Freunde bleiben.", "quote": "»Stimmt. Da ist etwas. Ich weiß nicht, ob ich etwas mit ihr gemacht habe, aber sie hat auf jeden Fall etwas mit mir gemacht.«"}], "quiz": [{"q": "Wie alt waren Till und Rike, als Rike nach Ribberow zog?", "o": ["Till 15, Rike 11", "Till 18, Rike 16", "Till 12, Rike 12", "Till 21, Rike 16"], "a": 0, "e": "Till sagt: „Obwohl ich erst fünfzehn war, als sie hierherzog, und sie erst elf.“"}, {"q": "Was antwortet Hanne, als Jannek sie nach dem Pflug fragt?", "o": ["„Den hat jemand gestohlen.“", "„Den habe ich nie gesehen.“", "„Das hättest du Opa fragen müssen.“", "„Ruf die Polizei.“"], "a": 2, "e": "Hanne nickt nur kaum merklich, sagt diesen Satz und geht ins Schlafzimmer."}, {"q": "Wie reagiert Herr Hempel auf die Fragen zu Schelk und der LPG?", "o": ["Er erzählt alles ganz genau", "Er lacht und macht Witze", "Er ruft Rädke an", "Er schlägt mit der Faust auf den Tisch"], "a": 3, "e": "Er will sich den Feierabend nicht verderben lassen und sagt, Schelk sei „längst vermodert“."}, {"q": "Wer ist Schwericke?", "o": ["Der Apotheker", "Der Wirt vom Dorfkrug", "Ein Polizist aus Berlin", "Der Leiter des Biobauernhofs bei Großkumerow"], "a": 3, "e": "Till erzählt, Schwericke war bei der LPG-Auflösung „dicke mit dabei“, genau wie Schelk."}, {"q": "Was erzählt die Barfrau Sabine über Schelk?", "o": ["Er hat im Dorfkrug viel getrunken", "Er war ihr Freund", "Sie hat ihn nie gesehen", "Er hat den Dorfkrug gekauft"], "a": 0, "e": "Sabine sagt, Schelk habe „jesoffen wie ein Loch“, weiß aber nicht mehr, wann genau er da war."}], "questions2": [], "audio": "audio/kap7_46f62c43.mp3"}, {"nr": 8, "title": "Spurensuche in der Vergangenheit", "summary": "Till und Jannek fahren nach Großkumerow zur alten Schule, in die auch Schelk gegangen ist. Hausmeister Harry lässt sie hinein. In der Abschlusszeitung finden sie Fotos von Schelk. Auf einem Bild singt er in einer Band, und Tills Vater spielt Gitarre. Auf einem anderen Foto steht Tills Mutter neben ihm und himmelt ihn an. Danach suchen die beiden in der Bibliothek in Sandemünde in alten Zeitungen. Sie lesen, dass Schelk zusammen mit Schwericke die LPG aufgelöst hat. Viele Leute bekamen dabei nur wenig Geld und waren deshalb wütend. Außerdem finden sie einen Bericht über den Tod von Rikes Mutter. Am Ende beschließen die beiden, Schwericke selbst zu befragen.", "keypoints": ["Hausmeister Harry öffnet ihnen die Grundschule Großkumerow, früher „Polytechnische Oberschule Friedrich Engels“.", "Schelk wurde 1967 geboren und ging etwa von 1973 bis 1983 zur Schule.", "Abschlusszeitung 1983: Bandfoto mit Schelk am Mikrofon und Tills Vater an der Gitarre, Foto mit Tills Mutter Marianne (damals Wilke). Knubs war in Schelks Klasse.", "Bibliothek Sandemünde: Schwericke (früher LPG-Vorsitzender) und sein Assistent Schelk lösten die LPG auf.", "Artikel „LPG-Glücksritter“: Viele frühere Mitglieder wurden mit einer billigen Abfindung abgespeist.", "Schwericke gründete später einen großen Biobauernhof. Die Jungen wollen ihn befragen."], "questions": [{"q": "Was finden Jannek und Till in der Schule heraus?", "answer": "In der Abschlusszeitung von 1983 finden sie ein Foto von einer Band: Schelk singt am Mikrofon, und Tills Vater spielt Gitarre. Auf einem anderen Foto steht Schelk am See zwischen Mädchen, darunter Tills Mutter Marianne, die ihn anhimmelt. Außerdem sehen sie, dass Knubs, also Andreas Knuse, mit Schelk in einer Klasse war.", "quote": "»Ist das an der Gitarre nicht dein Vater?«, fragte Jannek."}, {"q": "Wer öffnet Jannek und Till die Tür?", "answer": "Hausmeister Harry öffnet ihnen die Tür. Er wohnt in einer kleinen Wohnung im Nebengebäude der Schule und kennt Till von früher.", "quote": "»Till? Bist du das? Warte, ich komme vorne rum und mach dir auf«"}, {"q": "Von wann bis wann ging Frank Schelk zur Schule?", "answer": "Frank Schelk ging etwa von 1973 bis 1983 in Großkumerow zur Schule. Das rechnet Jannek aus, weil Schelk 1967 geboren wurde.", "quote": "»… etwa von 1973 bis 1983 hier zur Schule gegangen sein«, sagte Jannek."}, {"q": "Was gründete Schwerike?", "answer": "Schwericke, der frühere Vorsitzende der LPG, hat später einen großen Biobauernhof bei Großkumerow aufgebaut.", "quote": "»War früher LPG-Vorsitzender und später hat er den großen Biobauernhof aufgebaut.«"}], "quiz": [{"q": "Wie hieß die Schule in Großkumerow früher?", "o": ["Gymnasium Sandemünde", "Polytechnische Oberschule Friedrich Engels", "Realschule Ribberow", "Heinz-Jensen-Schule"], "a": 1, "e": "Über der Holztür stand früher dieser Name, heute steht dort „Grundschule Großkumerow“."}, {"q": "Welche Anzeige steht von Schelk in der Abschlusszeitung?", "o": ["„Suche Lupe für meine Hieroglyphen.“", "„Tausche Schulstuhl gegen Sessel.“", "„Suche Band, die mich singen lässt.“", "„Suche Rücknahmestelle für meine Verflossenen.“"], "a": 3, "e": "Die Anzeige zeigt, dass Schelk schon mit sechzehn als Frauenheld galt."}, {"q": "Wer ist Andreas Knuse?", "o": ["Knubs aus dem Dorfkrug", "Der Hausmeister", "Schwerickes Sohn", "Der Apotheker"], "a": 0, "e": "Knubs war mit Schelk in einer Klasse und sitzt heute fast immer im Dorfkrug."}, {"q": "Wie alt war Schelk, als er die LPG mit auflöste?", "o": ["16 Jahre", "36 Jahre", "23 Jahre", "40 Jahre"], "a": 2, "e": "Jannek wundert sich: „Der war doch gerade mal 23 damals.“"}, {"q": "Warum hatten viele Leute einen Grund, auf Schelk sauer zu sein?", "o": ["Weil er ihre Tiere gestohlen hat", "Weil viele bei der LPG-Auflösung nur eine billige Abfindung bekamen", "Weil er den Weiher verschmutzt hat", "Weil er die Schule geschlossen hat"], "a": 1, "e": "Laut dem Artikel „LPG-Glücksritter“ lief die Übernahme auf Kosten vieler ehemaliger Mitglieder."}], "questions2": [], "audio": "audio/kap8_70e1c41c.mp3"}], "characters": [{"name": "Jannek Jensen", "who": "Die Hauptfigur, sechzehn Jahre alt, wohnt mit seiner Mutter in Pinzlau und ist in Ribberow aufgewachsen. Till nennt ihn „J.J.“, im Dorf ist er immer noch „der kleine Jensen“.", "first_chapter": 1}, {"name": "Hanne Jensen", "who": "Janneks Oma mit eisblauen Augen und schneeweißen Haaren. Sie ist streng und wortkarg und verhält sich seltsam, wenn es um den Toten und den Pflug in der Scheune geht.", "first_chapter": 1}, {"name": "Heinz Jensen (Opa)", "who": "Janneks Opa, vor einem halben Jahr gestorben. Er war im ganzen Dorf beliebt, die Scheune war sein Revier.", "first_chapter": 1}, {"name": "Janneks Mutter", "who": "Sie hat zwei Jobs und geht zur Abendschule. Sie kannte Frank Schelk von der Schule in Großkumerow und ist geschockt, als sie von seinem Tod hört.", "first_chapter": 1}, {"name": "Till Hempel", "who": "Janneks Kinderfreund, 21 Jahre alt, Polizeimeister in der Probezeit mit blonden Locken. Er ist seit Jahren in Rike verliebt.", "first_chapter": 1}, {"name": "Rike Steinmann", "who": "Ein Mädchen in Janneks Alter mit hellbraunen Locken, einzige Violinistin und Vegetarierin des Dorfes. Sie fährt sehr schnell Rad und liebt Pflanzen. Ihre Mutter ist vor fünf Jahren gestorben.", "first_chapter": 1}, {"name": "Robert Steinmann", "who": "Rikes Vater, im Dorf „Waldeinstein“ genannt, weil seine Haare abstehen und er am Waldrand wohnt. Er baut Figuren aus Schrott. Im Dorf wird getratscht, er sei der Mörder.", "first_chapter": 1}, {"name": "Rikes Mutter", "who": "Sie hat sich vor fünf Jahren, am 15. Oktober, im Wald das Leben genommen. Vorher war sie plötzlich sehr verschlossen geworden.", "first_chapter": 1}, {"name": "Dietmar Hempel", "who": "Tills Vater, Polizist mit großem Bauch. Er kannte Schelk und spielte früher mit ihm in einer Band, will aber nicht über ihn reden.", "first_chapter": 2}, {"name": "Marianne Hempel", "who": "Tills Mutter, früher Marianne Wilke. Auf einem alten Schulfoto steht sie neben Schelk und himmelt ihn an.", "first_chapter": 2}, {"name": "Rädke", "who": "Polizeihauptkommissar von der Kripo Sandemünde mit Knollennase und Cordjackett. Er befragt Jannek nach dem Fund.", "first_chapter": 2}, {"name": "Frank Schelk", "who": "Der Tote im Weiher, geboren 1967 in Großkumerow, beim Tod 36 Jahre alt. Er galt als Frauenheld und machte krumme Geschäfte, später lebte er in Berlin.", "first_chapter": 5}, {"name": "Frau Suckrow", "who": "Die gelangweilte Verkäuferin in der Bäckerei Suckrow in Ribberow.", "first_chapter": 3}, {"name": "Heinke", "who": "Der redselige Apotheker in Großkumerow.", "first_chapter": 3}, {"name": "Gustav", "who": "Ein alter, neugieriger Mann mit Schirmmütze im Dorfkrug, der heimlich mithören will.", "first_chapter": 4}, {"name": "Sabine", "who": "Die Barfrau im Dorfkrug, die dort seit sieben Jahren arbeitet. Sie erzählt, dass Schelk viel getrunken hat.", "first_chapter": 7}, {"name": "Knubs (Andreas Knuse)", "who": "Ein Mann, der seit zwanzig Jahren im Dorfkrug sitzt. Er war mit Schelk in einer Klasse und will nicht über ihn reden.", "first_chapter": 7}, {"name": "Schwericke", "who": "Früher Vorsitzender der LPG, heute Leiter eines großen Biobauernhofs bei Großkumerow. Er löste mit Schelk die LPG auf.", "first_chapter": 7}, {"name": "Harry", "who": "Der Hausmeister der Schule in Großkumerow. Er lässt Jannek und Till in das Archiv mit den alten Schülerzeitungen.", "first_chapter": 8}, {"name": "Heike Popitz", "who": "Früher Heike Reinhardt, eine Mitschülerin von Schelk. Sie arbeitet heute an der Tankstelle vor Sandemünde.", "first_chapter": 8}], "places": [{"name": "Ribberow", "what": "Das kleine Dorf, in dem Hanne wohnt und Jannek aufgewachsen ist. Hier kennt jeder jeden, und es wird viel getratscht."}, {"name": "Der Weiher (Dorfteich)", "what": "Der Teich am Dorfrand. Wegen der Dürre ist er fast leer, hier finden Jannek und Till das Skelett."}, {"name": "Hannes Backsteinhaus mit Hof und Scheune", "what": "Das alte rotbraune Haus der Jensens. In der abgeschlossenen Scheune steht unter einer Plane der halbe Ackerpflug."}, {"name": "Haus der Steinmanns", "what": "Ein rötlich-braunes Haus am Waldrand mit einem Schrotthaufen davor und Roberts Schrottfiguren im Garten."}, {"name": "Dorfkrug", "what": "Die Kneipe von Ribberow mit Dartscheibe. Hier sitzen Gustav, Knubs und Barfrau Sabine."}, {"name": "Großkumerow", "what": "Das Nachbardorf, etwa sechs Kilometer entfernt. Hier sind die Apotheke und die alte Schule, Schelk stammt von hier."}, {"name": "Sandemünde", "what": "Die nächste Stadt mit Bahnhof, Kripo und Bibliothek mit alten Zeitungen."}, {"name": "Pinzlau", "what": "Die Stadt, in der Jannek mit seiner Mutter wohnt."}, {"name": "Bäckerei Suckrow und Dorfkonsum", "what": "Die kleinen Läden in Ribberow. Vor dem Konsum hört Jannek, wie Leute Rikes Vater verdächtigen."}, {"name": "Grundschule Großkumerow", "what": "Früher „Polytechnische Oberschule Friedrich Engels“. Hier finden die Jungen die Abschlusszeitung von 1983."}], "timeline": ["Kapitel 1: Jannek fährt in den Herbstferien mit Zug und Bus nach Ribberow, Till nimmt ihn das letzte Stück im Auto mit.", "Kapitel 1: Bei Hanne: Blut vom Kaninchen auf dem Tisch, Kekse von der Mutter, Jannek hackt Holz.", "Kapitel 2: Auf dem Weg zum Angeln treffen Jannek und Till Rike Steinmann.", "Kapitel 2: Jannek angelt eine Knochenhand, dann entdecken sie ein Skelett. Rädke befragt Jannek.", "Kapitel 3: Der Weiher wird abgepumpt, das Skelett lag auf einem halben Ackerpflug: Mord. Hanne erschrickt.", "Kapitel 3: Apotheke in Großkumerow, Treffen mit Rike, Radrennen.", "Kapitel 4: Darts im Dorfkrug, danach findet Jannek in Hannes Scheune den fehlenden Pflugkörper.", "Kapitel 5: Der Tote ist Frank Schelk. Janneks Mutter ist am Telefon geschockt. Zeitungsartikel und Dorfklatsch über Rikes Vater.", "Kapitel 6: Jannek besucht Rike und lernt Robert und seine Schrottfiguren kennen. Till fährt wütend davon.", "Kapitel 7: Aussprache am Weiher: Beide sind in Rike verliebt. Jannek erzählt Till vom Pflug, Hanne weicht aus.", "Kapitel 8: In der Schule in Großkumerow entdecken sie das Bandfoto mit Tills Vater und Schelk.", "Kapitel 8: In der Bibliothek lesen sie über die LPG-Auflösung durch Schwericke und Schelk und beschließen, Schwericke zu befragen."], "spelling": {"intro": "Diese Wörter kommen in der Arbeit garantiert vor. Achte besonders darauf: <b>Nomen und Namen schreibt man groß!<\/b> (der Zug, die Apotheke, Jannek, Ribberow)", "items": [{"wrong": "kapittel", "right": "Kapitel", "tip": "Nomen groß, nur ein t."}, {"wrong": "Janek", "right": "Jannek", "tip": "Name mit zwei n."}, {"wrong": "riberow", "right": "Ribberow", "tip": "Ortsname groß, zwei b."}, {"wrong": "Rätke", "right": "Rädke", "tip": "Mit d: Polizeihauptkommissar Rädke."}, {"wrong": "abotenke", "right": "Apotheke", "tip": "A-po-the-ke, mit p und th."}, {"wrong": "reuma krem", "right": "Rheumacreme", "tip": "Ein tatt seine Gefühle zu zeigen. Er ist aber auch neugierig und gibt nicht so schnell auf: Obwohl ihn der Fund des Skeletts schockiert, versucht er zusammen mit Till herauszufinden, wer Frank Schelk war. Mit seiner strengen Oma kommt er nur schwer zurecht, Till ist sein alter Kindheitsfreund, und für Rike interessiert er sich immer mehr.", "intro": "Hi, ich bin Jannek, sechzehn, aus Pinzlau. Dunkelbraune, störrische Haare, weiße Turnschuhe, und wenn mich etwas richtig fertigmacht, zuckt mein rechtes Augenlid. Eigentlich wollte ich nur eine langweilige Ferienwoche bei meiner Oma Hanne in Ribberow absitzen. Dann habe ich beim Angeln mit Till eine Knochenhand aus dem Weiher gezogen. Seitdem will ich wissen, wer dieser Tote war und warum Hanne so komisch reagiert.", "quotes": [{"text": "Jannek fuhr sich durch die dunkelbraunen, störrischen Haare und nickte.", "ch": 1}, {"text": "Hanne blickte auf seine weißen Turnschuhe.", "ch": 1}, {"text": "Sein rechtes Augenlid zuckte", "ch": 3}], "quiz": [{"q": "Woran erkennt man, dass Jannek sehr aufgeregt ist?", "o": ["Sein rechtes Augenlid zuckt.", "Er bekommt rote Ohren.", "Er fängt an zu stottern.", "Er kaut an den Fingernägeln."], "a": 0, "e": "Nach dem Fund im Weiher und nach Tills Anruf zuckt Janneks Lid."}, {"q": "Welche Haare hat Jannek?", "o": ["Dunkelbraune, störrische Haare", "Blonde Locken", "Schneeweiße Haare", "Graubraune, abstehende Haare"], "a": 0, "e": "Schon im ersten Kapitel fährt er sich durch die dunkelbraunen, störrischen Haare."}], "img": "people/jannek_b2dfa6eb.jpg", "audio": "audio/intro_jannek_7579d050.mp3", "img_note": "Das Bild ist eine Illustration. Nicht alles davon steht im Buch, zum Beispiel: schlanke Statur, Augenfarbe dunkel, Jeans."}, {"id": "till", "name": "Till Hempel", "call": "Till", "short": "Janneks Kumpel, junger Polizeimeister, 21", "role": "Till ist Janneks Kindheitsfreund und Sohn von Dietmar Hempel, arbeitet als Polizeimeister in der Probezeit und ist seit Jahren in Rike verliebt.", "age": "21", "gender": "m", "looks": ["blonde Locken", "Wangen, die beim Lachen leuchten", "funkelnde Augen", "Polizeiuniform bzw. Uniformjacke", "graue Jacke", "fährt Auto, hat ein Handy"], "traits": ["locker", "witzig", "frech", "hilfsbereit", "neugierig", "treu"], "description": "Till Hempel ist 21 Jahre alt und Janneks bester Freund aus Kindertagen. Er ist Polizeimeister in der Probezeit und wohnt noch bei seinen Eltern in Ribberow. Till hat blonde Locken und Augen, die oft frech funkeln. Wenn er lacht, leuchten seine Wangen. Im Dienst trägt er eine Polizeiuniform, in der Freizeit zum Beispiel eine graue Jacke. Till ist locker und witzig, macht ständig Sprüche und nennt Jannek „J.J.“. Er ist hilfsbereit und neugierig: Er erzählt Jannek Neuigkeiten aus den Ermittlungen und plant eine „Exkursion“ in Schelks Vergangenheit. Seit Jahren ist er in Rike verliebt und gesteht Jannek am Weiher, dass er eifersüchtig auf ihn ist.", "intro": "Na, alles fit? Till Hempel, einundzwanzig, Polizeimeister in der Probezeit, blonde Locken, dein Freund und Helfer. J.J. und ich haben früher halb Ribberow unsicher gemacht, Kirschen klauen inklusive. Jetzt haben wir beim Angeln zusammen ein Skelett im Weiher gefunden, und ich habe natürlich sofort die Kripo angerufen. Ich finde raus, wer der Tote ist, und wenn es sein muss, ermitteln wir eben auf eigene Faust. Und Rike? Tja, die mag ich schon ziemlich lange, aber das bleibt unter uns.", "quotes": [{"text": "Till zog seine blonden Locken in die Höhe.", "ch": 1}, {"text": "Tills Augen funkelten. »Fertig. Bin jetzt Polizeimeister in beamtenrechtlicher Probezeit.«", "ch": 1}, {"text": "Polizeimeister Till, dein Freund und Helfer, hat schon einen mächtig gewaltigen Plan.", "ch": 7}], "quiz": [{"q": "Welchen Beruf hat Till?", "o": ["Er ist Polizeimeister in der Probezeit.", "Er ist Apotheker.", "Er ist Bäcker.", "Er ist Hausmeister."], "a": 0, "e": "Till hat seine Ausbildung fertig und ist Polizeimeister in beamtenrechtlicher Probezeit."}, {"q": "Welche Eigenschaft passt am besten zu Till?", "o": ["Er ist locker und macht gerne Witze.", "Er ist wortkarg und streng.", "Er ist schüchtern und spricht kaum.", "Er ist verschroben und lebt im Wald."], "a": 0, "e": "Till macht ständig Sprüche, zum Beispiel über das Dorf oder über J.J."}], "img": "people/till_fcc88500.jpg", "audio": "audio/intro_till_2c5f0e39.mp3", "img_note": "Das Bild ist eine Illustration. Nicht alles davon steht im Buch, zum Beispiel: blaue Augen, sportliche Statur, T-Shirt unter der Uniformjacke."}, {"id": "rike", "name": "Rike Steinmann", "call": "Rike", "short": "Violinistin und Vegetarierin, etwa 15", "role": "Rike ist die Tochter von Robert Steinmann, wohnt am Waldrand von Ribberow, hat vor fünf Jahren ihre Mutter verloren und wird für Jannek immer wichtiger.", "age": "15", "gender": "w", "looks": ["lockige hellbraune Haare, Pony mit Spange nach hinten", "klare, helle, graublaue Augen", "hohe Stirn mit langer Falte, wenn sie sich ärgert", "kleine, etwas kantige Nase", "Grübchen beim Lächeln", "gebräunte Arme, sportlich", "braune Stoffhose, blaues oder rotes ärmelloses T-Shirt", "Fahrrad mit Korb voller Pflanzen"], "traits": ["direkt", "schlagfertig", "sportlich", "eigenwillig", "misstrauisch", "fürsorglich"], "description": "Rike Steinmann ist ungefähr 15 Jahre alt und geht in die zehnte Klasse. Sie wohnt mit ihrem Vater Robert in einem Haus am Waldrand von Ribberow. Rike hat lockige, hellbraune Haare, deren Pony sie mit einer Spange nach hinten bindet. Ihre Augen sind graublau und hell, und ihre kleine Nase wirkt etwas kantig. Wenn sie lächelt, bekommt sie Grübchen, wenn sie sich ärgert, erscheint eine lange Falte auf ihrer hohen Stirn. Meistens trägt sie eine braune Stoffhose und ein T-Shirt. Rike ist sportlich und fährt sehr schnell Fahrrad: Beim Wettrennen nach Ribberow überholt sie Jannek kurz vor dem Ortsschild. Sie spielt Geige, isst kein Fleisch und liebt Pflanzen. Rike ist direkt und manchmal schroff, aber sie kümmert sich liebevoll um ihren Vater und verteidigt ihn gegen das Gerede im Dorf.", "intro": "Ich bin Rike Steinmann, fünfzehn. Hellbraune Locken, graublaue Augen, und ja, ich bin die einzige Violinistin und Vegetarierin im Dorf. Ich wohne mit meinem Vater am Waldrand, und seit meine Mutter tot ist, passe ich auf ihn auf. Im Dorf tratschen sie, er hätte etwas mit dem Toten im Weiher zu tun, und das ist einfach Blödsinn. Und falls du ein Radrennen gegen mich fahren willst: Ich warne dich, ich bin schnell.", "quotes": [{"text": "Es war ein Mädchen mit lockigen hellbraunen Haaren.", "ch": 2}, {"text": "Darf ich vorstellen: Rike Steinmann, einzige Violinistin und Vegetarierin des Dorfes.", "ch": 2}, {"text": "Sie hatten etwas Klares, Hartes, wie geschliffene Steine.", "ch": 3}], "quiz": [{"q": "Wie stellt Till Rike vor?", "o": ["Als einzige Violinistin und Vegetarierin des Dorfes", "Als beste Fußballerin des Dorfes", "Als Tochter des Bäckers", "Als neue Polizeimeisterin"], "a": 0, "e": "Till sagt in Kapitel 2: Rike Steinmann, einzige Violinistin und Vegetarierin des Dorfes."}, {"q": "Was zeigt das Radrennen zwischen Rike und Jannek?", "o": ["Rike ist sportlich und sehr schnell.", "Rike ist ängstlich.", "Rike kann nicht Fahrrad fahren.", "Rike lässt Jannek absichtlich gewinnen."], "a": 0, "e": "Rike überholt Jannek kurz vor Ribberow, ohne aus dem Sattel zu gehen."}], "img": "people/rike_d899d95a.jpg", "audio": "audio/intro_rike_71a42045.mp3", "img_note": "Das Bild ist eine Illustration. Nicht alles davon steht im Buch, zum Beispiel: schulterlange Haarlänge, schlanke Statur."}, {"id": "hanne", "name": "Hanne Jensen", "call": "Hanne", "short": "Janneks strenge Oma, verwitwet", "role": "Hanne ist Janneks Großmutter, lebt seit dem Tod ihres Mannes Heinz allein auf dem Hof in Ribberow und verhält sich seltsam, als es um den Toten und den Ackerpflug geht.", "age": null, "gender": "w", "looks": ["eisblaue, durchdringende Augen", "schneeweißes Haar", "Brille (schaut über den Brillenrand)", "geht mi , ich kannte ihn, wir waren auf derselben Schule.", "quotes": [{"text": "»Kein Mann. Nur zwei Jobs gleichzeitig. Und zur Abendschule geht sie jetzt auch noch.«", "ch": 1}, {"text": "»Nein. Ich meine dafür, dass du mir bei den Keksen die Wahrheit erspart hast.«", "ch": 1}, {"text": "Die Stimme von Janneks Mutter klang belegt.", "ch": 5}], "quiz": [{"q": "Was erfährt man über das Leben von Janneks Mutter?", "o": ["Sie hat zwei Jobs und geht zur Abendschule.", "Sie ist Polizistin in Ribberow.", "Sie wohnt bei Hanne auf dem Hof.", "Sie ist Apothekerin in Großkumerow."], "a": 0, "e": "Jannek erzählt Till: zwei Jobs gleichzeitig und Abendschule."}, {"q": "Wie reagiert sie, als sie hört, dass der Tote Frank Schelk heißt?", "o": ["Ihre Stimme klingt belegt und zittert.", "Sie lacht laut.", "Sie legt sofort wütend auf.", "Sie sagt, sie habe den Namen nie gehört."], "a": 0, "e": "Sie kannte Schelk von der Schule und ist sichtlich erschüttert."}], "img": "people/mutter_9706ca0c.jpg", "audio": "audio/intro_mutter_c9852e27.mp3", "img_note": "Das Bild ist eine Illustration. Nicht alles davon steht im Buch, zum Beispiel: gesamtes Aussehen ergänzt (Alter Mitte 30, Haarfarbe, Statur, Kleidung), im Buch nicht beschrieben."}, {"id": "raedke", "name": "Polizeihauptkommissar Rädke", "call": "Rädke", "short": "Kommissar der Kripo Sandemünde", "role": "Rädke ist der Polizeihauptkommissar der Kripo Sandemünde, der den Fall des Toten im Weiher leitet und Jannek nach dem Fund befragt.", "age": null, "gender": "m", "looks": ["älterer Mann", "knollenähnliche Nase", "buschige Augenbrauen", "braunes Cordjackett"], "traits": ["gründlich", "sachlich", "höflich", "aufmerksam"], "description": "Polizeihauptkommissar Rädke ist ein älterer Kriminalpolizist aus Sandemünde. Er leitet die Ermittlungen, nachdem Jannek im Weiher von Ribberow ein Skelett gefunden hat. Rädke hat eine knollenähnliche Nase und buschige Augenbrauen. Er trägt ein braunes Cordjackett und schreibt alles in einen Notizblock. Rädke
