t": "Der Tote aus dem Weiher", "role": "Frank Schelk aus Großkumerow ist der Tote, dessen Skelett Jannek im Weiher findet; er war ein bekannter Frauenheld, machte krumme Geschäfte und kannte Janneks Mutter sowie Tills Eltern von früher.", "age": "36 (beim Tod vor fünf Jahren)", "gender": "m", "looks": ["blonde Locken, an der Stirn schon etwas zurückgehend", "große, dunkle Augen", "eckiges Kinn, weiche Wangen", "gerade, eher kleine Nase", "volle Unterlippe, schmale Oberlippe, Mund wirkt schief", "gut einen Kopf größer als Schwericke"], "traits": ["charmant", "angeberisch", "eigennützig", "unbeliebt", "geschäftstüchtig"], "description": "Frank Schelk stammt aus Großkumerow und war 36 Jahre alt, als er vor fünf Jahren starb. Jannek findet sein Skelett im fast ausgetrockneten Weiher von Ribberow. Auf einem Zeitungsfoto hat Schelk blonde Locken, die an der Stirn schon etwas zurückgehen, ein eckiges Kinn und eine eher kleine, gerade Nase. Am auffälligsten sind seine großen, dunklen Augen, die kindlich und schalkhaft wirken. Schelk galt als Frauenheld und konnte charmant sein, „wenn er wollte“. Er war aber auch angeberisch und eigennützig: Herr Hempel erzählt, dass es ihm immer nur darum ging, der Größte und Reichste zu sein, und dass er nie richtig gearbeitet hat. Bei der Auflösung der LPG machte er zusammen mit Schwericke krumme Geschäfte, deshalb hatte er im Dorf keine Freunde. Janneks Mutter und Tills Eltern kannten ihn noch aus der Schulzeit.", "intro": "Ich bin Frank Schelk, oder besser gesagt: Ich war es. Ich komme aus Großkumerow, und mit 36 Jahren war für mich vor fünf Jahren alles vorbei, jetzt erinnert man sich nur noch an mich. Früher wollte ich immer der Größte sein, mit dem schnellsten Auto und den meisten Freundinnen. Ich habe lieber Geschäfte gemacht als richtig gearbeitet, und nicht alle davon waren ehrlich. Einmal gab es sogar einen schlimmen Verdacht gegen mich, bewiesen wurde nie etwas. Freunde hatte ich hier im Dorf am Ende kaum noch.", "quotes": [{"text": "Er hatte blonde Locken, genau wie Till, nur dass sie bei Schelk an der Stirn bereits etwas zurückgingen.", "ch": 5}, {"text": "Das Auffälligste waren die Augen: groß, dunkel und bittend, kindlich und schalkhaft.", "ch": 5}, {"text": "Er konnte charmant sein. Wenn er wollte.", "ch": 7}, {"text": "Richtig gearbeitet hat der nie.", "ch": 5}], "quiz": [{"q": "Was ist laut Jannek das Auffälligste an Schelk auf dem Zeitungsfoto?", "o": ["Seine großen, dunklen Augen", "Seine schwarzen, glatten Haare", "Seine Narbe am Kinn", "Seine große Hakennase"], "a": 0, "e": "„Das Auffälligste waren die Augen: groß, dunkel und bittend, kindlich und schalkhaft.“"}, {"q": "Warum hatte Schelk im Dorf keine Freunde?", "o": ["Er machte krumme Geschäfte und dachte nur an seinen Vorteil.", "Er war sehr schüchtern und redete mit niemandem.", "Er wohnte nie in der Gegend.", "Er war Polizist und verhaftete viele Leute."], "a": 0, "e": "Herr Hempel nennt ihn einen „Schmarotzer“, der überall nur seinen Vorteil herauszog, zum Beispiel bei der LPG-Auflösung."}], "img": "people/schelk_dc42e9fb.jpg", "audio": "audio/intro_schelk_4c7c063b.mp3", "img_note": "Das Bild ist eine Illustration. Nicht alles davon steht im Buch, zum Beispiel: Kleidung (Leinenjacke, Hemd), Zigarette in der Hand (er war laut Herrn Hempel Raucher), Statur, Hintergrund am Teich."}, {"id": "harry", "name": "Hausmeister Harry", "call": "Harry", "short": "Freundlicher Hausmeister der Schule", "role": "Harry ist der Hausmeister der Schule in Großkumerow, kennt Till und dessen Vater gut und lässt Jannek und Till ins Archiv mit den alten Jahrbüchern und Schülerzeitungen.", "age": null, "gender": "m", "looks": ["klein, reicht Jannek nur bis zum Kinn", "grauer Igelhaarschnitt", "Dreitagebart", "raue Stimme"], "traits": ["freundlich", "hilfsbereit", "gesellig", "vertrauensvoll"], "description": "Harry ist der Hausmeister der Schule in Großkumerow und wohnt in einer kleinen Wohnung direkt am Schulgebäude. Er ist ziemlich klein und reicht Jannek gerade mal bis zum Kinn. Harry hat einen grauen Igelhaarschnitt, einen Dreitagebart und eine raue Stimme. Er ist freundlich und hilfsbereit: Als Till und Jannek bei ihm ans Fenster klopfen, begrüßt er sie lächelnd und führt sie sofort ins Archiv. Dort lässt er die beiden allein in den alten Jahrbüchern und Schülerzeitungen suchen, weil er ihnen vertraut. Über Schelk sagt er, dass dieser „sicherlich kein Waisenknabe“ war. Harry kennt Till noch von früher und geht manchmal mit Tills Vater zum Bowling.", "intro": "Ich bin Harry, der Hausmeister hier an der Schule in Großkumerow. Ich wohne gleich nebenan, in der kleinen Wohnung, die früher das geheime Raucherzimmer der Lehrer war. Den Till kenne ich noch von früher, und mit seinem Vater gehe ich manchmal bowlen. Wenn ihr in die alten Jahrbücher schauen wollt, warum nicht, dazu sind sie ja da. Ist alles nach Jahren und Klassen geordnet, ihr findet euch bestimmt zurecht.", "quotes": [{"text": "Er hatte einen grauen Igelhaarschnitt und einen Dreitagebart.", "ch": 8}, {"text": "Ein Mann, der Jannek gerade mal bis zum Kinn reichte, begrüßte sie lächelnd.", "ch": 8}, {"text": "Er war sicherlich kein Waisenknabe, aber dass er so enden muss, nee …", "ch": 8}], "quiz": [{"q": "Wie sieht Hausmeister Harry aus?", "o": ["Klein, mit grauem Igelhaarschnitt und Dreitagebart", "Groß, mit blonden Locken und Brille", "Dick, mit Halbglatze und Muttermal", "Dünn, mit langem Vollbart"], "a": 0, "e": "Harry reicht Jannek bis zum Kinn und hat „einen grauen Igelhaarschnitt und einen Dreitagebart“."}, {"q": "Wobei hilft Harry Jannek und Till?", "o": ["Er lässt sie ins Archiv mit alten Jahrbüchern und Schülerzeitungen.", "Er repariert ihr Fahrrad.", "Er fährt sie nach Sandemünde.", "Er zeigt ihnen den Pflug in der Scheune."], "a": 0, "e": "Harry schließt den Raum mit den Jahrbüchern auf und sagt: „Dazu sind sie ja da.“"}], "img": "people/harry_b32037fc.jpg", "audio": "audio/intro_harry_b35adfe5.mp3", "img_note": "Das Bild ist eine Illustration. Nicht alles davon steht im Buch, zum Beispiel: Alter Ende 40, Arbeitsjacke und Schlüsselbund, Statur."}, {"id": "gustav", "name": "Gustav", "call": "Gustav", "short": "Neugieriger Alter im Dorfkrug", "role": "Gustav ist ein alter Mann aus Ribberow, der im Dorfkrug heimlich mithören will, als Till Jannek von den Ermittlungen erzählt.", "age": null, "gender": "m", "looks": ["alter Mann", "Schirmmütze"], "traits": ["neugierig", "aufdringlich", "stur"], "description": "Gustav ist ein alter Mann aus Ribberow, den man im Dorfkrug antrifft. Er trägt eine Schirmmütze. Gustav ist sehr neugierig: Als Till Jannek in der Dartecke von den Ermittlungen erzählen will, kommt Gustav um die Ecke und tut so, als würde er sich die alten Bilder an der Wand ansehen. In Wirklichkeit will er heimlich mithören. Till schickt ihn mit dem Satz „Gustav, das Klo ist dort hinten“ weg, doch Gustav bleibt erst einmal stur stehen. Erst als Till ihn mit verschränkten Armen herausfordernd ansieht, trottet er zurück zur Bar. Für Till ist er typisch für Ribberow, denn alte, neugierige Männer gibt es dort „jede Menge“.", "intro": "Gustav heiß ich. Ich wohn schon ewig in Ribberow. Abends sitz ich im Dorfkrug, mit meiner Schirmmütze, wie immer. Und wenn der junge Hempel da hinten in der Dartecke was von der Polizei erzählt, dann guck ich mir eben mal die alten Bilder an der Wand an. Man wird ja wohl noch wissen dürfen, was im eigenen Dorf passiert.", "quotes": [{"text": "In dem Moment bog ein alter Mann mit Schirmmütze um die Ecke und Till verstummte.", "ch": 4}, {"text": "»Ein alter, neugieriger Mann. Davon gibt’s in Ribberow jede Menge.", "ch": 4}], "quiz": [{"q": "Was will Gustav in der Dartecke des Dorfkrugs?", "o": ["Heimlich mithören, was Till erzählt", "Dart spielen", "Die Toilette suchen", "Ein Bier bestellen"], "a": 0, "e": "Er tut so, als sehe er sich die Bilder an. Till nennt ihn „ein alter, neugieriger Mann“."}, {"q": "Welches Kleidungsstück wird bei Gustav erwähnt?", "o": ["Eine Schirmmütze", "Ein Cordjackett", "Eine weiße Schürze", "Ein Tuch um die Stirn"], "a": 0, "e": "„ein alter Mann mit Schirmmütze“ (Kapitel 4)"}], "img": "people/gustav_6939e676.jpg", "audio": "audio/intro_gustav_8ddfc7bb.mp3", "img_note": "Das Bild ist eine Illustration. Nicht alles davon steht im Buch, zum Beispiel: Alter um 75, Kleidung außer der Schirmmütze, Gesicht und Statur."}, {"id": "suckrow", "name": "Frau Suckrow", "call": "Frau Suckrow", "short": "Gelangweilte Verkäuferin der Bäckerei", "role": "Frau Suckrow verkauft in der kleinen Bäckerei Suckrow in der Hauptstraße von Ribberow, wo Jannek Brötchen kauft.", "age": null, "gender": "w", "looks": ["weiße Schürze", "gelber Fleck auf der linken Brustseite der Schürze"], "traits": ["gelangweilt", "wortkarg", "desinteressiert"], "description": "Frau Suckrow arbeitet in der Bäckerei Suckrow in der Hauptstraße von Ribberow. Der Laden ist klein und alt, nur das weiß-orangefarbene Schild ist neu. Frau Suckrow steht hinter der Vitrine und trägt eine weiße Schürze. Auf der linken Brustseite der Schürze ist ein gelber Fleck. Sie wirkt gelangweilt und redet nicht viel: Als Jannek hereinkommt, sieht sie ihn gelangweilt an und sagt nur „Bitt’schön?“. Jannek kauft bei ihr Brötchen und später auch eine Quarktasche. Frau Suckrow passt gut zu Ribberow, wo sich in all den Jahren kaum etwas verändert hat.", "intro": "Bitt’schön? Ich bin Frau Suckrow von der Bäckerei Suckrow in der Hauptstraße. Viel los ist hier nicht, mehr als drei Kunden passen sowieso nicht vor den Tresen. Brötchen, Käsebrötchen, Quarktaschen, mehr braucht man doch nicht. Das Schild draußen ist neu, alles andere ist wie früher. Noch was?", "quotes": [{"text": "Sie hatte eine weiße Schürze um und auf der linken Brust war ein gelber Fleck.", "ch": 3}, {"text": "»Bitt’schön?«, sagte Frau Suckrow, die hinter der Vitrine stand und Jannek gelangweilt ansah.", "ch": 3}], "quiz": [{"q": "Wie verhält sich Frau Suckrow, als Jannek in die Bäckerei kommt?", "o": ["Sie sieht ihn gelangweilt an.", "Sie umarmt ihn herzlich.", "Sie fragt ihn über den Toten aus.", "Sie schimpft mit ihm."], "a": 0, "e": "Sie stand hinter der Vitrine und sah Jannek „gelangweilt“ an."}, {"q": "Was fällt an Frau Suckrows Schürze auf?", "o": ["Ein gelber Fleck", "Ein goldener Herzanhänger", "Ein Namensschild", "Ein großes Loch"], "a": 0, "e": "„auf der linken Brust war ein gelber Fleck“"}], "img": "people/suckrow_efb96d88.jpg", "audio": "audio/intro_suckrow_631147e4.mp3", "img_note": "Das Bild ist eine Illustration. Nicht alles davon steht im Buch, zum Beispiel: Alter um 50, Frisur und Haarfarbe, Statur."}, {"id": "apotheker", "name": "Heinke, der Apotheker in Großkumerow", "call": "Heinke", "short": "Redseliger Apotheker in Großkumerow", "role": "Heinke ist der Apotheker in Großkumerow, bei dem Jannek Rheumacreme für Hanne kauft und Rike Schlaftabletten für ihren Vater holt.", "age": null, "gender": "m", "looks": ["kleine randlose Brille auf der Nasenspitze", "Pastorenmiene"], "traits": ["redselig", "belehrend", "umständlich", "geschwätzig"], "description": "Heinke ist der Apotheker in Großkumerow. Seine Apotheke ist ganz neu und riecht nach Hustenbonbons, Desinfektionsmittel und Zitrone. Heinke trägt eine kleine randlose Brille, die auf seiner Nasenspitze sitzt. Wenn er mit Kunden spricht, macht er eine ernste „Pastorenmiene“ und streckt das Kinn vor. Er redet sehr gern: Als Jannek Rheumacreme für Hanne kauft, braucht Heinke „eine halbe Ewigkeit“ für das Wechselgeld und hält dabei einen kleinen Vortrag über Rheuma. Rike erzählt, dass er auch in seiner Freizeit viel tratscht, sodass bald der ganze Landkreis weiß, was man gekauft hat. Bei Rike ermahnt er, dass ihr Vater sich an die Dosierung seiner Tabletten halten muss.", "intro": "Guten Tag, Heinke mein Name, ich bin der Apotheker hier in Großkumerow. Kann ich Ihnen helfen? Bei Rheuma zum Beispiel ist eine gute Creme ja nur die halbe Miete, da gibt es noch einiges zu beachten. Und bei Tabletten gilt immer: Halten Sie sich an die Dosierung! Ich erkläre das gern ausführlich, dafür bin ich ja da.", "quotes": [{"text": "»Aber er muss sich an die Dosierung halten«, sagte der Apotheker, dessen kleine randlose Brille auf der Nasenspitze saß, gerade mit Pastorenmiene zu einer Kundin.", "ch": 3}, {"text": "»Hat dir der Heinke auch ein Ohr abgequatscht?«", "ch": 3}, {"text": "Der Apotheker. Er redet unheimlich gerne.", "ch": 3}], "quiz": [{"q": "Welche Eigenschaft hat der Apotheker Heinke vor allem?", "o": ["Er redet sehr gern und viel.", "Er ist stumm und zeigt nur auf die Kasse.", "Er ist unfreundlich und wirft Jannek hinaus.", "Er ist sehr schnell und hektisch."], "a": 0, "e": "Rike sagt: „Er redet unheimlich gerne.“ Jannek bekommt einen Vortrag über Rheuma."}, {"q": "Wo sitzt die Brille des Apothekers?", "o": ["Auf der Nasenspitze", "Auf dem Kopf", "In der Kitteltasche", "Er trägt keine Brille."], "a": 0, "e": "„dessen kleine randlose Brille auf der Nasenspitze saß“"}], "img": "people/apotheker_6c3ce683.jpg", "audio": "audio/intro_apotheker_634c79b2.mp3", "img_note": "Das Bild ist eine Illustration. Nicht alles davon steht im Buch, zum Beispiel: Alter um die 50, weißer Kittel, Haare und Statur."}, {"id": "schwericke", "name": "Schwericke", "call": "Schwericke", "short": "Ehemaliger LPG-Vorsitzender, heute Biobauer", "role": "Schwericke war Vorsitzender der LPG, löste sie zusammen mit seinem Assistenten Frank Schelk auf und leitet heute einen großen Biobauernhof bei Großkumerow.", "age": null, "gender": "m", "looks": ["klein und füllig", "Halbglatze", "pflaumengroßes Muttermal auf der Halbglatze", "erinnert ein wenig an Gorbatschow"], "traits": ["geschäftstüchtig", "berechnend", "erfolgreich", "verschwiegen"], "description": "Schwericke war früher Vorsitzender der LPG und leitet heute einen großen Biobauernhof bei Großkumerow. Jannek und Till sehen ihn auf einem alten Zeitungsfoto in der Bibliothek in Sandemünde. Er ist ein kleiner, fülliger Mann mit Halbglatze. Auf der Glatze hat er ein etwa pflaumengroßes Muttermal, das ihn ein wenig wie Gorbatschow aussehen lässt. Schwericke ist sehr geschäftstüchtig: Zusammen mit Schelk hat er bei der Auflösung der LPG gute Geschäfte gemacht, während viele Dorfbewohner nur eine billige Abfindung bekamen. Zu den Vorwürfen in der Zeitung wollte er nichts sagen. Heute geht es ihm „prächtig“, und mit seinem Biobauernhof hat er neue Arbeitsplätze in die Gegend gebracht.", "intro": "Schwericke. Früher war ich Vorsitzender der LPG, heute leite ich den großen Biobauernhof bei Großkumerow. Nach der Wende musste die Genossenschaft umgewandelt oder aufgelöst werden, und das habe ich erledigt, mit Frank Schelk als Assistent. Was die Leute über die Abfindungen erzählen, kommentiere ich nicht. Ich habe Arbeitsplätze in die Gegend gebracht, das zählt.", "quotes": [{"text": "Till zeigte auf einen kleinen, fülligen Mann mit Halbglatze, der darauf ein etwa pflaumengroßes Muttermal hatte, was ihn ein wenig wie Gorbatschow aussehen ließ.", "ch": 8}, {"text": "Weder Schwericke noch sein Assistent Schelk wollten dazu Stellung nehmen.", "ch": 8}, {"text": "Schwericke geht es jedenfalls prächtig, was man so hört.", "ch": 8}], "quiz": [{"q": "Woran erinnert Schwericke auf dem Zeitungsfoto?", "o": ["An Gorbatschow, wegen des Muttermals auf der Halbglatze", "An Einstein, wegen der abstehenden Haare", "An Jack Nicholson", "An Sherlock Holmes"], "a": 0, "e": "Sein pflaumengroßes Muttermal lässt ihn „ein wenig wie Gorbatschow aussehen“."}, {"q": "Was verbindet Schwericke mit Frank Schelk?", "o": ["Sie haben zusammen die LPG aufgelöst.", "Sie waren in derselben Schulklasse.", "Sie spielten zusammen in einer Band.", "Schwericke ist Schelks Vater."], "a": 0, "e": "Die Auflösung wurde von Schwericke „und seinem Assistenten Frank Schelk vorgenommen“."}], "img": "people/schwericke_58bb897a.jpg", "audio": "audio/intro_schwericke_c4832160.mp3", "img_note": "Das Bild ist eine Illustration. Nicht alles davon steht im Buch, zum Beispiel: Alter um 60 (Schelk war rund 20 Jahre jünger), Kleidung, Gesichtsausdruck."}, {"id": "sabine", "name": "Sabine, die Barfrau im Dorfkrug", "call": "Sabine", "short": "Schlagfertige Barfrau im Dorfkrug", "role": "Sabine arbeitet seit sieben Jahren als Barfrau im Dorfkrug von Ribberow und erzählt Jannek und Till, dass Schelk dort viel getrunken hat.", "age": null, "gender": "w", "looks": ["goldener Herzanhänger", "Wischtuch über der Schulter"], "traits": ["schlagfertig", "frech", "gesellig", "ungeduldig"], "description": "Sabine ist die Barfrau im Dorfkrug von Ribberow und arbeitet dort schon seit sieben Jahren. Sie trägt einen goldenen Herzanhänger, mit dem sie gern spielt, und hat ein Wischtuch über der Schulter. Sabine spricht Berliner Dialekt und ist sehr schlagfertig: Jannek fragt sie spöttisch, ob er eine Cola, ein Glas Milch oder einen Kakao will. Sie erkennt ihn als „den kleenen Jensen“ und meint, er sei ein richtiger Mann geworden. Über Schelk erzählt sie, dass er im Dorfkrug „jesoffen wie ein Loch“ hat. Als Till und Jannek sie zu genau ausfragen, wird sie ungeduldig, reißt Till das Wischtuch aus der Hand und geht ans andere Ende der Bar.", "intro": "Watt kriegste, Kleener? Ick bin Sabine, die Barfrau hier im Dorfkrug, dieses Jahr werden et sieben Jahre, toi toi toi. Ick kenn hier jeden, sogar den kleenen Jensen von früher, is ja’n richtiger Mann jeworden. Den Schelk hab ick ooch jekannt, der hat jesoffen wie ein Loch. Aber wann der hier war, weeß ick nich, ick bin Barfrau und keene Stechuhr.", "quotes": [{"text": "wobei ihr goldener Herzanhänger gegen ein Glas baumelte", "ch": 7}, {"text": "»Von dem jetzt nur noch Knochen übrig sind? Klar doch. Hat jesoffen wie ein Loch.«", "ch": 7}, {"text": "Ick bin Barfrau und keene Stechuhr.", "ch": 7}], "quiz": [{"q": "Welchen Schmuck trägt Sabine?", "o": ["Einen goldenen Herzanhänger", "Große Silberohrringe", "Eine Perlenkette", "Einen Nasenring"], "a": 0, "e": "Ihr „goldener Herzanhänger“ baumelt gegen ein Glas, später spielt sie damit."}, {"q": "Was erzählt Sabine über Schelk?", "o": ["Er hat im Dorfkrug sehr viel getrunken.", "Er hat nie Alkohol getrunken.", "Er war ihr Freund.", "Er hat im Dorfkrug gearbeitet."], "a": 0, "e": "Sie sagt: „Hat jesoffen wie ein Loch.“"}], "img": "people/sabine_c4e9b80a.jpg", "audio": "audio/intro_sabine_3ad64438.mp3", "img_note": "Das Bild ist eine Illustration. Nicht alles davon steht im Buch, zum Beispiel: Alter Ende 30, Haarfarbe und Frisur, Make-up und Oberteil, Statur."}, {"id": "knubs", "name": "Knubs (Andreas Knuse)", "call": "Knubs", "short": "Stammgast im Dorfkrug, Schelks Mitschüler", "role": "Knubs heißt eigentlich Andreas Knuse, war mit Frank Schelk in einer Klasse und sitzt seit zwanzig Jahren im Dorfkrug von Ribberow.", "age": "um die 40 (Jahrgang wie Schelk)", "gender": "m", "looks": ["sah als Schüler richtig nett aus", "hält sein Bier mit beiden Händen umklammert"], "traits": ["verschlossen", "abweisend", "traurig", "träumerisch"], "description": "Knubs heißt eigentlich Andreas Knuse und ist ungefähr so alt wie Schelk, denn die beiden waren in derselben Klasse. Seit zwanzig Jahren sitzt er im Dorfkrug von Ribberow. Auf dem alten Klassenfoto sah er „richtig nett“ aus. Heute hält er sein Bier mit beiden Händen umklammert und senkt den Kopf über das Glas. Knubs ist sehr verschlossen: Als Till ihn nach einem Fremden und nach Schelk fragt, murmelt er nur etwas Unverständliches und dreht sich weg. Laut Till soll ihm eine Dorfschönheit das Herz gebrochen haben, deshalb ist er im Dorfkrug „hängen geblieben“. In der Schülerzeitung wünschte er sich einen weichen Sessel statt eines harten Schulstuhls, damit er besser träumen kann.", "intro": "Watt willste? Ich bin Knubs, eigentlich Andreas Knuse. Ich sitz hier im Dorfkrug, schon ziemlich lange. Früher in der Schule wollte ich lieber im Sessel träumen als auf dem harten Stuhl sitzen. Über früher und über Leute von früher rede ich nicht gern.", "quotes": [{"text": "Knubs hielt sein Bier mit beiden Händen umklammert und hatte den Kopf über das Glas gesenkt.", "ch": 7}, {"text": "Knubs murmelte etwas Unverständliches in sein Glas und drehte sich dann um.", "ch": 7}, {"text": "»Andreas Knuse«, las Jannek. »Der sah ja mal richtig nett aus.«", "ch": 8}], "quiz": [{"q": "Wie reagiert Knubs, als Till ihn nach Frank Schelk fragt?", "o": ["Er murmelt etwas Unverständliches und dreht sich weg.", "Er erzählt ausführlich von Schelk.", "Er lacht laut und gibt eine Runde aus.", "Er ruft die Polizei."], "a": 0, "e": "„Knubs murmelte etwas Unverständliches in sein Glas und drehte sich dann um.“"}, {"q": "Woher kannte Knubs Frank Schelk?", "o": ["Sie waren in einer Schulklasse.", "Sie arbeiteten auf dem Biobauernhof.", "Knubs war sein Nachbar in Berlin.", "Sie spielten zusammen Fußball beim FC Großkumerow."], "a": 0, "e": "Auf dem Jahrbuchfoto entdeckt Till: Knubs war „mit Schelk in einer Klasse“."}], "img": "people/knubs_30f5ca7b.jpg", "audio": "audio/intro_knubs_eda85129.mp3", "img_note": "Das Bild ist eine Illustration. Nicht alles davon steht im Buch, zum Beispiel: Haarfarbe, Kleidung, Bartstoppeln, Statur."}, {"id": "opa_heinz", "name": "Heinz Jensen (Janneks Opa)", "call": "Heinz Jensen", "short": "Janneks verstorbener, beliebter Opa", "role": "Heinz Jensen war Hannes Mann und Janneks Opa, ist vor einem halben Jahr gestorben und war im ganzen Dorf beliebt.", "age": null, "gender": "m", "looks": ["keine Aussehensbeschreibung im Text", "seine Schnürstiefel und seine Jacke trägt jetzt Jannek"], "traits": ["beliebt", "verlässlich", "gut gelaunt", "herzlich", "humorvoll"], "description": "Heinz Jensen war Janneks Opa und Hannes Mann, die beiden waren 44 Jahre zusammen. Er ist vor einem halben Jahr gestorben. Wie er genau aussah, beschreibt das Buch nicht, aber Jannek trägt jetzt seine Schnürstiefel und seine Jacke, wenn er Holz hackt. Heinz war in der ganzen Gegend beliebt und galt als verlässlich, immer gut gelaunt und herzlich. Er hat Jannek als Kind das Traktorfahren be (function(){

function chapter(ch){
  const i=ch.nr-1;
  const c=card(`<span class="stamp">AKTE ${ch.nr}</span><h1>${EMO[i]||""} ${esc(ch.title)}</h1>

function mcRound(box, list, onEnd, opts){
  opts=opts||{}; let i=0, res=[];
  function prog(){ return `<div class="progress">${list.map((_,k)=>`<i class="${k<res.length?(res[k]?"ok":"bad"):(k===i?"cur":"")}"></i>`).join("")}</div>`; }
  function show(){
    const x=list[i]; const order=shuffle(x.o.map((t,k)=>({t,k})));
    box.innerHTML=prog()+`<div class="muted">Frage ${i+1} von ${list.length}${x.from?" · "+esc(x.from):""}</div><div class="qtext">${esc(x.q)}</div>${x.img?`<img src="${x.img}" alt="" style="width:220px;max-width:100%;border-radius:12px;display:block;margin:4px 0 10px">`:""}<div class="opts"></div><div class="fbx"></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" style="display:none">${i+1<list.length?"Nächste Frage →":"Auswertung →"}</button></div>`;
    const o=box.querySelector(".opts"), nb=box.querySelector(".btn");
    order.forEach(op=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=op.t; b.onclick=()=>{
      const ok=op.k===x.a; [...o.children].forEach((c,j)=>{c.disabled=true; if(order[j].k===x.a) c.classList.add("ok");}); if(!ok) b.classList.add("bad");
      res.push(ok); if(x.key){ st.q[x.key]={ok}; save(); } if(ok) addXP(10);
      box.querySelector(".fbx").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✔ Richtig!":"✘ Leider nicht."} ${esc(x.e||"")}</div>`;
      nb.style.display=""; nb.focus(); }; o.appendChild(b); });
    nb.onclick=()=>{ i++; if(i<list.length) show(); else end(); };
  }
  function end(){ const ok=res.filter(Boolean).length;
    box.innerHTML=prog()+`<div class="center"><div class="grade">${ok}/${list.length}</div><p><b>${ok===list.length?"Fall gelöst! 🕵️":ok>=list.length*.6?"Gute Ermittlungsarbeit!":"Lies die Zusammenfassung nochmal und versuch es erneut."}</b></p><button class="btn ghost">↻ Nochmal</button></div>`;
    box.querySelector("button").onclick=()=>{ i=0; res=[]; list=opts.reshuffle?opts.reshuffle():list; show(); };
    if(onEnd) onEnd(ok,list.length); }
  show();
}

function person(id){

    ${(p.looks||[]).length?`<h3>👀 Aussehen</h3><ul class="looks">${p.looks.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    ${(p.traits||[]).length?`<h3>💭 Charakter</h3><div class="chips">${p.traits.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:""}
  </div></div>${(p.quotes||[]).length?`<h3>📖 Aus dem Buch</h3>${p.quotes.map(q=>`<div class="quote">„${esc(q.text)}“ <small class="muted">(Kap. ${q.ch})</small></div>`).join("")}`:""}${p.img_note?`<p class="muted" style="font-size:13px;margin-top:10px">🎨 ${esc(p.img_note)}</p>`:""}`);
  const w=card(`<h2>✍️ Personenbeschreibung üben</h2>${HOWTO}<p class="muted" style="margin-top:10px">Schreib zuerst selbst eine Beschreibung von <b>${esc(p.name)}</b>. Dann vergleiche mit der Musterlösung.</p><textarea style="min-height:140px" placeholder="${esc(p.name)} ist …"></textarea><div class="row" style="margin-top:8px"><button class="btn ghost">Musterlösung zeigen</button></div><div class="ans"><b>Musterlösung:</b> ${esc(p.description||"")}</div>`);
  w.querySelector("button").onclick=e=>{ const a=w.querySelector(".ans"); a.classList.toggle("show"); e.target.textContent=a.classList.contains("show")?"Musterlösung verbergen":"Musterlösung zeigen"; };
  if((p.quiz||[]).length){ const z=card(`<h2>🧩 Quiz zu ${esc(p.name)}</h2><div></div>`); mcRound(z.lastElementChild, p.quiz.map((x,k)=>Object.assign({key:"p_"+id+"_"+k},x))); }
  const nx=card(`<div class="row" style="justify-content:space-between"><button class="btn ghost" id="bk">← Alle Personen</button>${i+1<PEOPLE.length?`<button class="btn rust" id="nx">${esc(PEOPLE[i+1].name)} →</button>`:""}</div>`);
  nx.querySelector("#bk").onclick=()=>go("figuren"); if(i+1<PEOPLE.length) nx.querySelector("#nx").onclick=()=>go("p_"+PEOPLE[i+1].id);
}
function abk(){
  const A=DATA.abbr||[];
  const c=card(`<span class="stamp">CODE</span><h1>Abkürzungen</h1><p class="muted">In der Arbeit musst du Abkürzungen <b>ausgeschrieben</b> kennen. Tipp auf eine Karte zum Umdrehen.</p><div class="abk" id="ab"></div>`);
  const ab=c.querySelector("#ab");
  A.forEach(x=>{ const b=document.createElement("button"); b.className="flip"; b.innerHTML=`<div class="a">${esc(x.abbr)}</div><div class="f">${esc(x.full)}</div><div class="x">${esc(x.explain||"")}${x.ch?` (Kap. ${x.ch})`:""}</div>`; b.onclick=()=>b.classList.toggle("open"); ab.appendChild(b); });
  const t=card(`<h2>⌨️ Ausschreiben üben</h2><p class="muted">Tippe die volle Form. Groß/klein und Bindestriche sind egal, die Rechtschreibung nicht.</p><div></div>`); const box=t.lastElementChild;
  const norm=s=>s.toLowerCase().replace(/[^a-zäöüß]/g,"");
  let order=shuffle(A), i=0, ok=0;
  function show(){ if(i>=order.length){ box.innerHTML=`<div class="center"><div class="grade">${ok}/${order.length}</div><button class="btn ghost">↻ Nochmal</button></div>`; box.querySelector("button").onclick=()=>{order=shuffle(A);i=0;ok=0;show();}; return; }
    const x=order[i]; box.innerHTML=`<div class="muted">${i+1} von ${order.length}</div><div class="qtext">Wofür steht <b>${esc(x.abbr)}</b>?</div><input class="tin" autocomplete="off" spellcheck="false" placeholder="ausgeschrieben …"><div class="row" style="margin-top:8px"><button class="btn">Prüfen</button></div><div class="fbx"></div>`;
    const inp=box.querySelector("input"), b=box.querySelector("button"); let done=false;
    const check=()=>{ if(done){ i++; show(); return; } done=true; const good=[x.full,...(x.alt||[])].some(f=>norm(f)===norm(inp.value)); if(good){ok++; addXP(10);}
      box.querySelector(".fbx").innerHTML=`<div class="fb ${good?"ok":"bad"}">${good?"✔ Richtig!":"✘ Richtig ist:"} <b>${esc(x.full)}</b>. ${esc(x.explain||"")}</div>`; b.textContent=i+1<order.length?"Weiter →":"Auswertung →"; };
    b.onclick=check; inp.onkeydown=e=>{ if(e.key==="Enter") check(); }; }
  show();
  if(A.length>=4){ const q=card(`<h2>🧩 Abkürzungs-Quiz</h2><div></div>`);
    const mk=()=>shuffle(A).map(x=>{ const others=shuffle(A.filter(y=>y.abbr!==x.abbr)).slice(0,3).map(y=>y.full); return {q:"Wofür steht „"+x.abbr+"“?", o:[x.full,...others], a:0, e:x.explain||""}; });
    mcRound(q.lastElementChild, mk(), null, {reshuffle:mk}); }
}

function zeit(){
  card(`<span class="stamp">CHRONOLOGIE</span><h1>Was passiert wann?</h1><div class="tl">${DATA.timeline.map(t=>`<div>${esc(t)}</div>`).join("")}</div>`);
  const c=card(`<h2>🧩 Bring die Ereignisse in die richtige Reihenfolge</h2><p class="muted">Tippe die Ereignisse nacheinander an, das früheste zuerst.</p><div id="ord"></div>`);
  const box=c.querySelector("#ord");
  function round(){
    const idx=shuffle(DATA.timeline.map((_,k)=>k)).slice(0,5).sort((a,b)=>a-b); const items=shuffle(idx); let picked=[];
    box.innerHTML=`<ol id="pk" class="kp" style="min-height:30px"></ol><div class="opts"></div><div class="fbx"></div>`;
    const o=box.querySelector(".opts");
    items.forEach(k=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=DATA.timeline[k]; b.onclick=()=>{ b.disabled=true; b.style.opacity=.4; picked.push(k); box.querySelector("#pk").innerHTML=picked.map(p=>`<li>${esc(DATA.timeline[p])}</li>`).join("");
      if(picked.length===idx.length){ const ok=picked.every((p,j)=>p===idx[j]); if(ok) addXP(20);
        box.querySelector(".fbx").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✔ Perfekte Reihenfolge!":"✘ Nicht ganz. Richtig ist:<ol class='kp'>"+idx.map(p=>`<li>${esc(DATA.timeline[p])}</li>`).join("")+"</ol>"}</div><button class="btn ghost" style="margin-top:10px">↻ Neue Runde</button>`;
        box.querySelector(".fbx button").onclick=round; } }; o.appendChild(b); });
  }
  round();
}

function spell(){
  const S=DATA.spelling;
  const c=card(`<span class="stamp">BEWEISMITTEL</span><h1>Rechtschreibung</h1><p>${S.intro}</p><div id="sp"></div>`);
  const box=c.querySelector("#sp");
  let list=shuffle(S.items).sort((a,b)=>(st.sp[a.right]||0)-(st.sp[b.right]||0)), i=0, ok=0;
  function show(){
    if(i>=list.length){ box.innerHTML=`<div class="center"><div class="grade">${ok}/${list.length}</div><p><b>${ok===list.length?"Alles richtig geschrieben! ✏️🏆":"Übung macht den Meister. Nochmal?"}</b></p><button class="btn">↻ Nochmal</button></div>`; box.querySelector("button").onclick=()=>{list=shuffle(S.items); i=0; ok=0; show();}; return; }
    const x=list[i];
    box.innerHTML=`<p class="muted">Wort ${i+1} von ${list.length}. So stand es in deinem Heft:</p><div class="wrongword">${esc(x.wrong)}</div><p>Schreib es richtig:</p><input class="inp" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="fbx"></div><div class="row" style="margin-top:12px"><button class="btn">Prüfen</button></div>`;
    const inp=box.querySelector("input"), b=box.querySelector(".btn"); let checked=false; inp.focus();
    const go2=()=>{ if(!checked){ if(!inp.value.trim()) return; checked=true; const r=inp.value.trim()===x.right; inp.className="inp "+(r?"ok":"bad"); inp.disabled=true;
        if(r){ok++; addXP(5); st.sp[x.right]=(st.sp[x.right]||0)+1;} else st.sp[x.right]=0; save();
        box.querySelector(".fbx").innerHTML=`<div class="fb ${r?"ok":"bad"}">${r?"✔ Richtig!":"✘ Richtig ist: <b>"+esc(x.right)+"</b>"} <span class="muted">💡 ${esc(x.tip)}</span></div>`; b.textContent="Weiter →"; b.focus(); }
      else { i++; show(); } };
    b.onclick=go2; inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go2(); } });
    box.addEventListener("keydown",e=>{ if(e.key==="Enter" && checked && e.target!==inp){ } });
  }
  show();
}

function test(){
  const c=card(`<span class="stamp">ABSCHLUSS</span><h1>Der große Abschlusstest</h1><p class="muted">15 gemischte Fragen aus allen acht Akten, ein Versuch pro Frage. Wie in der Arbeit!</p><div id="t"></div>`);
  const mk=()=>shuffle(C.flatMap(ch=>ch.quiz.map(x=>Object.assign({from:"Akte "+ch.nr},x)))).slice(0,15);
  mcRound(c.querySelector("#t"), mk(), (ok,n)=>{ const p=ok/n; const note=p>=.92?1:p>=.81?2:p>=.67?3:p>=.5?4:p>=.3?5:6; addXP(ok*5);
    const r=document.createElement("p"); r.className="center"; r.innerHTML=`Geschätzte Note: <b style="font-size:24px">${note}</b>`; c.querySelector("#t").appendChild(r); }, {reshuffle:mk});
}

$("#xp").textContent="⭐ "+st.xp; nav(); go(st.view||"start");
})();
</script>
