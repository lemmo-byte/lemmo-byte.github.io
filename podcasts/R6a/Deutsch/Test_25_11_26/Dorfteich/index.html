<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ermittlungsakte Dorfteich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--paper:#fffdf7;--ink:#1c1917;--muted:#57534e;--line:#e7dfcf;--teal:#0f5f5c;--teal2:#0a4644;--rust:#b45309;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--r:16px;--shadow:0 6px 22px rgba(60,40,10,.10)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,'Segoe UI',sans-serif;font-size:17px;line-height:1.55}
button,input,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#1f2a2a;color:#f5f5f4}
.top-in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:'Special Elite',monospace;font-size:20px;white-space:nowrap;cursor:pointer}
.spacer{flex:1}
.xp{font-weight:900;background:#fef3c7;color:#92400e;border-radius:999px;padding:3px 12px;white-space:nowrap}
.nav{background:#2b3838;overflow-x:auto}
.nav-in{max-width:1000px;margin:0 auto;padding:6px 12px;display:flex;gap:6px}
.nav button{flex:none;border:0;background:transparent;color:#d6d3d1;font-weight:800;padding:6px 10px;border-radius:10px;font-size:15px;white-space:nowrap}
.nav button.on{background:#f5f5f4;color:#1f2a2a}
.nav button.done::after{content:" ✓";color:#4ade80}
main{max-width:1000px;margin:0 auto;padding:20px 16px 70px}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 26px;border:1px solid var(--line);margin-bottom:16px;position:relative}
.stamp{font-family:'Special Elite',monospace;color:#b91c1c;border:3px solid #b91c1c;border-radius:8px;padding:2px 10px;display:inline-block;transform:rotate(-4deg);font-size:15px;letter-spacing:.08em;opacity:.85;margin-bottom:8px}
h1{font-family:'Special Elite',monospace;font-size:32px;line-height:1.15;margin:.1em 0 .3em;font-weight:400}
h2{font-size:23px;margin:.1em 0 .5em;font-weight:900}
h3{font-size:18px;margin:1em 0 .4em;font-weight:900;color:var(--teal2)}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:900;font-size:16px;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal2)}
.btn.ghost{background:#fff;color:var(--teal2);box-shadow:0 0 0 2px var(--line) inset}
.btn.rust{background:var(--rust);box-shadow:0 4px 0 #78350f}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.akte{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;position:relative}
.akte:hover{border-color:var(--teal)}
.akte b{display:block;font-size:16px}.akte small{color:var(--muted);font-weight:700}
.akte .nr{font-family:'Special Elite',monospace;color:var(--rust);font-size:14px}
.akte.done{background:#f0fdf4;border-color:#86efac}
.akte.done::after{content:"✓";position:absolute;right:12px;top:10px;color:var(--ok);font-weight:900;font-size:20px}
audio{width:100%;margin:6px 0 4px}
.summary{font-size:18px;background:#fbf7ec;border-left:5px solid var(--rust);padding:12px 16px;border-radius:0 12px 12px 0}
.kp{margin:0;padding-left:1.2em}.kp li{margin:4px 0}
.q{border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:#fff}
.q .qq{font-weight:900;font-size:17.5px}
.q textarea{width:100%;min-height:62px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;resize:vertical}
.ans{display:none;margin-top:10px;background:#ecfdf5;border:2px solid #a7f3d0;border-radius:12px;padding:10px 14px}
.ans.show{display:block}
.quote{margin-top:6px;font-style:italic;color:var(--muted)}
.quote::before{content:"📖 Im Buch: "}
.opts{display:grid;gap:9px;margin-top:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:700;text-align:left}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt[disabled]{color:var(--ink);opacity:1;cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:10px;border-radius:12px;padding:10px 14px;font-weight:700}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.qtext{font-size:20px;font-weight:900;margin:6px 0}
.progress{display:flex;gap:4px;margin:2px 0 10px}.progress i{flex:1;height:8px;border-radius:4px;background:#e7e5e4}.progress i.ok{background:var(--ok)}.progress i.bad{background:var(--bad)}.progress i.cur{background:#5eead4}
.person{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.person b{font-size:17px}.person small{color:var(--rust);font-weight:800}
.tl{border-left:4px solid var(--teal);margin-left:10px;padding-left:18px}
.tl div{position:relative;margin:0 0 14px}.tl div::before{content:"";position:absolute;left:-27px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--rust);border:3px solid var(--paper)}
.inp{font-size:22px;font-weight:800;padding:10px 14px;border-radius:12px;border:3px solid var(--line);width:100%;max-width:420px}
.inp.ok{border-color:var(--ok);background:var(--okbg)}.inp.bad{border-color:var(--bad);background:var(--badbg)}
.wrongword{font-size:26px;font-weight:900;color:var(--bad);text-decoration:line-through wavy}
.grade{font-family:'Special Elite',monospace;font-size:58px;color:var(--teal2);line-height:1.1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(160%);opacity:0;background:#1c1917;color:#fff;border-radius:14px;padding:10px 18px;font-weight:900;transition:all .3s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){h1{font-size:25px}.card{padding:18px}.brand span{display:none}}
</style>
</head>

<script>
const DATA={"chapters": [{"nr": 1, "title": "Ankunft in Ribberow", "summary": "Jannek ist sechzehn Jahre alt und wohnt mit seiner Mutter in der Stadt Pinzlau. In den Herbstferien soll er eine Woche bei seiner Oma Hanne im Dorf Ribberow verbringen, denn Hanne ist seit dem Tod von Opa allein. Jannek hat überhaupt keine Lust, denn das Dorf ist langweilig und Hanne ist sehr streng. Unterwegs trifft er seinen alten Kinderfreund Till, der jetzt Polizist ist. Till erzählt ihm von Rike und ihrem seltsamen Vater, den alle nur Waldeinstein nennen. Bei Hanne ist es still, nur die Uhr tickt. Auf dem Küchentisch ist Blut, aber es stammt nur von einem Kaninchen. Die Kekse von Janneks Mutter will Hanne nicht essen. Zwischendurch erfährt der Leser, dass tief in einem Teich ein Skelett liegt.", "keypoints": ["Jannek (16) fährt in den Herbstferien eine Woche zu Oma Hanne nach Ribberow.", "Grund: Seine Mutter will, dass jemand Hanne Gesellschaft leistet. Opa ist vor einem halben Jahr gestorben.", "Die Mutter kommt nicht mit, weil sie zwei Jobs hat und zur Abendschule geht.", "Till (21), Janneks Kinderfreund, ist jetzt Polizeimeister in der Probezeit und nimmt Jannek im Auto mit.", "In Hannes Haus hört Jannek zuerst nur das Ticken der Uhr. Das Blut auf dem Tisch stammt von einem Kaninchen.", "Kurze Zwischenteile zeigen ein Skelett auf einer Pflugschar tief im Wasser."], "questions": [{"q": "Wo genau sitzt Jannek im Zug?", "answer": "Jannek sitzt im Zug am Fenster und lehnt den Kopf an die Fensterscheibe. Im Bus nach Ribberow setzt er sich auf einen hinteren Fensterplatz in der Nähe einer jungen Frau mit einem Kleinkind.", "quote": "Jannek lehnte mit dem Kopf an der Fensterscheibe."}, {"q": "Was war das erste, was Jannek hört, als er in Hannes Haus lief?", "answer": "Jannek hört zuerst nur das Ticken der Uhr im Wohnzimmer. Sonst ist im Haus alles still, sogar zu still.", "quote": "Im Haus roch es nach alten Leuten, und bis auf das Ticken der Uhr im Wohnzimmer war alles still."}, {"q": "Warum fährt Jannek in den Herbstferien zu Hanne?", "answer": "Seine Mutter möchte, dass jemand Hanne Gesellschaft leistet, weil Hanne seit Opas Tod vor einem halben Jahr allein lebt. Die Mutter selbst kann nicht fahren, weil sie zwei Jobs hat und zur Abendschule geht.", "quote": "»Hanne braucht etwas Gesellschaft. Sonst wird sie noch seltsamer. Meint zumindest meine Mutter.«"}, {"q": "Wie beschäftigen sich Jannek und Till in Ribberow?", "answer": "Till schlägt vor, angeln zu gehen oder später im Dorfkrug Darts zu spielen. Am selben Abend gehen die beiden zusammen am Weiher angeln.", "quote": "»Wir könnten angeln gehen oder später im Krug ’ne Runde Darts spielen.«"}], "quiz": [{"q": "Wer hält auf der Landstraße an und nimmt Jannek mit?", "o": ["Polizeihauptkommissar Rädke", "Till", "Herr Hempel", "Rike"], "a": 1, "e": "Jannek ruft einem vorbeirasenden Auto etwas nach, es setzt zurück, und am Steuer sitzt sein alter Freund Till."}, {"q": "Woher stammt das Blut auf Hannes Küchentisch?", "o": ["Hanne hat sich in den Finger geschnitten", "Von einem Huhn", "Von einem Kaninchen", "Es ist rote Farbe"], "a": 2, "e": "Hanne sagt nur „Kaninchen“, sie hat ein Kaninchen geschlachtet."}, {"q": "Was hat Janneks Mutter für Hanne mitgeschickt?", "o": ["Selbst gebackene Kekse", "Einen Blumenstrauß", "Ein Fotoalbum", "Eine Rheumacreme"], "a": 0, "e": "Die Mutter hat bis spät in die Nacht Kekse gebacken, aber Hanne rührt die Dose nicht an."}, {"q": "Welche Arbeit gibt Hanne Jannek gleich am ersten Tag?", "o": ["Die Hühner füttern", "Im Dorf einkaufen", "Die Scheune aufräumen", "Holz auf dem Hof hacken"], "a": 3, "e": "Jannek soll Opas Stiefel anziehen und Holz hacken. Dabei bekommt er Blasen an den Händen."}, {"q": "Warum nennt man Rikes Vater „Waldeinstein“?", "o": ["Weil er sehr klug ist", "Weil er Physiklehrer ist", "Weil er Einstein heißt", "Wegen seiner abstehenden Haare und weil er am Waldrand wohnt"], "a": 3, "e": "Till sagt, seine Haare stehen nach allen Seiten ab, als würde er den Finger in die Steckdose stecken, und das Haus steht am Waldrand."}], "audio": "audio/kap1_6ffe4981.mp3"}, {"nr": 2, "title": "Der grausige Fang", "summary": "Am Abend läuft Jannek durch Ribberow. Das Dorf hat sich kaum verändert, aber er fühlt sich dort fremd. Er holt Till bei den Hempels ab, und die beiden gehen zum Weiher angeln. Unterwegs treffen sie Rike Steinmann, ein Mädchen mit lockigen Haaren und einem Fahrradkorb voller Pflanzen. Am Weiher ist wegen der langen Trockenheit nur wenig Wasser. Plötzlich hängt an Janneks Angel eine Hand aus Knochen mit einem Siegelring. Jannek wird ganz schwach, und ihm wird kurz schwarz vor Augen. Dann entdecken die beiden im Wasser ein ganzes Skelett. Till ruft die Polizei. Polizeihauptkommissar Rädke stellt Jannek viele Fragen, die ihn nerven. Das Skelett bleibt über Nacht im Weiher.", "keypoints": ["Ribberow hat sich in zehn Jahren kaum verändert, nur ein paar Häuser sind neu gestrichen. Jannek fühlt sich fremd.", "Rike Steinmann wird vorgestellt: einzige Violinistin und Vegetarierin des Dorfes.", "Beim Angeln zieht Jannek eine Knochenhand mit Siegelring aus dem Weiher, dann sehen sie ein Skelett.", "Körpergefühl: Arme weich, rechtes Augenlid zuckt, Beine scheinen im Boden zu versinken, ihm wird schwarz vor Augen.", "Polizeihauptkommissar Rädke befragt Jannek. Jannek ist genervt und gereizt.", "Am nächsten Tag soll der Weiher abgepumpt werden."], "questions": [{"q": "Welchen Eindruck macht Polizeihauptmeister Rädke auf Jannek?", "answer": "Rädke trägt ein braunes Cordjackett und hat eine Knollennase und buschige Augenbrauen. Jannek findet ihn nervig, weil er ihm Fragen stellt, die ihm sinnlos vorkommen, fast wie in einem Verhör. Jannek hat sogar das Gefühl, dass sich Rädke mehr für ihn interessiert als für die Leiche, und wird gereizt.", "quote": "Jannek nervte die Befragung allmählich. Erst die zwei Polizisten, bei denen er sich wie im Kreuzverhör vorkam, und jetzt diese alte Knollennase."}, {"q": "Wie findet Jannek Ribberow jetzt, wo er älter geworden ist?", "answer": "Das Dorf hat sich kaum verändert. Nur ein paar Häuser haben einen neuen Anstrich, die meisten sind alt, grau und verrostet. Je älter Jannek wird, desto fremder fühlt er sich in Ribberow, und es nervt ihn, dass er für alle immer noch „der kleine Jensen“ ist.", "quote": "Erst hatte Jannek Ribberow vermisst, doch je älter er wurde, desto fremder fühlte er sich bei den Besuchen im Dorf."}, {"q": "Welches Körpergefühl hatte Jannek, als sie die Hand im Weiher gefischt haben?", "answer": "Janneks Arme werden weich und schwach, sein rechtes Augenlid beginnt zu zucken, und er hat das Gefühl, dass seine Beine im Boden versinken. Ihm schnürt es die Kehle zu, und kurz danach wird ihm sogar schwarz vor Augen.", "quote": "Jannek spürte, wie seine Arme weich wurden. Sein rechtes Augenlid begann zu zucken. Er hatte das Gefühl, seine Beine versanken im Boden."}], "quiz": [{"q": "Was hängt plötzlich an Janneks Angelhaken?", "o": ["Ein alter Stiefel", "Eine Knochenhand mit Siegelring", "Ein großer Hecht", "Ein Fahrradreifen"], "a": 1, "e": "Der Haken hat sich im Siegelring am Ringfinger einer Skeletthand verfangen."}, {"q": "Warum ist im Weiher so wenig Wasser?", "o": ["Jemand hat das Wasser abgelassen", "Die Polizei hat es schon abgepumpt", "Ein Damm ist gebrochen", "Wegen der langen Dürre im Sommer"], "a": 3, "e": "Till erklärt, dass es seit Monaten nicht richtig geregnet hat."}, {"q": "Wie stellt Till Rike vor?", "o": ["Als einzige Violinistin und Vegetarierin des Dorfes", "Als seine Freundin", "Als beste Fußballerin im Landkreis", "Als Tochter des Bürgermeisters"], "a": 0, "e": "Till sagt: „Rike Steinmann, einzige Violinistin und Vegetarierin des Dorfes.“"}, {"q": "In welcher Stadt wohnt Jannek jetzt?", "o": ["Sandemünde", "Berlin", "Pinzlau", "Großkumerow"], "a": 2, "e": "Jannek ist mit sechs Jahren mit seiner Mutter nach Pinzlau gezogen."}, {"q": "Was macht Till, nachdem sie das Skelett entdeckt haben?", "o": ["Er rennt weg", "Er holt Hanne", "Er ruft mit dem Handy die Polizei", "Er zieht das Skelett ans Ufer"], "a": 2, "e": "Jannek fragt Till, was man als Polizist macht, und Till antwortet: „Man ruft die Polizei.“"}], "audio": "audio/kap2_bc6889fa.mp3"}, {"nr": 3, "title": "Mord im Weiher?", "summary": "In der Nacht kann Jannek kaum schlafen. Er sieht den Weiher im Nebel und hört Stimmen und einen schrecklichen Schrei. Er fragt sich, ob der Mörder vielleicht noch im Dorf lebt. Am Morgen läuft er zum Weiher. Das halbe Dorf steht dort und schaut ihn misstrauisch an. Das Wasser ist abgepumpt, und das Skelett liegt auf einem alten, halben Ackerpflug. Till ruft an: Der Tote war ein Mann um die vierzig, er lag etwa fünf Jahre im Wasser und war wohl an den Pflug gebunden. Also war es Mord. Als Jannek das Hanne erzählt, zittert ihre Hand. Dann schickt sie ihn zur Apotheke nach Großkumerow. Dort trifft er Rike, und auf dem Heimweg gewinnt sie ein Radrennen gegen ihn.", "keypoints": ["Jannek kann nicht schlafen: Er sieht den Weiher im Nebel, hört Lachen, ein Knirschen und einen markerschütternden Schrei.", "Er denkt an Unfall, Selbstmord oder Mord und daran, dass der Mörder noch im Dorf sein könnte.", "Der Weiher wird abgepumpt. Das Skelett lag auf einem halben Ackerpflug, mit Seilresten: also Mord.", "Hanne erschrickt bei der Nachricht: Die Hand mit der Tasse zittert.", "Jannek holt Hannes Rheumacreme in der Apotheke in Großkumerow und trifft dort Rike, die Schlaftabletten für ihren Vater kauft.", "Rike gewinnt das Radrennen nach Ribberow knapp."], "questions": [{"q": "Wieso konnte Jannek am Abend nicht schlafen? Woran dachte er?", "answer": "Jannek ist nach dem Fund noch geschockt. Wenn er die Augen schließt, sieht er den Weiher im Nebel und hört Stimmen, Lachen, ein Knirschen und einen markerschütternden Schrei. Er denkt darüber nach, ob es ein Unfall, Selbstmord oder Mord war und ob der Mörder vielleicht noch im Dorf lebt, vielleicht sogar jemand, den er kennt.", "quote": "Ein Mord in Ribberow. Janneks Atem ging schneller. Womöglich war der Mörder noch im Dorf. Direkt in der Nachbarschaft."}, {"q": "Wie reagierte Hanne auf die Nachricht von Jannek?", "answer": "Hanne erschrickt sichtlich: Sie stellt die Tasse langsam ab, ihre Hand zittert, und sie starrt Jannek an. Danach spielt sie die Sache herunter, schneidet eine viel zu dünne Brotscheibe, meint, solche Untersuchungen funktionieren nur im Fernsehen, und beendet das Frühstück.", "quote": "Hanne setzte die Tasse langsam wieder ab, die sie gerade zum Mund führen wollte. Auf dem letzten Stück fing die Hand leicht zu zittern an."}, {"q": "Warum ging Jannek zur Apotheke? Wen traf er dort?", "answer": "Hanne schickt Jannek mit dem Fahrrad zur Apotheke nach Großkumerow, weil ihre Rheumacreme alle ist. Dort trifft er Rike, die Schlaftabletten für ihren Vater kauft.", "quote": "»Aber du kannst mit dem Rad rüber nach Großkumerow zur Apotheke fahren. Meine Rheumacreme ist alle.«"}], "quiz": [{"q": "Worauf lag das Skelett im Weiher?", "o": ["Auf einem alten Fahrrad", "Auf einem Autoreifen", "Auf einem halben Ackerpflug", "Auf einem Holzboot"], "a": 2, "e": "Till erzählt am Telefon, dass der Tote auf einem halben Ackerpflug lag und Seilreste gefunden wurden."}, {"q": "Was schätzt die Polizei zuerst über den Toten?", "o": ["Ein Mann um die 40, etwa fünf Jahre im Wasser", "Eine Frau, über hundert Jahre im Wasser", "Ein Jugendlicher, ein Jahr im Wasser", "Ein alter Mann, zwanzig Jahre im Wasser"], "a": 0, "e": "Jannek erzählt Hanne, dass es ein Mann um die 40 war, der circa fünf Jahre im Wasser lag."}, {"q": "Wie verhalten sich die Dorfbewohner am Weiher Jannek gegenüber?", "o": ["Sie begrüßen ihn freundlich", "Sie fragen ihn nach dem Fund aus", "Sie beachten ihn überhaupt nicht", "Sie verstummen und mustern ihn misstrauisch"], "a": 3, "e": "Wenn er sich einem Grüppchen nähert, hören die Gespräche auf, und manche schauen geradezu feindselig."}, {"q": "Für wen kauft Rike die Schlaftabletten?", "o": ["Für sich selbst", "Für ihren Vater", "Für Hanne", "Für ihre Mutter"], "a": 1, "e": "Rike sagt, ihr Vater nimmt die Tabletten seit fünf Jahren, weil er nicht gut einschlafen kann."}, {"q": "Wer gewinnt das Radrennen von Großkumerow nach Ribberow?", "o": ["Jannek", "Unentschieden", "Rike", "Till"], "a": 2, "e": "Kurz vor dem Ortsschild schießt Rike an Jannek vorbei, ohne aus dem Sattel zu gehen."}], "audio": "audio/kap3_cd19b9b5.mp3"}, {"nr": 4, "title": "Der Pflug in der Scheune", "summary": "Am Montagabend spielen Jannek und Till im Dorfkrug Darts. Alle Gäste starren sie an, und der neugierige alte Gustav will heimlich mithören. Die beiden überlegen, wer der Tote sein könnte und warum ausgerechnet ein schwerer Ackerpflug im Weiher lag. Ein Raubmord war es wohl nicht, denn der Siegelring war noch da. Till erzählt, dass Rikes Mutter sich vor etwa fünf Jahren das Leben genommen hat. Jannek sagt, dass er Rike anders findet als andere Mädchen. Am nächsten Morgen schleicht er in Opas alte Scheune. Unter einer Plane findet er die fehlende Hälfte eines Ackerpflugs. Als er herauskommt, steht Hanne da und starrt ihn schweigend an. Jannek beschließt, erst einmal niemandem davon zu erzählen.", "keypoints": ["Im Dorfkrug spekulieren Jannek und Till über den Toten und den Ackerpflug.", "Kein Raubmord, denn der Siegelring war noch da. Für Leiche und Pflug braucht man wohl zwei Leute.", "Gustav ist ein alter, neugieriger Mann mit Schirmmütze, der mithören will.", "Rikes Mutter hat sich vor etwa fünf Jahren im Wald das Leben genommen.", "In Hannes abgeschlossener Scheune findet Jannek unter einer Plane den Pflugkörper, die fehlende Hälfte des Pflugs aus dem Weiher.", "Hanne sieht ihn schweigend und eisig an. Jannek erzählt vorerst niemandem davon."], "questions": [{"q": "Worüber unterhalten sich Jannek und Till im Dorfkrug?", "answer": "Sie reden über den Toten im Weiher: wer er gewesen sein könnte, warum man ihn an einen schweren Ackerpflug gebunden hat und dass es kein Raubmord war, weil der Siegelring noch da war. Danach sprechen sie über Rike, ihren Vater und den Tod von Rikes Mutter vor etwa fünf Jahren.", "quote": "Das Einzige, was wir schon mal ausschließen können, ist Raubmord. Den fetten Siegelring hätte sich der Mörder nicht entgehen lassen."}, {"q": "Was steht in der Scheune von Janneks Opa?", "answer": "In der Scheune steht viel altes Gerümpel, zum Beispiel ein Traktor ohne Vorderräder, eine Hollywoodschaukel und eine Weihnachtspyramide. Unter einer dunklen Plane versteckt findet Jannek einen halben Ackerpflug, den Pflugkörper. Es ist genau die Hälfte, die bei dem Pflug im Weiher fehlte.", "quote": "Unter der Schutzplane lag ein halber Ackerpflug. Es war genau die Hälfte, die bei dem Ackerpflug, auf dem das Skelett gelegen hatte, fehlte."}, {"q": "Welche Informationen erhalten wir über Gustav?", "answer": "Gustav ist ein alter Mann mit Schirmmütze, der im Dorfkrug sitzt. Er kommt in die Dartecke und tut so, als würde er sich die Bilder an der Wand ansehen, weil er heimlich mithören will. Till schickt ihn weg und nennt ihn einen alten, neugierigen Mann.", "quote": "»Ein alter, neugieriger Mann. Davon gibt’s in Ribberow jede Menge.«"}], "quiz": [{"q": "Warum glaubt Till zuerst, dass der Tote nicht aus dem Dorf stammt?", "o": ["Weil er so teure Kleidung trug", "Weil in Ribberow jeder jeden kennt und niemand unbemerkt verschwindet", "Weil seine DNA unbekannt war", "Weil Hanne es gesagt hat"], "a": 1, "e": "Till sagt: „In so einem Nest wie Ribberow verschwindet man nicht einfach unbemerkt, hier kennt doch jeder jeden.“"}, {"q": "Warum schließt Till einen Raubmord aus?", "o": ["Weil der Tote kein Geld hatte", "Weil der Täter gefasst ist", "Weil der Siegelring noch an der Hand war", "Weil es nachts passiert ist"], "a": 2, "e": "Den wertvollen Siegelring hätte sich ein Räuber nicht entgehen lassen."}, {"q": "Wie kommt Jannek in die Scheune?", "o": ["Er quetscht sich durch eine Lücke bei einer losen Holzlatte", "Hanne gibt ihm den Schlüssel", "Er klettert durch das Dach", "Das Tor ist offen"], "a": 0, "e": "Beide Tore haben ein Vorhängeschloss, deshalb schiebt Jannek eine lose Latte zur Seite."}, {"q": "Wie reagiert Hanne, als Jannek aus der Scheune kommt?", "o": ["Sie schimpft laut mit ihm", "Sie fragt, was er gefunden hat", "Sie lacht", "Sie starrt ihn schweigend an, schüttelt den Kopf und geht ins Haus"], "a": 3, "e": "Hanne sagt kein Wort, ihre Augen wirken noch eisiger als sonst."}, {"q": "Was beschließt Jannek nach dem Fund in der Scheune?", "o": ["Er ruft sofort Rädke an", "Er erzählt vorerst niemandem davon", "Er wirft den Pflugkörper in den Weiher", "Er fährt nach Hause"], "a": 1, "e": "Er will warten, bis mehr bekannt ist, weil er Hanne keinen Ärger machen möchte."}], "audio": "audio/kap4_562f1eef.mp3"}, {"nr": 5, "title": "Der Tote hat einen Namen", "summary": "Till kommt in der Mittagspause und hat Neuigkeiten. Der Tote heißt Frank Schelk, war sechsunddreißig Jahre alt und kam aus Großkumerow. Er ist nicht ertrunken, sondern durch Gewalt gestorben. Erst danach wurde er an den Pflug gebunden. Die Polizei kannte seine DNA aus einem alten Verdachtsfall. Jannek hat das Gefühl, dass Hanne heimlich zuhört. Am Telefon ist Janneks Mutter geschockt, denn sie kannte Schelk aus der Schule. Sie fragt besorgt, ob Hanne etwas gesagt hat. Am Abend erzählt Tills Vater, dass Schelk ein unbeliebter Frauenheld war und krumme Geschäfte gemacht hat. Am nächsten Morgen liest Jannek einen Artikel über den Fall in der Zeitung. Vor dem Konsum tratschen Leute aus dem Dorf und verdächtigen Rikes Vater.", "keypoints": ["Der Tote ist Frank Schelk aus Großkumerow, beim Tod 36 Jahre alt, seit fünf Jahren im Weiher.", "Er starb durch äußere Gewalt und wurde erst danach an das Pflugteil gebunden: Mord.", "Er war in der DNA-Kartei, weil er einmal in einem Fall in Sandemünde verdächtigt wurde. Nachgewiesen wurde ihm nichts.", "Janneks Mutter ist geschockt: Sie kannte Schelk von der Schule in Großkumerow und fragt nach Hanne.", "Herr Hempel: Schelk war Frauenheld, Schmarotzer, machte krumme Geschäfte bei der LPG-Auflösung und zog nach Berlin.", "Im Dorf wird getratscht, dass Rikes Vater, der „Waldeinstein“, der Mörder sei."], "questions": [{"q": "Warum war Janneks Mutter so schockiert?", "answer": "Janneks Mutter kannte Frank Schelk persönlich, denn sie war mit ihm auf derselben Schule in Großkumerow. Als sie den Namen hört, wird ihre Stimme belegt, sie atmet schwer und fragt besorgt, ob Hanne davon weiß und ob sie etwas gesagt hat.", "quote": "Jannek hörte, wie seine Mutter schwer atmete. Sie antwortete erst nach ein paar Sekunden. »Ja, ich kannte ihn.«"}, {"q": "Welche Informationen erhalten wir über das Mordopfer?", "answer": "Der Tote heißt Frank Schelk, kam aus Großkumerow, war bei seinem Tod 36 Jahre alt und starb vor fünf Jahren durch äußere Gewalt, erst danach wurde er an den Pflug gebunden. Er war in der DNA-Kartei der Polizei, weil er früher einmal bei einer Vergewaltigung in Sandemünde zu den Verdächtigen gehörte, nachgewiesen wurde ihm aber nichts. Er galt als Frauenheld, machte krumme Geschäfte bei der Auflösung der LPG, war unbeliebt und zog vor etwa 17 Jahren nach Berlin.", "quote": "Er muss zum Todeszeitpunkt 36 Jahre alt gewesen sein. Er war in der Datei, weil er bei einer Vergewaltigung in Sandemünde mal zu den Verdächtigen gezählt hatte."}], "quiz": [{"q": "Woran ist Frank Schelk laut Polizei gestorben?", "o": ["Er ist im Weiher ertrunken", "An einer Vergiftung", "Durch äußere Gewalt, danach wurde er an den Pflug gebunden", "Er ist erfroren"], "a": 2, "e": "Till sagt, Schelk starb nicht durch Ertrinken. Die Leiche wurde nachträglich an das Pflugteil gebunden."}, {"q": "Wie hat die Polizei herausgefunden, wer der Tote ist?", "o": ["Durch seine DNA, die schon in der Polizeikartei war", "Durch einen Ausweis in seiner Tasche", "Durch den Namen im Siegelring", "Durch einen Zeugen"], "a": 0, "e": "Aus den Knochen wurde eine DNA-Analyse gemacht, und Schelk war bereits in der Kartei."}, {"q": "Warum wurde Schelk nie als vermisst gemeldet?", "o": ["Weil alle froh waren, dass er weg war", "Weil er nach China ausreisen wollte und keine lebenden Angehörigen hatte", "Weil die Polizei die Meldung verloren hat", "Weil er einen falschen Namen hatte"], "a": 1, "e": "Das steht im Zeitungsartikel: Ein Geschäftspartner sagt, Schelk wollte vor fünf Jahren nach China."}, {"q": "Wen hält Herr Hempel für den Täter?", "o": ["Rikes Vater", "Hanne", "Einen Durchreisenden", "Einen Geschäftspartner aus Berlin"], "a": 3, "e": "Herr Hempel glaubt, Schelk schuldete einem Geschäftspartner Geld oder hatte ihn betrogen."}, {"q": "Wen verdächtigen die Frauen vor dem Konsum?", "o": ["Till", "Den Waldeinstein, also Rikes Vater", "Den Apotheker", "Die Barfrau Sabine"], "a": 1, "e": "Sie tratschen, dass der „verrückte“ Waldeinstein Schelk umgebracht haben könnte. Beweise gibt es dafür keine."}], "audio": "audio/kap5_f1796948.mp3"}, {"nr": 6, "title": "Schrott wird lebendig", "summary": "Jannek trifft Rike im Dorf und hilft ihr, ihre Einkäufe nach Hause zu bringen. Unterwegs erzählt er ihr, dass er seinen Vater nie kennengelernt hat. Vor dem Haus der Steinmanns liegt ein großer Schrotthaufen, aber kein Ackerpflug. Rikes Vater Robert hat einen festen Händedruck und wilde Haare. Er baut aus Schrott Figuren und nennt das Reinkarnation. Eine Figur aus Draht sieht für Jannek aus wie eine Nymphe. Rike erzählt, dass ihr Vater erst ungefähr ein Jahr nach dem Tod ihrer Mutter mit dem Schrottsammeln angefangen hat. Kurz glaubt Rike, dass Jannek nur spionieren will. Danach trifft Jannek Till. Als er erzählt, dass er bei Rike war, wird Till wütend und fährt einfach davon.", "keypoints": ["Jannek hilft Rike Steinmann mit den Einkäufen und darf mit ins Haus.", "Jannek hat seinen Vater nie kennengelernt.", "Robert baut aus Schrott Figuren und Wesen („Reinkarnation“). Eine Drahtfigur nennt Jannek Nymphe.", "Robert sammelt Schrott erst seit etwa einem Jahr nach dem Tod seiner Frau, also seit drei bis vier Jahren. Vor fünf Jahren hatte er also noch keinen Schrott.", "Rike vermutet kurz, dass Jannek spionieren will.", "Till wird wütend, weil Jannek bei Rike war und die Theorie seines Vaters unlogisch findet."], "questions": [{"q": "Was macht Robert mit all dem Schrott?", "answer": "Robert baut aus dem Schrott Figuren und Wesen, die wie Menschen, Tiere oder Fantasiewesen aussehen. Er sagt, er haucht dem Schrott Leben ein, wie bei einer Reinkarnation.", "quote": "»Dem Schrott hauche ich Leben ein und verwandle ihn in neue Wesen. Ein bisschen wie Reinkarnation.«"}, {"q": "Wie nennt Jannek die Figur?", "answer": "Jannek nennt die weibliche Figur aus Drahtgitter eine Nymphe.", "quote": "»Sie sieht aus wie eine Nymphe.«"}, {"q": "Wie lautet Rikes voller Name?", "answer": "Rike heißt mit vollem Namen Rike Steinmann. Till stellt sie Jannek so vor, als sie sich im zweiten Kapitel zum ersten Mal begegnen.", "quote": "Darf ich vorstellen: Rike Steinmann, einzige Violinistin und Vegetarierin des Dorfes."}, {"q": "Warum war Till sauer auf Jannek?", "answer": "Till ärgert sich, weil Jannek einfach bei Rike im Haus war, wo sonst kaum jemand hineindarf, und weil Jannek die Theorie von Tills Vater über den Berliner Geschäftsmann unlogisch findet. Till sagt, Jannek solle nicht den großen Macker aus der Stadt spielen. Der eigentliche Grund ist Eifersucht, denn Till ist in Rike verliebt, wie man in Kapitel 7 erfährt.", "quote": "»Du hast was?« Till starrte Jannek einen Moment an. »Niemand besucht Rike einfach so.«"}, {"q": "Wann hat Robert mit dem Sammeln von Schrott angefangen?", "answer": "Robert hat ungefähr ein Jahr nach dem Tod seiner Frau angefangen, Schrott zu sammeln. Das ist etwa drei bis vier Jahre her.", "quote": "»Ungefähr ein Jahr nach dem Tod meiner Mutter hat er angefangen, Schrott zu sammeln«"}], "quiz": [{"q": "Was will Rike mit den vielen Pflanzen machen?", "o": ["Sie verkaufen", "Einen Wintergarten im neuen Anbau anlegen", "Sie Hanne schenken", "Tee daraus kochen"], "a": 1, "e": "Ihr Vater hat einen Anbau mit großen Glasfenstern gebaut. Dort soll es im Winter grün sein."}, {"q": "Wie viel wollte ein angeblicher Kunstkenner pro Figur bezahlen?", "o": ["Tausend Euro", "Hundert Euro", "Fünfzig Euro", "Zehn Euro"], "a": 3, "e": "Robert ist darüber so empört, dass er dem Käufer am liebsten einen Tritt geben würde."}, {"q": "Was erzählt Jannek Rike über seinen Vater?", "o": ["Er hat ihn nie kennengelernt", "Er wohnt in Berlin", "Er ist Polizist", "Er ist vor einem Jahr gestorben"], "a": 0, "e": "Jannek sagt, seine Mutter habe ihm nicht viel über ihn erzählt. Er fühlt sich manchmal, als würde ihm ein Teil fehlen."}, {"q": "Warum hält Jannek das Gerücht über Robert für unlogisch?", "o": ["Weil Robert ein Alibi hat", "Weil Robert Vegetarier ist", "Weil Robert vor fünf Jahren noch gar keinen Schrott gesammelt hat", "Weil Robert damals im Ausland war"], "a": 2, "e": "Robert sammelt Schrott erst seit etwa drei oder vier Jahren, der Mord war aber vor fünf Jahren."}, {"q": "Wie reagiert Rike, als Jannek nach dem Zeitpunkt fragt?", "o": ["Sie lacht ihn aus", "Sie wird misstrauisch und fragt, ob er spionieren will", "Sie weint", "Sie ruft ihren Vater"], "a": 1, "e": "Rike fragt: „Hast du mir deshalb geholfen? Um hier rumzuspionieren?“"}], "audio": "audio/kap6_fd5373f9.mp3"}, {"nr": 7, "title": "Zwei Freunde, ein Mädchen", "summary": "Am Abend sucht Jannek seinen Freund Till und findet ihn am leeren Weiher. Till gibt zu, dass er schon seit sechs Jahren in Rike verliebt ist. Jannek merkt, dass er auch Gefühle für sie hat. Die beiden beschließen, dass Rike selbst entscheiden soll und sie trotzdem Freunde bleiben. In Tills Zimmer erzählt Jannek ihm von dem Pflugteil in Hannes Scheune. Tills Eltern wollen über Schelk nicht reden, und Herr Hempel schlägt sogar wütend auf den Tisch. Dann fragt Jannek endlich Hanne nach dem Pflug. Sie sagt nur, er hätte Opa fragen müssen, und geht in ihr Zimmer. Im Dorfkrug erfahren die Jungen von der Barfrau Sabine, dass Schelk dort früher oft getrunken hat.", "keypoints": ["Till ist in Rike verliebt, seit sie hergezogen ist (er war 15, sie 11). Er wartet seit sechs Jahren.", "Jannek merkt, dass Rike „etwas mit ihm gemacht“ hat. Beide wollen, dass Rike selbst entscheidet, und Freunde bleiben.", "Jannek erzählt Till vom Pflugkörper: Es ist der alte Ackerpflug der Jensens.", "Herr Hempel will nicht über Schelk und Schwericke reden und schlägt auf den Tisch.", "Hanne sagt zum Pflug nur: „Das hättest du Opa fragen müssen.“", "Plan: Schule in Großkumerow und Bibliothek in Sandemünde durchsuchen."], "questions": [{"q": "Was denken Jannek und Till über Rike?", "answer": "Beide sind in Rike verliebt. Till ist schon in sie verknallt, seit sie ins Dorf gezogen ist, er hat sie oft eingeladen und wartet seit sechs Jahren, doch sie hat ihn immer abgewiesen. Jannek merkt, dass Rike etwas mit ihm gemacht hat, und beide beschließen, dass Rike selbst entscheiden soll und sie trotzdem Freunde bleiben.", "quote": "»Stimmt. Da ist etwas. Ich weiß nicht, ob ich etwas mit ihr gemacht habe, aber sie hat auf jeden Fall etwas mit mir gemacht.«"}], "quiz": [{"q": "Wie alt waren Till und Rike, als Rike nach Ribberow zog?", "o": ["Till 15, Rike 11", "Till 18, Rike 16", "Till 12, Rike 12", "Till 21, Rike 16"], "a": 0, "e": "Till sagt: „Obwohl ich erst fünfzehn war, als sie hierherzog, und sie erst elf.“"}, {"q": "Was antwortet Hanne, als Jannek sie nach dem Pflug fragt?", "o": ["„Den hat jemand gestohlen.“", "„Den habe ich nie gesehen.“", "„Das hättest du Opa fragen müssen.“", "„Ruf die Polizei.“"], "a": 2, "e": "Hanne nickt nur kaum merklich, sagt diesen Satz und geht ins Schlafzimmer."}, {"q": "Wie reagiert Herr Hempel auf die Fragen zu Schelk und der LPG?", "o": ["Er erzählt alles ganz genau", "Er lacht und macht Witze", "Er ruft Rädke an", "Er schlägt mit der Faust auf den Tisch"], "a": 3, "e": "Er will sich den Feierabend nicht verderben lassen und sagt, Schelk sei „längst vermodert“."}, {"q": "Wer ist Schwericke?", "o": ["Der Apotheker", "Der Wirt vom Dorfkrug", "Ein Polizist aus Berlin", "Der Leiter des Biobauernhofs bei Großkumerow"], "a": 3, "e": "Till erzählt, Schwericke war bei der LPG-Auflösung „dicke mit dabei“, genau wie Schelk."}, {"q": "Was erzählt die Barfrau Sabine über Schelk?", "o": ["Er hat im Dorfkrug viel getrunken", "Er war ihr Freund", "Sie hat ihn nie gesehen", "Er hat den Dorfkrug gekauft"], "a": 0, "e": "Sabine sagt, Schelk habe „jesoffen wie ein Loch“, weiß aber nicht mehr, wann genau er da war."}], "audio": "audio/kap7_46f62c43.mp3"}, {"nr": 8, "title": "Spurensuche in der Vergangenheit", "summary": "Till und Jannek fahren nach Großkumerow zur alten Schule, in die auch Schelk gegangen ist. Hausmeister Harry lässt sie hinein. In der Abschlusszeitung finden sie Fotos von Schelk. Auf einem Bild singt er in einer Band, und Tills Vater spielt Gitarre. Auf einem anderen Foto steht Tills Mutter neben ihm und himmelt ihn an. Danach suchen die beiden in der Bibliothek in Sandemünde in alten Zeitungen. Sie lesen, dass Schelk zusammen mit Schwericke die LPG aufgelöst hat. Viele Leute bekamen dabei nur wenig Geld und waren deshalb wütend. Außerdem finden sie einen Bericht über den Tod von Rikes Mutter. Am Ende beschließen die beiden, Schwericke selbst zu befragen.", "keypoints": ["Hausmeister Harry öffnet ihnen die Grundschule Großkumerow, früher „Polytechnische Oberschule Friedrich Engels“.", "Schelk wurde 1967 geboren und ging etwa von 1973 bis 1983 zur Schule.", "Abschlusszeitung 1983: Bandfoto mit Schelk am Mikrofon und Tills Vater an der Gitarre, Foto mit Tills Mutter Marianne (damals Wilke). Knubs war in Schelks Klasse.", "Bibliothek Sandemünde: Schwericke (früher LPG-Vorsitzender) und sein Assistent Schelk lösten die LPG auf.", "Artikel „LPG-Glücksritter“: Viele frühere Mitglieder wurden mit einer billigen Abfindung abgespeist.", "Schwericke gründete später einen großen Biobauernhof. Die Jungen wollen ihn befragen."], "questions": [{"q": "Was finden Jannek und Till in der Schule heraus?", "answer": "In der Abschlusszeitung von 1983 finden sie ein Foto von einer Band: Schelk singt am Mikrofon, und Tills Vater spielt Gitarre. Auf einem anderen Foto steht Schelk am See zwischen Mädchen, darunter Tills Mutter Marianne, die ihn anhimmelt. Außerdem sehen sie, dass Knubs, also Andreas Knuse, mit Schelk in einer Klasse war.", "quote": "»Ist das an der Gitarre nicht dein Vater?«, fragte Jannek."}, {"q": "Wer öffnet Jannek und Till die Tür?", "answer": "Hausmeister Harry öffnet ihnen die Tür. Er wohnt in einer kleinen Wohnung im Nebengebäude der Schule und kennt Till von früher.", "quote": "»Till? Bist du das? Warte, ich komme vorne rum und mach dir auf«"}, {"q": "Von wann bis wann ging Frank Schelk zur Schule?", "answer": "Frank Schelk ging etwa von 1973 bis 1983 in Großkumerow zur Schule. Das rechnet Jannek aus, weil Schelk 1967 geboren wurde.", "quote": "»… etwa von 1973 bis 1983 hier zur Schule gegangen sein«, sagte Jannek."}, {"q": "Was gründete Schwerike?", "answer": "Schwericke, der frühere Vorsitzende der LPG, hat später einen großen Biobauernhof bei Großkumerow aufgebaut.", "quote": "»War früher LPG-Vorsitzender und später hat er den großen Biobauernhof aufgebaut.«"}], "quiz": [{"q": "Wie hieß die Schule in Großkumerow früher?", "o": ["Gymnasium Sandemünde", "Polytechnische Oberschule Friedrich Engels", "Realschule Ribberow", "Heinz-Jensen-Schule"], "a": 1, "e": "Über der Holztür stand früher dieser Name, heute steht dort „Grundschule Großkumerow“."}, {"q": "Welche Anzeige steht von Schelk in der Abschlusszeitung?", "o": ["„Suche Lupe für meine Hieroglyphen.“", "„Tausche Schulstuhl gegen Sessel.“", "„Suche Band, die mich singen lässt.“", "„Suche Rücknahmestelle für meine Verflossenen.“"], "a": 3, "e": "Die Anzeige zeigt, dass Schelk schon mit sechzehn als Frauenheld galt."}, {"q": "Wer ist Andreas Knuse?", "o": ["Knubs aus dem Dorfkrug", "Der Hausmeister", "Schwerickes Sohn", "Der Apotheker"], "a": 0, (function(){

function mcRound(box, list, onEnd, opts){
  opts=opts||{}; let i=0, res=[];
  function prog(){ return `<div class="progress">${list.map((_,k)=>`<i class="${k<res.length?(res[k]?"ok":"bad"):(k===i?"cur":"")}"></i>`).join("")}</div>`; }
  function show(){
    const x=list[i]; const order=shuffle(x.o.map((t,k)=>({t,k})));
    box.innerHTML=prog()+`<div class="muted">Frage ${i+1} von ${list.length}${x.from?" · "+esc(x.from):""}</div><div class="qtext">${esc(x.q)}</div><div class="opts"></div><div class="fbx"></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" style="display:none">${i+1<list.length?"Nächste Frage →":"Auswertung →"}</button></div>`;
    const o=box.querySelector(".opts"), nb=box.querySelector(".btn");
    order.forEach(op=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=op.t; b.onclick=()=>{
      const ok=op.k===x.a; [...o.children].forEach((c,j)=>{c.disabled=true; if(order[j].k===x.a) c.classList.add("ok");}); if(!ok) b.classList.add("bad");
      res.push(ok); if(x.key){ st.q[x.key]={ok}; save(); } if(ok) addXP(10);
      box.querySelector(".fbx").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✔ Richtig!":"✘ Leider nicht."} ${esc(x.e||"")}</div>`;
      nb.style.display=""; nb.focus(); }; o.appendChild(b); });
    nb.onclick=()=>{ i++; if(i<list.length) show(); else end(); };
  }
  function end(){ const ok=res.filter(Boolean).length;
    box.innerHTML=prog()+`<div class="center"><div class="grade">${ok}/${list.length}</div><p><b>${ok===list.length?"Fall gelöst! 🕵️":ok>=list.length*.6?"Gute Ermittlungsarbeit!":"Lies die Zusammenfassung nochmal und versuch es erneut."}</b></p><button class="btn ghost">↻ Nochmal</button></div>`;
    box.querySelector("button").onclick=()=>{ i=0; res=[]; list=opts.reshuffle?opts.reshuffle():list; show(); };
    if(onEnd) onEnd(ok,list.length); }
  show();
}

  const qz=card(`<h2>🧩 Figuren-Quiz</h2><div id="fq"></div>`);
  const mk=()=>shuffle(DATA.characters).slice(0,8).map(p=>{ const others=shuffle(DATA.characters.filter(x=>x.name!==p.name)).slice(0,3); return {q:"Wer ist das? „"+p.who+"“", o:[p.name,...others.map(x=>x.name)], a:0, e:p.name}; });
  mcRound(qz.querySelector("#fq"), mk(), null, {reshuffle:mk});
}

function zeit(){
  card(`<span class="stamp">CHRONOLOGIE</span><h1>Was passiert wann?</h1><div class="tl">${DATA.timeline.map(t=>`<div>${esc(t)}</div>`).join("")}</div>`);
  const c=card(`<h2>🧩 Bring die Ereignisse in die richtige Reihenfolge</h2><p class="muted">Tippe die Ereignisse nacheinander an, das früheste zuerst.</p><div id="ord"></div>`);
  const box=c.querySelector("#ord");
  function round(){
    const idx=shuffle(DATA.timeline.map((_,k)=>k)).slice(0,5).sort((a,b)=>a-b); const items=shuffle(idx); let picked=[];
    box.innerHTML=`<ol id="pk" class="kp" style="min-height:30px"></ol><div class="opts"></div><div class="fbx"></div>`;
    const o=box.querySelector(".opts");
    items.forEach(k=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=DATA.timeline[k]; b.onclick=()=>{ b.disabled=true; b.style.opacity=.4; picked.push(k); box.querySelector("#pk").innerHTML=picked.map(p=>`<li>${esc(DATA.timeline[p])}</li>`).join("");
      if(picked.length===idx.length){ const ok=picked.every((p,j)=>p===idx[j]); if(ok) addXP(20);
        box.querySelector(".fbx").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✔ Perfekte Reihenfolge!":"✘ Nicht ganz. Richtig ist:<ol class='kp'>"+idx.map(p=>`<li>${esc(DATA.timeline[p])}</li>`).join("")+"</ol>"}</div><button class="btn ghost" style="margin-top:10px">↻ Neue Runde</button>`;
        box.querySelector(".fbx button").onclick=round; } }; o.appendChild(b); });
  }
  round();
}

function spell(){
  const S=DATA.spelling;
  const c=card(`<span class="stamp">BEWEISMITTEL</span><h1>Rechtschreibung</h1><p>${S.intro}</p><div id="sp"></div>`);
  const box=c.querySelector("#sp");
  let list=shuffle(S.items).sort((a,b)=>(st.sp[a.right]||0)-(st.sp[b.right]||0)), i=0, ok=0;
  function show(){
    if(i>=list.length){ box.innerHTML=`<div class="center"><div class="grade">${ok}/${list.length}</div><p><b>${ok===list.length?"Alles richtig geschrieben! ✏️🏆":"Übung macht den Meister. Nochmal?"}</b></p><button class="btn">↻ Nochmal</button></div>`; box.querySelector("button").onclick=()=>{list=shuffle(S.items); i=0; ok=0; show();}; return; }
    const x=list[i];
    box.innerHTML=`<p class="muted">Wort ${i+1} von ${list.length}. So stand es in deinem Heft:</p><div class="wrongword">${esc(x.wrong)}</div><p>Schreib es richtig:</p><input class="inp" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="fbx"></div><div class="row" style="margin-top:12px"><button class="btn">Prüfen</button></div>`;
    const inp=box.querySelector("input"), b=box.querySelector(".btn"); let checked=false; inp.focus();
    const go2=()=>{ if(!checked){ if(!inp.value.trim()) return; checked=true; const r=inp.value.trim()===x.right; inp.className="inp "+(r?"ok":"bad"); inp.disabled=true;
        if(r){ok++; addXP(5); st.sp[x.right]=(st.sp[x.right]||0)+1;} else st.sp[x.right]=0; save();
        box.querySelector(".fbx").innerHTML=`<div class="fb ${r?"ok":"bad"}">${r?"✔ Richtig!":"✘ Richtig ist: <b>"+esc(x.right)+"</b>"} <span class="muted">💡 ${esc(x.tip)}</span></div>`; b.textContent="Weiter →"; b.focus(); }
      else { i++; show(); } };
    b.onclick=go2; inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go2(); } });
    box.addEventListener("keydown",e=>{ if(e.key==="Enter" && checked && e.target!==inp){ } });
  }
  show();
}

function test(){
  const c=card(`<span class="stamp">ABSCHLUSS</span><h1>Der große Abschlusstest</h1><p class="muted">15 gemischte Fragen aus allen acht Akten, ein Versuch pro Frage. Wie in der Arbeit!</p><div id="t"></div>`);
  const mk=()=>shuffle(C.flatMap(ch=>ch.quiz.map(x=>Object.assign({from:"Akte "+ch.nr},x)))).slice(0,15);
  mcRound(c.querySelector("#t"), mk(), (ok,n)=>{ const p=ok/n; const note=p>=.92?1:p>=.81?2:p>=.67?3:p>=.5?4:p>=.3?5:6; addXP(ok*5);
    const r=document.createElement("p"); r.className="center"; r.innerHTML=`Geschätzte Note: <b style="font-size:24px">${note}</b>`; c.querySelector("#t").appendChild(r); }, {reshuffle:mk});
}

$("#xp").textContent="⭐ "+st.xp; nav(); go(st.view||"start");
})();
</script>
