<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wetter-Detektive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf4ff; --bg2:#f7fbff; --card:#ffffff; --ink:#0f172a; --muted:#475569; --line:#d6e4f5;
  --blue:#2563eb; --blue2:#1d4ed8; --sun:#f59e0b; --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2;
  --ch:#2563eb; --chbg:#dbeafe;
  --r:18px; --shadow:0 6px 24px rgba(30,64,175,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 60%);color:var(--ink);font-family:'Nunito',system-ui,'Segoe UI',sans-serif;font-size:17px;line-height:1.55;min-height:100vh}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:900;font-size:19px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.brand .logo{font-size:26px}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.nav button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:5px}
.nav button.cur{border-color:var(--c);color:var(--c);background:var(--cb)}
.nav button.done::after{content:"✓";color:var(--ok);font-weight:900}
.xp{font-weight:900;background:#fff7e6;border:2px solid #fde3a7;color:#b45309;border-radius:999px;padding:4px 12px;white-space:nowrap}
.bar{height:6px;background:#e2ecf8}
.bar>div{height:100%;background:linear-gradient(90deg,#38bdf8,#2563eb);width:0;transition:width .5s}
/* ---------- layout ---------- */
main{max-width:1000px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 28px;border:1px solid var(--line)}
.kicker{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ch);background:var(--chbg);border-radius:999px;padding:3px 12px;margin-bottom:10px}
h1{font-size:34px;line-height:1.15;margin:.1em 0 .4em;font-weight:900}
h2{font-size:26px;line-height:1.2;margin:.1em 0 .5em;font-weight:900}
h3{font-size:19px;margin:1em 0 .3em;font-weight:900}
p{margin:.5em 0}
.lead{font-size:19px;color:#1e293b}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:900;font-size:17px;background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue2);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue2)}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:0 0 0 2px var(--line) inset}
.btn.sun{background:var(--sun);box-shadow:0 4px 0 #b45309}
.btn[disabled]{opacity:.45;cursor:default}
.navrow{display:flex;gap:12px;margin-top:22px;align-items:center}
.pos{font-weight:800;color:var(--muted);font-size:14px}
/* text blocks */
.textblock ul{padding-left:1.2em;margin:.4em 0}
.textblock li{margin:.25em 0}
.box{border-radius:14px;padding:14px 18px;margin:14px 0;border:2px solid}
.box.merke{background:#fff7e6;border-color:#fcd34d}
.box.merke::before{content:"📌 Merke";display:block;font-weight:900;color:#b45309;margin-bottom:4px}
.box.tipp{background:#ecfeff;border-color:#67e8f9}
.box.tipp::before{content:"🎯 Klassenarbeits-Tipp";display:block;font-weight:900;color:#0e7490;margin-bottom:4px}
.box.wow{background:#f5f3ff;border-color:#c4b5fd}
.box.wow::before{content:"🤯 Kaum zu glauben";display:block;font-weight:900;color:#6d28d9;margin-bottom:4px}
.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:12px 0}
.vocab div{background:var(--chbg);border-radius:12px;padding:10px 12px}
.vocab b{display:block;color:var(--ch)}
table.t{border-collapse:collapse;width:100%;margin:10px 0;font-size:16px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--chbg)}
.bigemoji{font-size:64px;line-height:1}
/* ---------- video player ---------- */
.player{max-width:min(100%,calc((100vh - 300px) * 16 / 9));min-width:min(100%,560px);margin:0 auto;background:#0b1730;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.stage{position:relative;aspect-ratio:16/9;background:#0b1730}
.stage svg{display:block;width:100%;height:100%}
.stage svg text{font-family:'Nunito',system-ui,sans-serif}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,20,45,.55);color:#fff;text-align:center;padding:16px}
.overlay .playbig{width:92px;height:92px;border-radius:50%;border:0;background:#fff;color:var(--blue);font-size:38px;box-shadow:0 8px 30px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding-left:6px}
.overlay .ttl{font-weight:900;font-size:24px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.overlay .sub{opacity:.85;font-weight:700}
.caption{background:#0f2244;color:#f1f5ff;padding:12px 18px;min-height:76px;font-size:17.5px;line-height:1.45;font-weight:600}
.caption.off{display:none}
.controls{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0b1730;color:#cfe0ff;flex-wrap:wrap}
.controls button{background:#16305e;border:0;color:#fff;border-radius:10px;min-width:42px;height:40px;font-size:17px;font-weight:900;padding:0 10px}
.controls button.on{background:#2563eb}
.segs{flex:1;display:flex;gap:3px;min-width:160px;height:12px;cursor:pointer}
.segs div{background:#28457a;border-radius:4px;position:relative;overflow:hidden}
.segs div i{position:absolute;inset:0;width:0;background:#60a5fa}
.segs div.past i{width:100%}
.time{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;min-width:84px;text-align:right}
/* scene element animation system */
.stage [data-in]{opacity:0;transition:opacity .6s ease}
.stage [data-in].vis{opacity:1}
.stage .pop{transform-box:fill-box;transform-origin:center;transform:scale(.3);transition:opacity .45s ease, transform .6s cubic-bezier(.3,1.6,.5,1)}
.stage .pop.vis{transform:scale(1)}
.stage .up{transform:translateY(26px);transition:opacity .6s ease, transform .6s ease}
.stage .up.vis{transform:none}
.stage .draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.8s ease .1s, opacity .2s}
.stage .draw.vis{stroke-dashoffset:0}
.stage .vis .pop:not([data-in]),.stage .vis .up:not([data-in]){transform:none}
.stage .vis .draw:not([data-in]){stroke-dashoffset:0}
.stage .flow{stroke-dasharray:14 10;animation:flow 1s linear infinite}
.stage .flowslow{stroke-dasharray:14 10;animation:flow 2.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.stage .spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
.stage .spinfast{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
.stage .spinrev{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.stage .bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.stage .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.8}}
.stage .twinkle{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35}}
.stage .band{fill-opacity:.32;transition:fill-opacity .5s, stroke-width .3s}
.stage .band.hl{fill-opacity:.95;stroke:#fff;stroke-width:3}
.stage .hlt{transition:opacity .4s}
.stage .dimx{opacity:.45;transition:opacity .4s}
.stage .dimx.hl{opacity:1}
/* ---------- quiz ---------- */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qcount{font-weight:900;color:var(--ch)}
.qdots{display:flex;gap:5px}
.qdots i{width:12px;height:12px;border-radius:50%;background:#e2e8f0;display:block}
.qdots i.ok{background:var(--ok)} .qdots i.bad{background:var(--bad)} .qdots i.cur{outline:3px solid var(--ch);outline-offset:1px}
.qtext{font-size:22px;font-weight:900;line-height:1.3;margin:8px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-weight:700;font-size:17px;color:var(--ink);transition:transform .08s, border-color .2s, background .2s}
.opt:hover:not([disabled]){border-color:var(--ch);transform:translateY(-1px)}
.opt .k{flex:none;width:32px;height:32px;border-radius:9px;background:var(--chbg);color:var(--ch);font-weight:900;display:flex;align-items:center;justify-content:center}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.order-picked{display:grid;gap:8px;margin:0 0 14px;counter-reset:o}
.order-picked div{border:2px dashed var(--line);border-radius:12px;padding:9px 14px;min-height:44px;font-weight:800;color:var(--muted);display:flex;gap:10px;align-items:center}
.order-picked div::before{counter-increment:o;content:counter(o);width:26px;height:26px;border-radius:8px;background:var(--chbg);color:var(--ch);display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.order-picked div.f{border-style:solid;border-color:var(--ch);color:var(--ink);background:#fff}
.order-picked div.ok{border-color:var(--ok);background:var(--okbg)}
.order-picked div.bad{border-color:var(--bad);background:var(--badbg)}
.feedback{margin-top:16px;border-radius:14px;padding:14px 18px;font-weight:600}
.feedback.ok{background:var(--okbg);border:2px solid #86efac}
.feedback.bad{background:var(--badbg);border:2px solid #fca5a5}
.feedback b{font-weight:900}
.summary{text-align:center}
.stars{font-size:46px;letter-spacing:6px;color:#f59e0b}
.summary .qdots{justify-content:center;margin-top:8px}
/* toast */
.toast{position:fixed;left:50%;bottom:24px;opacity:0;transform:translateX(-50%) translateY(160%);background:#0f172a;color:#fff;border-radius:16px;padding:12px 20px;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* start screen */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.hero .art{font-size:110px;text-align:center;line-height:1.1}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:18px}
.chcard{border:2px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff;text-align:left;display:flex;gap:12px;align-items:center;color:var(--ink)}
.chcard:hover{border-color:var(--c)}
.chcard .e{font-size:34px}
.chcard b{display:block;font-weight:900}
.chcard small{color:var(--muted);font-weight:700}
.chcard.done{background:#f0fdf4;border-color:#86efac}
/* certificate */
.cert{border:6px double #f59e0b;border-radius:22px;padding:34px 24px;text-align:center;background:linear-gradient(180deg,#fffdf5,#fff)}
.cert h1{font-size:40px;color:#b45309}
.cert .name{font-size:32px;font-weight:900;border-bottom:3px solid #fcd34d;display:inline-block;min-width:240px;padding:0 10px;margin:8px 0}
.cert input{font:inherit;font-size:20px;padding:8px 12px;border-radius:10px;border:2px solid var(--line)}
@media (max-width:720px){
  body{font-size:16px}
  h1{font-size:27px} h2{font-size:22px}
  .card{padding:20px 18px}
  .hero{grid-template-columns:1fr} .hero .art{font-size:72px}
  .qtext{font-size:19px}
  .caption{font-size:16px;min-height:64px}
  .brand .txt{display:none}
  .time{display:none}
  .top-in{flex-wrap:nowrap;gap:8px;padding:8px 12px}
  .nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:none}
  .overlay .playbig{width:58px;height:58px;font-size:24px}
  .overlay .ttl{font-size:17px}
  .overlay .sub{display:none}
  .overlay .bigemoji{font-size:40px}
  .btn{padding:11px 16px;font-size:16px;white-space:nowrap}
  .navrow .pos{display:none}
  .controls button{min-width:38px;height:36px}
}
@media print{
  body{background:#fff}
  .top,.navrow,.noprint{display:none!important}
  main{padding:0}
  .card{box-shadow:none;border:0}
}
</style>
</head>
