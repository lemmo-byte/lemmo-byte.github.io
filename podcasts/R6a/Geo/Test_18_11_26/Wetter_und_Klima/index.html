const DATA = {"meta": {"kicker": "Geo · Klasse 7 · Klassenarbeits-Training", "title": "Wetter-Detektive: Weltweite Wetter- und Klimaphänomene", "lead": "Vom Stratosphärensprung über Hurrikans und Tornados bis zur Klima-Maschine Ozean. Mit Erklär-Animationen, kurzen Texten und vielen Quizfragen bereitest du dich Schritt für Schritt auf die Klassenarbeit vor.", "howto": "<b>So funktioniert's:<\/b> Jedes Kapitel hat kurze Texte zum Lesen, Erklär-Animationen mit Sprecherin (Ton an! 🔊) und Quizrunden. Für jede richtige Antwort und jede fertige Animation bekommst du ⭐. Nach jedem Kapitel gibt's ein Abzeichen, am Ende einen Abschlusstest mit Urkunde.<br><br><b>Achte auf die Aufgabenwörter:<\/b> <i>Nenne<\/i> = aufzählen ohne Erklärung. <i>Beschreibe<\/i> = mit eigenen Worten wiedergeben, was passiert. <i>Erkläre<\/i> = sagen, <u>warum<\/u> etwas so ist. <i>Erläutere<\/i> = erklären und mit Beispiel ausführlich begründen. <i>Begründe<\/i> = Gründe für eine Aussage nennen."}, "chapters": [{"id": "k1", "title": "Wetterküche Atmosphäre", "emoji": "🌍", "color": "#2563eb", "bg": "#dbeafe", "badge": "🪂", "badgeName": "Stratosphären-Springer", "recap": "<ul><li>Die <b>Atmosphäre<\/b> ist die Lufthülle der Erde. Ohne sie wäre es im Schnitt −18 °C kalt, mit ihr sind es etwa 15 °C.<\/li><li>Gase wie Wasserdampf, Kohlendioxid, Stickstoff und Methan halten die Wärme fest.<\/li><li>Schichten von unten nach oben: <b>Troposphäre<\/b> (Wetter, Sauerstoff, Flugverkehr) → <b>Stratosphäre<\/b> (Ozonschicht filtert UV-Strahlung) → <b>Mesosphäre<\/b> (Sternschnuppen verglühen) → <b>Thermosphäre<\/b> (Polarlichter, Raumfähren) → <b>Exosphäre<\/b> (Übergang zum Weltraum, Satelliten).<\/li><li>Eselsbrücke: <b>T<\/b>ante <b>S<\/b>usi <b>m<\/b>ag <b>T<\/b>orten <b>e<\/b>xtrem.<\/li><\/ul>", "blocks": [{"type": "text", "title": "Die Lufthülle der Erde", "html": "<p class='lead'>Über unseren Köpfen liegt eine dünne, aber lebenswichtige Hülle aus Luft: die <b>Atmosphäre<\/b>. In ihr entsteht unser Wetter, deshalb nennt man sie auch die <b>Wetterküche<\/b> der Erde.<\/p><div class='vocab'><div><b>Atmosphäre<\/b>Lufthülle der Erde, besteht aus mehreren Schichten<\/div><div><b>Sauerstoff<\/b>Gas, das wir zum Atmen brauchen<\/div><div><b>UV-Strahlung<\/b>unsichtbarer, gefährlicher Teil des Sonnenlichts (Sonnenbrand!)<\/div><div><b>Ozonschicht<\/b>filtert UV-Strahlung heraus<\/div><\/div><p>Gleich lernst du einen Mann kennen, der aus 39.000 Metern Höhe gesprungen ist. Achte darauf, <b>warum<\/b> er einen Spezialanzug brauchte.<\/p>"}, {"type": "video", "title": "Ein Sprung aus 39.000 Metern", "scene": "k1a", "clips": [{"t": "Hallo und willkommen im Wetterlabor! Ich bin Anneke und begleite dich durch die Themen für deine Geo-Klassenarbeit. Wir starten mit einer echten Geschichte. Am 14. Oktober 2012 sitzt der Extremsportler Felix Baumgartner in einer kleinen Kapsel. Über ihm schwebt ein riesiger Ballon.", "src": "audio/k1a_00_86518566.mp3", "dur": 17.83}, {"t": "Der Ballon trägt ihn immer höher. Zehn Kilometer, zwanzig, dreißig. Schließlich ist er in 39.000 Metern Höhe. Das ist mehr als viermal so hoch wie der Mount Everest. Der Himmel ist dort oben fast schwarz.", "src": "audio/k1a_01_9290a561.mp3", "dur": 12.63}, {"t": "Um 12 Uhr 7 springt er ab. Er fällt so schnell, dass er als erster Mensch im freien Fall die Schallmauer durchbricht. Kurz gerät er ins Trudeln und dreht sich schnell um sich selbst. Aber er fängt sich wieder.", "src": "audio/k1a_02_bdb8659e.mp3", "dur": 12.07}, {"t": "In 1.585 Metern Höhe zieht er die Reißleine. Der Fallschirm öffnet sich, und nach nur 4 Minuten und 20 Sekunden steht er wieder sicher auf der Erde. Weltrekord!", "src": "audio/k1a_03_d0ea9d0f.mp3", "dur": 11.33}, {"t": "Aber warum braucht er diesen dicken Spezialanzug wie ein Astronaut? Dort oben ist es eisig kalt, und es gibt kaum Luft zum Atmen. Der Anzug schützt ihn vor der Kälte, und sein Helm versorgt ihn mit Sauerstoff. Ohne beides würde er nicht überleben. Merk dir das, das ist eine typische Klassenarbeitsfrage!", "src": "audio/k1a_04_261fff7f.mp3", "dur": 17.83}, {"t": "Damit sind wir beim Thema: der Atmosphäre, der Lufthülle unserer Erde. Stell dir die Erde einmal ganz ohne diese Lufthülle vor. Dann wäre es bei uns im Durchschnitt minus 18 Grad kalt. Alles wäre gefroren, Leben wäre undenkbar.", "src": "audio/k1a_05_032945d2.mp3", "dur": 16.02}, {"t": "Mit Atmosphäre sieht es ganz anders aus. Die Sonnenstrahlen kommen herein und erwärmen die Erde. Bestimmte Gase in der Luft, nämlich Wasserdampf, Kohlendioxid, Stickstoff und Methan, halten die Wärme fest, damit sie nicht zurück ins Weltall entweicht. So haben wir im Durchschnitt angenehme 15 Grad. Die Atmosphäre wirkt also wie eine warme Decke um die Erde.", "src": "audio/k1a_06_b82f9772.mp3", "dur": 22.48}]}, {"type": "quiz", "title": "Quiz: Der Sprung und die warme Decke", "questions": [{"q": "Aus welcher Höhe sprang Felix Baumgartner im Jahr 2012?", "o": ["3.900 Meter", "12.000 Meter", "39.000 Meter", "390.000 Meter"], "a": 2, "e": "39.000 Meter, also 39 Kilometer. Das ist mehr als viermal so hoch wie der Mount Everest."}, {"q": "Warum brauchte Felix Baumgartner einen Spezialanzug mit Helm?", "o": ["Damit er schneller fallen konnte", "Weil es dort oben eisig kalt ist und kaum Sauerstoff gibt", "Damit ihn die Zuschauer besser sehen konnten", "Weil es in dieser Höhe stark regnet"], "a": 1, "e": "Der Anzug schützt vor der eisigen Kälte, der Helm versorgt ihn mit Sauerstoff. Ohne beides hätte er nicht überlebt."}, {"q": "Wie kalt wäre es auf der Erde im Durchschnitt <u>ohne<\/u> Atmosphäre?", "o": ["+15 °C", "0 °C", "−18 °C", "−60 °C"], "a": 2, "e": "Ohne Atmosphäre wären es etwa −18 °C. Mit Atmosphäre haben wir im Durchschnitt etwa 15 °C."}, {"q": "Welche Gase halten die Wärme in der Atmosphäre fest?", "o": ["Wasserdampf, Kohlendioxid, Stickstoff und Methan", "Nur Sauerstoff", "Helium und Neon", "Ozon und Wasserstoff"], "a": 0, "e": "Diese Gase verhindern, dass die Wärme der Sonnenstrahlung zurück ins Weltall entweicht. Sie wirken wie eine warme Decke."}]}, {"type": "text", "title": "Eine Torte aus Luft", "html": "<p class='lead'>Die Atmosphäre ist nicht überall gleich. Sie besteht aus <b>fünf Schichten<\/b>, die sich in <b>Zusammensetzung, Temperatur und Luftdruck<\/b> unterscheiden.<\/p><table class='t'><tr><th>Schicht<\/th><th>Das passiert dort<\/th><\/tr><tr><td>Exosphäre<\/td><td>Übergang zum luftleeren Weltraum<\/td><\/tr><tr><td>Thermosphäre<\/td><td>Polarlichter, Raumfähren<\/td><\/tr><tr><td>Mesosphäre<\/td><td>Sternschnuppen verglühen<\/td><\/tr><tr><td>Stratosphäre<\/td><td>Ozonschicht, kaum Wasserdampf<\/td><\/tr><tr><td>Troposphäre<\/td><td>Wetter, Sauerstoff, Flugzeuge<\/td><\/tr><\/table><p>Lies die Tabelle von <b>unten nach oben<\/b>, so wie du gleich durch die Atmosphäre fliegst. 🚀<\/p>"}, {"type": "video", "title": "Flug durch die Schichten der Atmosphäre", "scene": "k1b", "clips": [{"t": "Jetzt schauen wir uns die Atmosphäre genauer an. Sie besteht aus mehreren Schichten, fast wie eine Torte. Die Schichten unterscheiden sich in ihrer Zusammensetzung, in der Temperatur und im Luftdruck. Wir fliegen jetzt einmal von unten nach oben hindurch.", "src": "audio/k1b_00_c832b38b.mp3", "dur": 14.58}, {"t": "Ganz unten liegt die Troposphäre. Das ist unsere Schicht. Hier gibt es reichlich Sauerstoff zum Atmen, und hier findet das gesamte Wetter statt: Wolken, Regen, Schnee und Gewitter. Wenn du an Wetter denkst, denk an die Troposphäre.", "src": "audio/k1b_01_cff0c780.mp3", "dur": 15.09}, {"t": "Die Troposphäre reicht ungefähr 10 bis 12 Kilometer hoch. Auch die Flugzeuge fliegen hier, bis etwa 12.000 Meter. An ihrer Obergrenze ist es richtig kalt, ungefähr minus 60 Grad. Selbst der Mount Everest mit fast 9 Kilometern liegt noch in der Troposphäre.", "src": "audio/k1b_02_5f5dc35e.mp3", "dur": 16.35}, {"t": "Darüber folgt die Stratosphäre. Hier gibt es kaum noch Wasserdampf und deshalb kaum Wolken. Und hier liegt etwas sehr Wichtiges: die Ozonschicht. Sie filtert die gefährliche UV-Strahlung aus dem Sonnenlicht heraus und schützt uns zum Beispiel vor Sonnenbrand. Übrigens: Felix Baumgartner ist aus der Stratosphäre gesprungen.", "src": "audio/k1b_03_9b857ee7.mp3", "dur": 19.32}, {"t": "Weiter oben kommt die Mesosphäre. Hier verglühen die meisten Meteoriten. Wenn du nachts eine Sternschnuppe siehst, dann siehst du genau das: ein kleines Gesteinsstück aus dem All, das in der Mesosphäre verglüht.", "src": "audio/k1b_04_c6039e7b.mp3", "dur": 11.98}, {"t": "Noch höher liegt die Thermosphäre. Hier umkreisen Raumfähren und Raumstationen die Erde. Und hier entstehen die wunderschönen Polarlichter, die man im hohen Norden am Himmel tanzen sieht.", "src": "audio/k1b_05_3987cd5b.mp3", "dur": 11.15}, {"t": "Die oberste Schicht ist die Exosphäre. Sie ist die Übergangszone zwischen unserer Lufthülle und dem luftleeren Weltraum. Hier kreisen viele Satelliten, zum Beispiel für Navigation und Wetterbeobachtung.", "src": "audio/k1b_06_200753aa.mp3", "dur": 11.52}, {"t": "Für die Klassenarbeit solltest du die Reihenfolge kennen. Hier ist eine Eselsbrücke: Tante Susi mag Torten extrem. Tante steht für Troposphäre, Susi für Stratosphäre, mag für Mesosphäre, Torten für Thermosphäre und extrem für Exosphäre. Sag sie dir ruhig zweimal laut vor!", "src": "audio/k1b_07_401a5a51.mp3", "dur": 19.46}]}, {"type": "quiz", "title": "Quiz: Die Schichten der Atmosphäre", "questions": [{"type": "order", "q": "Bring die Schichten der Atmosphäre in die richtige Reihenfolge, von <u>unten nach oben<\/u>.", "items": ["Troposphäre", "Stratosphäre", "Mesosphäre", "Thermosphäre", "Exosphäre"], "e": "Eselsbrücke: Tante Susi mag Torten extrem."}, {"q": "Ein Gewitter tobt über deiner Stadt. In welcher Schicht findet es statt?", "o": ["Troposphäre", "Stratosphäre", "Mesosphäre", "Exosphäre"], "a": 0, "e": "Das gesamte Wettergeschehen findet in der untersten Schicht statt, der Troposphäre."}, {"q": "Wo liegt die Ozonschicht und was macht sie?", "o": ["In der Troposphäre, sie bildet Wolken", "In der Stratosphäre, sie filtert UV-Strahlung heraus", "In der Mesosphäre, sie lässt Sternschnuppen verglühen", "In der Exosphäre, sie hält Satelliten fest"], "a": 1, "e": "Die Ozonschicht in der Stratosphäre filtert die gefährliche UV-Strahlung des Sonnenlichts heraus."}, {"q": "In welcher Schicht verglühen die meisten Sternschnuppen (Meteoriten)?", "o": ["Troposphäre", "Stratosphäre", "Mesosphäre", "Thermosphäre"], "a": 2, "e": "In der Mesosphäre verglühen die meisten Meteoriten. Das sehen wir als Sternschnuppen."}, {"q": "Wo treten Polarlichter auf?", "o": ["In der Troposphäre", "In der Stratosphäre", "In der Thermosphäre", "Am Erdboden"], "a": 2, "e": "Polarlichter entstehen in der Thermosphäre. Dort umkreisen auch Raumfähren die Erde."}, {"q": "Bis in welche Höhe fliegen Flugzeuge ungefähr, und in welcher Schicht ist das?", "o": ["Bis 12.000 m, in der Troposphäre", "Bis 39.000 m, in der Stratosphäre", "Bis 80 km, in der Mesosphäre", "Bis 1.585 m, in der Exosphäre"], "a": 0, "e": "Der Flugverkehr findet bis etwa 12.000 Meter in der Troposphäre statt. An ihrer Obergrenze herrschen etwa −60 °C."}]}, {"type": "fact", "title": "Klassenarbeits-Check: Atmosphäre", "html": "<div class='box tipp'><b>Aufgabe:<\/b> „Felix Baumgartner trägt für seinen Sprung einen Spezialanzug. Ohne diesen könnte er nicht überleben. Begründe.“<br><br><b>So könnte deine Antwort aussehen:<\/b> In 39.000 m Höhe ist es eisig kalt und es gibt kaum Sauerstoff zum Atmen. Der Spezialanzug schützt ihn vor der Kälte und der Helm versorgt ihn mit Sauerstoff. Ohne Anzug würde er erfrieren und ersticken.<\/div><div class='box tipp'><b>Aufgabe:<\/b> „Erläutere die Bedeutung der Atmosphäre für das Leben auf der Erde.“<br><br><b>Stichpunkte für deine Antwort:<\/b><ul><li>Sie hält die Wärme fest (Gase wie Wasserdampf, Kohlendioxid): 15 °C statt −18 °C.<\/li><li>Die Troposphäre liefert Sauerstoff zum Atmen.<\/li><li>Die Ozonschicht in der Stratosphäre filtert gefährliche UV-Strahlung.<\/li><\/ul><\/div>"}]}, {"id": "k2", "title": "Winde wehen mit System", "emoji": "🌬️", "color": "#0891b2", "bg": "#cffafe", "badge": "🧭", "badgeName": "Windflüsterer", "recap": "<ul><li>Warme Luft steigt auf → am Boden <b>Tief (T)<\/b>. Kalte Luft sinkt ab → am Boden <b>Hoch (H)<\/b>. <b>Wind weht vom Hoch zum Tief.<\/b><\/li><li><b>Passatkreislauf:<\/b> Am Äquator steigt warme Luft auf (Tief), strömt in der Höhe nach Norden und Süden, sinkt an den Wendekreisen ab (Hoch) und weht als <b>Passat<\/b> zurück zum Äquator.<\/li><li>Die <b>Corioliskraft<\/b> (Erddrehung) lenkt die Winde ab: <b>Nordostpassat<\/b> (Nordhalbkugel), <b>Südostpassat<\/b> (Südhalbkugel).<\/li><li><b>ITC<\/b> = Innertropische Konvergenzzone: dort treffen die Passate zusammen, Luft steigt auf, es regnet. Sie wandert mit dem Zenitstand der Sonne → <b>Zenitalregen<\/b>, Regen- und Trockenzeit.<\/li><li>Windgürtel: <b>Passatzone<\/b> (30° N bis 30° S), <b>Westwindzone<\/b> (30° bis 70°), <b>polare Ostwindzone<\/b> (70° bis 90°).<\/li><\/ul>", "blocks": [{"type": "text", "title": "Hoch, Tief und Wind", "html": "<p class='lead'>Manche Winde bringen Hitze und Trockenheit, andere Wolken und Regengüsse. Ist das Zufall? Nein, die Winde der Erde wehen <b>mit System<\/b>. Der Motor dafür ist die Sonne.<\/p><div class='vocab'><div><b>Tief (T)<\/b>Warme Luft steigt auf, am Boden ist der Luftdruck niedrig.<\/div><div><b>Hoch (H)<\/b>Kalte Luft sinkt ab, am Boden ist der Luftdruck hoch.<\/div><div><b>Äquator<\/b>Breitenkreis 0°, hier ist es am wärmsten.<\/div><div><b>Wendekreise<\/b>bei etwa 23° Nord und 23° Süd<\/div><div><b>Zenit<\/b>Die Sonne steht mittags genau senkrecht über einem Ort.<\/div><\/div><div class='box merke'>Wind weht immer <b>vom Hoch zum Tief<\/b>. Winde werden nach der Richtung benannt, <b>aus der<\/b> sie kommen. Ein Westwind kommt also von Westen.<\/div>"}, {"type": "video", "title": "Der Passatkreislauf", "scene": "k2a", "clips": [{"t": "Weiter geht's mit dem Wind! Stell dir ein Lagerfeuer vor. Über den Flammen steigt heiße Luft nach oben. Warme Luft ist nämlich leichter als kalte Luft. Genau dieses Prinzip treibt die großen Winde der Erde an.", "src": "audio/k2a_00_55ff54a9.mp3", "dur": 13.7}, {"t": "Wo warme Luft aufsteigt, drückt am Boden weniger Luft nach unten. Dort entsteht ein Tiefdruckgebiet, kurz Tief, abgekürzt mit T. Wo kalte Luft absinkt, drückt mehr Luft auf den Boden. Dort entsteht ein Hochdruckgebiet, kurz Hoch, abgekürzt mit H.", "src": "audio/k2a_01_6963780f.mp3", "dur": 15.98}, {"t": "Die Luft will diesen Unterschied ausgleichen. Deshalb strömt sie am Boden vom Hoch zum Tief. Diese Ausgleichsströmung spüren wir als Wind. Oben in der Höhe strömt die Luft zurück, so entsteht ein Kreislauf. Merke: Wind weht immer vom Hoch zum Tief.", "src": "audio/k2a_02_57b8a8f7.mp3", "dur": 15.93}, {"t": "Jetzt übertragen wir das auf die ganze Erde. Am Äquator steht die Sonne besonders hoch und heizt den Boden am stärksten auf. Die Luft wird warm und steigt auf. Am Boden entsteht ein Tiefdruckgebiet.", "src": "audio/k2a_03_f6505c08.mp3", "dur": 12.07}, {"t": "Beim Aufsteigen kühlt die Luft ab. In großer Höhe strömt sie nach Norden und nach Süden, also vom Äquator weg.", "src": "audio/k2a_04_32572b34.mp3", "dur": 6.36}, {"t": "In der Nähe der Wendekreise sinkt die Luft wieder ab. Dort entstehen am Boden Hochdruckgebiete. Die Wendekreise liegen bei ungefähr 23 Grad nördlicher und 23 Grad südlicher Breite.", "src": "audio/k2a_05_1b22166a.mp3", "dur": 11.01}, {"t": "Und nun weht die Luft am Boden von diesen Hochs zurück zum Tief am Äquator. Diese Bodenwinde heißen Passate. Der Kreislauf ist geschlossen: aufsteigen, wegströmen, absinken, zurückwehen. Das nennt man Passatkreislauf oder Passatzirkulation.", "src": "audio/k2a_06_e1131877.mp3", "dur": 16.63}, {"t": "Wo die beiden Passate am Äquator zusammentreffen, steigt die feuchte, warme Luft auf. Dabei bilden sich riesige Wolken, und es regnet heftig. Diese Zone heißt Innertropische Konvergenzzone, kurz ITC. Konvergenz bedeutet Zusammenlaufen. Auf Satellitenbildern sieht man die ITC als Wolkenband rund um den Äquator.", "src": "audio/k2a_07_a2e72d77.mp3", "dur": 21.41}]}, {"type": "quiz", "title": "Quiz: Hoch, Tief und Passatkreislauf", "questions": [{"q": "Was passiert, wenn der Boden warme Luft stark erwärmt?", "o": ["Die Luft steigt auf, am Boden entsteht ein Tief", "Die Luft sinkt ab, am Boden entsteht ein Hoch", "Die Luft bleibt einfach am Boden liegen", "Die Luft wird schwerer und es schneit"], "a": 0, "e": "Warme Luft ist leichter und steigt auf. Am Boden drückt dann weniger Luft: ein Tiefdruckgebiet entsteht."}, {"q": "In welche Richtung weht der Wind am Boden?", "o": ["Vom Hoch zum Tief", "Vom Tief zum Hoch", "Immer von Osten nach Westen", "Immer vom Land zum Meer"], "a": 0, "e": "Wind ist eine Ausgleichsströmung: Die Luft strömt vom hohen Luftdruck (Hoch) zum niedrigen Luftdruck (Tief)."}, {"q": "Wo sinkt die Luft im Passatkreislauf wieder ab?", "o": ["Am Äquator", "In der Nähe der Wendekreise", "An den Polen", "Über Deutschland"], "a": 1, "e": "In der Nähe der Wendekreise (etwa 23° N und 23° S) sinkt die Luft ab. Dort entstehen Hochdruckgebiete."}, {"q": "Wie heißen die Bodenwinde, die von den Wendekreisen zum Äquator wehen?", "o": ["Jetstreams", "Passate", "Westwinde", "Polarwinde"], "a": 1, "e": "Die Passate wehen von den Hochs an den Wendekreisen zum Tief am Äquator."}, {"q": "Was ist die ITC?", "o": ["Die Zone am Äquator, in der die Passate zusammentreffen", "Ein Hochdruckgebiet am Nordpol", "Eine kalte Meeresströmung", "Die oberste Schicht der Atmosphäre"], "a": 0, "e": "ITC = Innertropische Konvergenzzone. Hier treffen Nordost- und Südostpassat zusammen, die Luft steigt auf und es regnet heftig."}]}, {"type": "text", "title": "Die Erde dreht sich mit", "html": "<p class='lead'>Wenn sich die Erde nicht drehen würde, kämen die Passate genau aus Norden und aus Süden. Aber die Erde dreht sich, und das lenkt die Winde ab.<\/p><div class='vocab'><div><b>Corioliskraft<\/b>Ablenkung der Winde durch die Drehung der Erde<\/div><div><b>Nordostpassat<\/b>Passat auf der Nordhalbkugel, kommt aus Nordosten<\/div><div><b>Südostpassat<\/b>Passat auf der Südhalbkugel, kommt aus Südosten<\/div><div><b>Zenitalregen<\/b>heftiger Regen, der mit der ITC und dem Sonnenstand wandert<\/div><\/div><p>Achte im nächsten Video darauf, <b>warum<\/b> der Zenitalregen in verschiedenen Monaten an verschiedenen Orten fällt.<\/p>"}, {"type": "video", "title": "Corioliskraft, Zenitalregen und Windgürtel", "scene": "k2b", "clips": [{"t": "Eigentlich müssten die Passate genau von Norden und von Süden zum Äquator wehen. Tun sie aber nicht. Die Erde dreht sich nämlich, und diese Drehung lenkt die Winde ab. Diese ablenkende Kraft heißt Corioliskraft.", "src": "audio/k2b_00_445e7be4.mp3", "dur": 13.37}, {"t": "Deshalb kommt der Passat auf der Nordhalbkugel aus Nordosten. Er heißt Nordostpassat. Auf der Südhalbkugel kommt er aus Südosten und heißt Südostpassat. Denk dran: Winde werden immer nach der Richtung benannt, aus der sie kommen.", "src": "audio/k2b_01_06615e70.mp3", "dur": 13.98}, {"t": "Jetzt wird es spannend: Die ITC bleibt nicht immer am Äquator. Sie wandert mit dem Sonnenstand. Im Juni und Juli steht die Sonne mittags senkrecht über dem nördlichen Wendekreis, man sagt: im Zenit. Dann wandert die ITC nach Norden.", "src": "audio/k2b_02_f2921cfe.mp3", "dur": 16.07}, {"t": "Im Dezember und Januar steht die Sonne über dem südlichen Wendekreis, und die ITC wandert nach Süden. Mit der ITC wandern auch die heftigen Regenfälle. Weil sie dem Zenitstand der Sonne folgen, heißen sie Zenitalregen.", "src": "audio/k2b_03_448fe68b.mp3", "dur": 13.47}, {"t": "Für die Gebiete zwischen den Wendekreisen bedeutet das: Ist die ITC da, ist Regenzeit. Ist sie weitergezogen, wehen die trockenen Passate, und es ist Trockenzeit. So entsteht in den Tropen der Wechsel zwischen Regenzeit und Trockenzeit.", "src": "audio/k2b_04_d9cf22d2.mp3", "dur": 14.16}, {"t": "Zum Schluss der Blick auf die ganze Erde. Es gibt drei große Windgürtel. Zwischen 30 Grad Nord und 30 Grad Süd liegt die Passatzone.", "src": "audio/k2b_05_1177829d.mp3", "dur": 8.82}, {"t": "Zwischen 30 und 70 Grad liegt auf beiden Halbkugeln die Westwindzone der Mittelbreiten. Hier liegt auch Deutschland. Deshalb kommt unser Wetter meistens von Westen. Und zwischen 70 und 90 Grad, also rund um die Pole, liegt die polare Ostwindzone.", "src": "audio/k2b_06_d2bb7c80.mp3", "dur": 15.05}, {"t": "Noch ein Extra: Hoch oben in der Troposphäre gibt es Starkwindbänder mit bis zu 500 Kilometern pro Stunde. Sie heißen Jetstreams. Flugzeuge nutzen sie gern als Rückenwind, deshalb dauert ein Flug von Amerika nach Europa oft kürzer als umgekehrt.", "src": "audio/k2b_07_4a3b899d.mp3", "dur": 15.19}]}, {"type": "quiz", "title": "Quiz: Corioliskraft, ITC und Windgürtel", "questions": [{"q": "Warum kommen die Passate nicht genau aus Norden und Süden?", "o": ["Weil die Erddrehung sie ablenkt (Corioliskraft)", "Weil Berge im Weg stehen", "Weil der Mond die Luft anzieht", "Weil die Ozeane sie umleiten"], "a": 0, "e": "Die Corioliskraft entsteht durch die Drehung der Erde und lenkt die Winde ab."}, {"q": "Wie heißt der Passat auf der Nordhalbkugel?", "o": ["Südostpassat", "Nordwestpassat", "Nordostpassat", "Westwind"], "a": 2, "e": "Auf der Nordhalbkugel kommt der Passat aus Nordosten: Nordostpassat. Auf der Südhalbkugel heißt er Südostpassat."}, {"q": "Warum wandert die ITC im Laufe des Jahres?", "o": ["Sie folgt dem Zenitstand der Sonne", "Sie wird von Meeresströmungen geschoben", "Sie folgt den Jetstreams", "Sie wandert zufällig"], "a": 0, "e": "Die ITC wandert mit dem Zenitstand der Sonne: im Juli nach Norden, im Januar nach Süden."}, {"q": "Wo liegt die ITC ungefähr im Juli?", "o": ["Nördlich des Äquators", "Südlich des Äquators", "Genau am Südpol", "Über Deutschland"], "a": 0, "e": "Im Juni und Juli steht die Sonne über dem nördlichen Wendekreis. Die ITC liegt dann nördlich des Äquators."}, {"q": "Was versteht man unter Zenitalregen?", "o": ["Heftiger Regen, der mit der ITC und dem Sonnenstand wandert", "Nieselregen im deutschen Herbst", "Regen, der nur nachts fällt", "Schnee in großer Höhe"], "a": 0, "e": "Der Zenitalregen folgt dem Zenitstand der Sonne und sorgt in den Tropen für Regenzeiten."}, {"q": "In welchem Windgürtel liegt Deutschland?", "o": ["Passatzone", "Westwindzone der Mittelbreiten", "Polare Ostwindzone", "In gar keinem"], "a": 1, "e": "Deutschland liegt zwischen 30° und 70° Nord, also in der Westwindzone. Deshalb kommt unser Wetter meist von Westen."}]}, {"type": "fact", "title": "Klassenarbeits-Check: Winde", "html": "<div class='box tipp'><b>Aufgabe:<\/b> „Beschreibe den Passatkreislauf.“<br><br><b>Musterantwort:<\/b> Am Äquator erwärmt die Sonne den Boden am stärksten. Die warme Luft steigt auf, am Boden entsteht ein Tief. In der Höhe kühlt die Luft ab und strömt nach Norden und Süden. An den Wendekreisen sinkt sie ab, dort entstehen Hochs. Von dort wehen die Passate als Bodenwinde zurück zum Äquator. Durch die Corioliskraft werden sie abgelenkt (Nordostpassat und Südostpassat). Wo sie zusammentreffen, liegt die ITC.<\/div><table class='t'><tr><th>Windgürtel<\/th><th>Breitenlage<\/th><\/tr><tr><td>Polare Ostwindzone<\/td><td>70° bis 90° (beide Halbkugeln)<\/td><\/tr><tr><td>Westwindzone der Mittelbreiten<\/td><td>30° bis 70° (beide Halbkugeln)<\/td><\/tr><tr><td>Passatzone<\/td><td>30° Süd bis 30° Nord<\/td><\/tr><\/table><div class='box wow'>Würde sich die Erde nicht drehen, gäbe es keine Corioliskraft. Die Winde würden dann auf direktem Weg als Nord- und Südwinde zwischen Polen und Tropen wehen.<\/div>"}]}, {"id": "k3", "title": "Tropische Wirbelstürme", "emoji": "🌀", "color": "#7c3aed", "bg": "#ede9fe", "badge": "🌀", "badgeName": "Hurrikan-Jäger", "recap": "<ul><li><b>Voraussetzungen:<\/b> riesige Wasserfläche und Wassertemperatur von <b>mindestens 27 °C<\/b> (nur in den Tropen).<\/li><li><b>Entstehung:<\/b> Wasser verdunstet, feuchte Luft steigt auf und setzt Energie frei → Unterdruck → warme, feuchte Luft wird angesaugt → die <b>Corioliskraft<\/b> versetzt die Luft in eine kreisende Bewegung.<\/li><li><b>Auge:<\/b> fast windstill und wolkenfrei. Wind bis 350 km/h, Durchmesser mehrere hundert km, Zugbahn 20–30 km/h, Lebensdauer 5–10 Tage. Über Land fehlt das warme Wasser → er wird schwächer.<\/li><li><b>Namen:<\/b> Hurrikan (Nordatlantik, Ostpazifik), Taifun (Westpazifik), Zyklon (Indischer Ozean, Südpazifik), Willy-Willy (Australien).<\/li><li><b>Hurricane Hunters<\/b> fliegen ins Auge und messen Zugbahn, Zuggeschwindigkeit und Stärke. Stärke: <b>Saffir-Simpson-Skala<\/b> (Kategorie 1–5). Sandy 2012: 185 km/h = Kategorie 3.<\/li><\/ul>", "blocks": [{"type": "text", "title": "Wenn der Wind zur Gefahr wird", "html": "<p class='lead'>Seit Tagen wird vor einem Hurrikan gewarnt. Überall vernageln Menschen die Fenster ihrer Häuser. Der Wind frischt auf, die Wellen erreichen die ersten Häuser. Wer jetzt noch draußen ist, schwebt in Lebensgefahr.<\/p><div class='vocab'><div><b>Tropischer Wirbelsturm<\/b>riesiger, drehender Sturm über warmem Meer<\/div><div><b>Auge<\/b>die ruhige Mitte des Sturms<\/div><div><b>Zugbahn<\/b>der Weg, den der Sturm zurücklegt<\/div><div><b>Unterdruck<\/b>niedriger Luftdruck, Luft wird angesaugt<\/div><\/div><p>Im Video erfährst du, welche <b>zwei Voraussetzungen<\/b> ein Hurrikan braucht. Die kommen in fast jeder Klassenarbeit dran!<\/p>"}, {"type": "video", "title": "Wie ein Hurrikan entsteht", "scene": "k3a", "clips": [{"t": "Jetzt wird es stürmisch! Tropische Wirbelstürme gehören zu den gefährlichsten Naturgewalten der Erde. Damit einer entstehen kann, braucht es zwei Dinge: eine riesige Wasserfläche und Wasser, das mindestens 27 Grad warm ist. So warm ist das Meer nur in den Tropen.", "src": "audio/k3a_00_0fa89db7.mp3", "dur": 16.25}, {"t": "Über dem warmen Meer verdunsten riesige Mengen Wasser. Die feuchte Luft steigt schnell auf. Dabei wird Energie frei, die die Luft noch weiter erwärmt. Sie dehnt sich aus und steigt immer weiter nach oben.", "src": "audio/k3a_01_3d9cd564.mp3", "dur": 11.89}, {"t": "Über der Meeresoberfläche entsteht dadurch ein Unterdruck, also ein Tief. Von allen Seiten wird weitere warme, feuchte Luft angesaugt, wie bei einem gigantischen Staubsauger.", "src": "audio/k3a_02_375805f9.mp3", "dur": 9.71}, {"t": "Jetzt kommt wieder die Corioliskraft ins Spiel. Die Drehung der Erde versetzt die aufsteigende Luft in eine kreisende Bewegung. Der Wirbelsturm beginnt sich zu drehen, immer schneller. Von oben sieht er aus wie eine riesige Spirale aus Wolken.", "src": "audio/k3a_03_3054ec32.mp3", "dur": 13.56}, {"t": "In der Mitte liegt das Auge des Sturms. Dort sinkt Luft ab. Im Auge ist es fast windstill und wolkenfrei. Rund um das Auge toben aber die stärksten Winde, mit bis zu 350 Kilometern pro Stunde.", "src": "audio/k3a_04_d63c69f9.mp3", "dur": 12.03}, {"t": "Ein Hurrikan kann mehrere hundert Kilometer groß werden und über 15 Kilometer hoch reichen. Ganz oben ist es etwa minus 70 Grad kalt. Er wandert mit 20 bis 30 Kilometern pro Stunde auf seiner Zugbahn und lebt etwa fünf bis zehn Tage.", "src": "audio/k3a_05_76022c1b.mp3", "dur": 15.0}, {"t": "Was passiert, wenn er auf Land trifft? Dann ist er von seiner Energiequelle abgeschnitten, dem warmen Wasser. Er wird schwächer und löst sich langsam auf. Vorher richtet er an der Küste aber oft schwere Schäden an.", "src": "audio/k3a_06_3a110ea9.mp3", "dur": 12.63}]}, {"type": "quiz", "title": "Quiz: Entstehung eines Hurrikans", "questions": [{"q": "Welche Wassertemperatur braucht ein tropischer Wirbelsturm mindestens?", "o": ["17 °C", "22 °C", "27 °C", "37 °C"], "a": 2, "e": "Mindestens 27 °C, und dazu eine riesige Wasserfläche. Solche Bedingungen gibt es nur in den Tropen."}, {"type": "order", "q": "Bring die Entstehung eines Hurrikans in die richtige Reihenfolge.", "items": ["Warmes Meerwasser verdunstet", "Feuchte Luft steigt auf und setzt Energie frei", "Unterdruck entsteht, Luft wird angesaugt", "Corioliskraft bringt die Luft zum Kreisen"], "e": "Verdunsten → Aufsteigen → Ansaugen → Drehen."}, {"q": "Was bringt den Wirbelsturm zum Drehen?", "o": ["Die Corioliskraft durch die Erddrehung", "Die Anziehungskraft des Mondes", "Starke Meereswellen", "Die Ozonschicht"], "a": 0, "e": "Die Rotationskraft der Erde, die Corioliskraft, versetzt die aufsteigende Luft in eine kreisende Bewegung."}, {"q": "Wie ist es im Auge eines Hurrikans?", "o": ["Fast windstill und wolkenfrei", "Dort weht der stärkste Wind", "Dort regnet es am meisten", "Dort ist es eiskalt und schneit"], "a": 0, "e": "Im Auge sinkt Luft ab. Es ist fast windstill und wolkenfrei. Die stärksten Winde toben rund um das Auge."}, {"q": "Warum wird ein Hurrikan über Land schwächer?", "o": ["Weil ihm die Energiequelle, das warme Wasser, fehlt", "Weil Bäume ihn bremsen", "Weil es über Land immer kälter als −70 °C ist", "Weil die Corioliskraft über Land nicht wirkt"], "a": 0, "e": "Über Land ist der Sturm vom warmen Meerwasser abgeschnitten. Ohne Nachschub an Energie wird er schwächer."}]}, {"type": "text", "title": "Viele Namen, eine Skala", "html": "<p class='lead'>Ob Hurrikan, Taifun oder Zyklon: Gemeint ist immer ein tropischer Wirbelsturm. Nur die Region ist anders.<\/p><table class='t'><tr><th>Name<\/th><th>Region<\/th><\/tr><tr><td>🌀 Hurrikan<\/td><td>Nordatlantik, Ostpazifik<\/td><\/tr><tr><td>🌀 Taifun<\/td><td>Westpazifik (z. B. Japan, Philippinen)<\/td><\/tr><tr><td>🌀 Zyklon<\/td><td>Indischer Ozean, Südpazifik<\/td><\/tr><tr><td>🌀 Willy-Willy<\/td><td>Australien<\/td><\/tr><\/table><p>Eselsbrücke: <b>T<\/b>aifun = <b>T<\/b>okio (Westpazifik). <b>Z<\/b>yklon = <b>Z<\/b>wischen Afrika und Indien.<\/p>"}, {"type": "video", "title": "Hurricane Hunters und Hurrikan Sandy", "scene": "k3b", "clips": [{"t": "Tropische Wirbelstürme haben je nach Region verschiedene Namen. Im Nordatlantik und im Ostpazifik heißen sie Hurrikan. Im Westpazifik, zum Beispiel bei Japan, heißen sie Taifun. Im Indischen Ozean und im Südpazifik heißen sie Zyklon. Und in Australien sagt man Willy-Willy.", "src": "audio/k3b_00_6e0a7b74.mp3", "dur": 18.95}, {"t": "Kann man sich vor einem Hurrikan schützen? Wichtig ist, früh zu wissen, wohin der Sturm zieht. Dafür gibt es mutige Frauen und Männer, die Hurrikanflieger, auf Englisch Hurricane Hunters. Sie fliegen mit speziellen Flugzeugen mitten durch den Sturm bis ins Auge.", "src": "audio/k3b_01_31c4af27.mp3", "dur": 15.42}, {"t": "Mit ihren Messungen können Fachleute die Zugbahn und die Zuggeschwindigkeit berechnen und die Stärke des Sturms bestimmen, also wie schnell sich der Wirbel dreht. So können die Menschen an der Küste rechtzeitig gewarnt werden.", "src": "audio/k3b_02_154d25d7.mp3", "dur": 11.84}, {"t": "Die Stärke eines Hurrikans wird mit der Saffir-Simpson-Skala angegeben. Sie hat fünf Kategorien. Kategorie 1 ist schwach, mit 119 bis 153 Kilometern pro Stunde. Kategorie 5 ist verwüstend, mit mehr als 251 Kilometern pro Stunde.", "src": "audio/k3b_03_1546e2cd.mp3", "dur": 17.32}, {"t": "Ein Beispiel: Hurrikan Sandy im Oktober 2012. Er entstand über dem Karibischen Meer und zog über Jamaika, Kuba und die Bahamas bis zum US-Bundesstaat New Jersey. Seine Spitzengeschwindigkeit lag bei 185 Kilometern pro Stunde. Damit war er ein Hurrikan der Kategorie 3, also stark.", "src": "audio/k3b_04_e47faf09.mp3", "dur": 20.06}, {"t": "Sandy zerstörte Strommasten, Straßen und Häuser. Der Schaden lag bei etwa 75 Milliarden US-Dollar. Noch schlimmer: 147 Menschen starben, und 21 wurden vermisst.", "src": "audio/k3b_05_68b900ad.mp3", "dur": 11.94}]}, {"type": "quiz", "title": "Quiz: Namen, Skala und Sandy", "questions": [{"q": "Wie heißt ein tropischer Wirbelsturm im Westpazifik, zum Beispiel bei Japan?", "o": ["Hurrikan", "Taifun", "Zyklon", "Willy-Willy"], "a": 1, "e": "Im Westpazifik heißen tropische Wirbelstürme Taifun."}, {"q": "Wo nennt man tropische Wirbelstürme Zyklon?", "o": ["Im Nordatlantik", "In Australien", "Im Indischen Ozean und im Südpazifik", "Im Westpazifik"], "a": 2, "e": "Zyklone gibt es im Indischen Ozean und im Südpazifik. Im Nordatlantik heißen sie Hurrikan."}, {"q": "Wie bekommt man Daten über Zugbahn und Stärke eines Hurrikans?", "o": ["Hurricane Hunters fliegen ins Auge und messen", "Man fragt die Menschen an der Küste", "Man zählt die umgestürzten Bäume", "Gar nicht, das ist unmöglich"], "a": 0, "e": "Hurrikanflieger fliegen bis ins Auge. Mit den Messergebnissen werden Zugbahn, Zuggeschwindigkeit und Stärke ermittelt."}, {"q": "Hurrikan Sandy hatte eine Spitzengeschwindigkeit von 185 km/h. Welche Kategorie ist das?", "o": ["Kategorie 1, schwach", "Kategorie 2, mäßig", "Kategorie 3, stark", "Kategorie 5, verwüstend"], "a": 2, "e": "Kategorie 3 reicht von 178 bis 208 km/h. Sandy war also ein starker Hurrikan."}, {"q": "Was bedeutet Kategorie 5 auf der Saffir-Simpson-Skala?", "o": ["Über 251 km/h, verwüstend", "119–153 km/h, schwach", "Nur leichter Regen", "Der Sturm ist schon über Land"], "a": 0, "e": "Kategorie 5 ist die stärkste Stufe: über 251 km/h, verwüstend."}]}, {"type": "fact", "title": "Kaum zu glauben!", "html": "<div class='box wow'>Pro Tag saugt ein Hurrikan etwa <b>fünf bis sieben Milliarden Tonnen Wasser<\/b> aus dem Meer. Innerhalb einer Woche nimmt ein großer Hurrikan so viel Wasser auf, wie in den <b>Bodensee<\/b> passt!<\/div><table class='t'><tr><th>Kategorie<\/th><th>Wind (km/h)<\/th><th>Bezeichnung<\/th><\/tr><tr><td>1<\/td><td>119–153<\/td><td>schwach<\/td><\/tr><tr><td>2<\/td><td>154–177<\/td><td>mäßig<\/td><\/tr><tr><td>3<\/td><td>178–208<\/td><td>stark<\/td><\/tr><tr><td>4<\/td><td>209–251<\/td><td>sehr stark<\/td><\/tr><tr><td>5<\/td><td>über 251<\/td><td>verwüstend<\/td><\/tr><\/table><div class='box tipp'><b>Aufgabe:<\/b> „Warum wurde Sandy erst in New Jersey schwächer?“<br><br><b>Antwort:<\/b> Auf seinem Weg über Jamaika, Kuba und die Bahamas zog Sandy immer wieder über warmes Meerwasser und bekam so neue Energie. Erst über dem Festland der USA war er von seiner Energiequelle, dem warmen Wasser, abgeschnitten und wurde schwächer.<\/div>"}]}, {"id": "k4", "title": "Gefährlicher Starkregen", "emoji": "🌊", "color": "#0d9488", "bg": "#ccfbf1", "badge": "🛶", "badgeName": "Hochwasser-Held", "recap": "<ul><li><b>Starkniederschläge<\/b> = starker Regen, der in kurzer Zeit fällt. Auch lang anhaltender Dauerregen führt zu Hochwasser.<\/li><li><b>Passau 2013:<\/b> Dauerregen im Mai, Rekordpegel der Donau 12,89 m am 3. Juni (normal unter 5 m). Kein Strom, kein Trinkwasser, Evakuierungen.<\/li><li><b>Ursachen:<\/b> Flussbegradigung (Fluss fließt schneller, Basel–Karlsruhe 23 statt 64 Stunden), Dämme engen den Fluss ein, versiegelte Böden (Häuser, Straßen), intensive Landwirtschaft und Monokulturen, Hochwasserwellen der Nebenflüsse treffen zusammen.<\/li><li><b>Natürlich:<\/b> Wiesen und Wälder halten Wasser zurück, <b>Auen<\/b> und Nebenarme nehmen Hochwasser auf.<\/li><li><b>Hochwasserschutz am Oberrhein:<\/b> Deicherhöhung und <b>Polder<\/b> (eingedeichte Flächen, die bei Hochwasser über ein Einlassbauwerk geflutet werden). Pegel sinkt um bis zu 40 cm.<\/li><\/ul>", "blocks": [{"type": "text", "title": "Wenn Flüsse über die Ufer treten", "html": "<p class='lead'>Der Wasserstand von 12,20 m in Passau lässt nichts Gutes ahnen. Die Donau ist über die Ufer getreten. Eine einmalige Gelegenheit, in der Fußgängerzone Boot zu fahren?<\/p><div class='vocab'><div><b>Starkniederschläge<\/b>starker Regen, der in kurzer Zeit zu Boden fällt<\/div><div><b>Pegel<\/b>Messlatte für den Wasserstand eines Flusses<\/div><div><b>Flussregulierung<\/b>Eingriff des Menschen: Fluss wird begradigt und eingedeicht<\/div><div><b>Auen<\/b>Uferlandschaften, die bei Hochwasser überschwemmt werden<\/div><div><b>versiegelte Böden<\/b>Flächen mit Häusern, Straßen und Parkplätzen, Wasser kann nicht versickern<\/div><\/div><p>Passau liegt dort, wo die Flüsse <b>Donau, Inn und Ilz<\/b> zusammenfließen. Deshalb gibt es dort besonders oft Hochwasser.<\/p>"}, {"type": "video", "title": "Passau unter Wasser: Ursachen von Hochwasser", "scene": "k4a", "clips": [{"t": "Jetzt bleiben wir in Deutschland. Im Mai 2013 regnet es tagelang fast ohne Pause. Die großen Flüsse Elbe, Rhein und Donau schwellen an. Besonders schlimm trifft es die Stadt Passau in Bayern.", "src": "audio/k4a_00_91ffba60.mp3", "dur": 12.59}, {"t": "Normalerweise steigt das Hochwasser in Passau nicht über die 5-Meter-Marke. Anfang Juni erreicht die Donau aber 12 Meter 20. Am 3. Juni sogar den Rekordpegel von 12 Meter 89. Die Menschen fahren mit Booten durch die Fußgängerzone.", "src": "audio/k4a_01_263c1ce1.mp3", "dur": 15.93}, {"t": "In der Altstadt gibt es tagelang keinen Strom und kein Trinkwasser. Viele Menschen werden evakuiert oder mit Booten versorgt. Nach der Flut stehen Tausende vor dem Nichts, und das große Aufräumen beginnt.", "src": "audio/k4a_02_9b755909.mp3", "dur": 11.24}, {"t": "Aber warum kommt es immer öfter zu solchen Überschwemmungen? Schauen wir uns zuerst eine natürliche Flusslandschaft an. Der Fluss schlängelt sich in Kurven durch die Landschaft. Wiesen und Wälder halten das Regenwasser zurück wie ein Schwamm.", "src": "audio/k4a_03_26f8e14c.mp3", "dur": 13.75}, {"t": "Bei Hochwasser darf sich der Fluss ausbreiten. Die Auen, also die Uferlandschaften, und die Nebenarme nehmen das Wasser auf. In den Auen leben besondere Pflanzen und Tiere, zum Beispiel der Biber.", "src": "audio/k4a_04_65adada0.mp3", "dur": 11.33}, {"t": "Und so sieht es heute oft aus: Der Fluss wurde begradigt und mit Dämmen eingeengt. Das nennt man Flussregulierung, ein Eingriff des Menschen. Weil der Weg kürzer ist, fließt das Wasser viel schneller. Eine Hochwasserwelle braucht von Basel bis Karlsruhe heute nur noch 23 Stunden. Früher waren es 64 Stunden.", "src": "audio/k4a_05_3dcba9d0.mp3", "dur": 19.13}, {"t": "Dazu kommen versiegelte Böden: Häuser, Straßen und Parkplätze. Dort kann das Regenwasser nicht versickern und fließt direkt in den Fluss. Auch intensive Landwirtschaft mit Monokulturen hält wenig Wasser zurück. Treffen dann die schnellen Hochwasserwellen der Nebenflüsse zusammen, wird es gefährlich.", "src": "audio/k4a_06_8b311cfe.mp3", "dur": 17.93}, {"t": "Merke: Bei Starkniederschlägen, also starkem Regen in kurzer Zeit, oder bei langem Dauerregen kommt es deshalb immer wieder zu Überschwemmungen. Ein Beispiel: Zwischen Basel und Bingen hatte der Rhein früher 1.400 Quadratkilometer Überschwemmungsfläche. Heute sind es nur noch 440.", "src": "audio/k4a_07_f708781f.mp3", "dur": 18.67}]}, {"type": "quiz", "title": "Quiz: Passau und die Ursachen", "questions": [{"q": "Welchen Rekordpegel erreichte die Donau in Passau am 3. Juni 2013?", "o": ["5,00 m", "8,50 m", "12,89 m", "20,10 m"], "a": 2, "e": "12,89 m! Normalerweise steigt das Hochwasser in Passau nicht über die 5-Meter-Marke."}, {"q": "Was versteht man unter Starkniederschlägen?", "o": ["Starker Regen, der in kurzer Zeit fällt", "Leichter Nieselregen über Wochen", "Schnee in den Alpen", "Hagel im Sommer"], "a": 0, "e": "Starkniederschläge sind große Regenmengen in kurzer Zeit."}, {"q": "Warum fließt ein begradigter Fluss schneller?", "o": ["Weil sein Weg kürzer ist", "Weil er mehr Wasser enthält", "Weil das Wasser wärmer ist", "Weil Schiffe ihn antreiben"], "a": 0, "e": "Ohne Kurven ist der Weg kürzer. Die Hochwasserwelle von Basel bis Karlsruhe braucht nur noch 23 statt 64 Stunden."}, {"q": "Warum verstärken versiegelte Böden das Hochwasser?", "o": ["Das Regenwasser kann nicht versickern und fließt direkt in den Fluss", "Sie ziehen Regenwolken an", "Sie machen das Wasser wärmer", "Sie verstopfen die Nebenarme"], "a": 0, "e": "Auf Straßen, Dächern und Parkplätzen versickert kein Wasser. Es fließt schnell in die Flüsse."}, {"q": "Was sind Auen?", "o": ["Uferlandschaften, die bei Hochwasser überschwemmt werden", "Betonmauern am Fluss", "Große Staudämme", "Wüsten am Meer"], "a": 0, "e": "Auen sind Feuchtgebiete am Fluss. Sie nehmen Hochwasser auf. Hier leben besondere Tiere wie der Biber."}, {"q": "Was ist <u>keine<\/u> Ursache für schlimmere Hochwasser?", "o": ["Natürliche Auen und Wälder am Fluss", "Begradigte Flüsse", "Versiegelte Böden", "Monokulturen in der Landwirtschaft"], "a": 0, "e": "Auen und Wälder halten Wasser zurück. Sie schützen also vor Hochwasser, statt es zu verstärken."}]}, {"type": "text", "title": "Platz für das Wasser", "html": "<p class='lead'>Um die Überschwemmungsgefahr am Oberrhein zu verringern, haben <b>Deutschland und Frankreich<\/b> gemeinsam Schutzmaßnahmen beschlossen.<\/p><div class='vocab'><div><b>Deich<\/b>Schutzwall aus Erde entlang eines Flusses<\/div><div><b>Polder<\/b>eingedeichte Fläche, die bei Hochwasser absichtlich geflutet wird<\/div><div><b>Schleuse<\/b>Tor, das Wasser hereinlässt oder zurückhält<\/div><div><b>Einlass / Auslass<\/b>Bauwerke, durch die Wasser in den Polder hinein- bzw. wieder herausfließt<\/div><\/div><p>Stell dir einen Polder wie eine <b>riesige Badewanne neben dem Fluss<\/b> vor, die man bei Gefahr volllaufen lässt. 🛁<\/p>"}, {"type": "video", "title": "Hochwasserschutz: So funktioniert ein Polder", "scene": "k4b", "clips": [{"t": "Was kann man gegen Hochwasser tun? Am Oberrhein haben Deutschland und Frankreich gemeinsam Schutzmaßnahmen beschlossen. Die erste Maßnahme: Die Deiche werden erhöht, damit das Wasser nicht so leicht über die Ufer tritt.", "src": "audio/k4b_00_dfc338d0.mp3", "dur": 11.75}, {"t": "Die zweite und wichtigste Maßnahme sind neue Überschwemmungsflächen. Diese Flächen werden mit Deichen eingefasst und heißen Polder. Normalerweise sind sie ganz normale Wiesen oder Äcker.", "src": "audio/k4b_01_b5cb7b73.mp3", "dur": 10.08}, {"t": "Kommt ein gefährliches Hochwasser, wird im Einlassbauwerk eine Schleuse geöffnet. Das Wasser strömt aus dem Fluss in den Polder und füllt ihn wie ein riesiges Becken.", "src": "audio/k4b_02_90791baf.mp3", "dur": 9.01}, {"t": "Dadurch sinkt der Wasserstand im Fluss. Am Oberrhein kann der Hochwasserpegel so um bis zu 40 Zentimeter gesenkt werden. Das klingt wenig, kann aber eine ganze Stadt vor der Überflutung retten.", "src": "audio/k4b_03_93ebe7bf.mp3", "dur": 11.33}, {"t": "Ist die Gefahr vorüber, wird die Schleuse im Auslassbauwerk geöffnet, und das Wasser fließt zurück in den Fluss. Merke dir den Ablauf: Einlass auf, Polder füllt sich, Pegel sinkt, später Auslass auf.", "src": "audio/k4b_04_0dd102c3.mp3", "dur": 13.56}]}, {"type": "quiz", "title": "Quiz: Hochwasserschutz", "questions": [{"q": "Welche beiden Maßnahmen sollen am Oberrhein vor Hochwasser schützen?", "o": ["Deicherhöhung und Polder", "Flüsse begradigen und Bäume fällen", "Neue Straßen und Parkplätze", "Staudämme in den Alpen und Kanäle"], "a": 0, "e": "Deiche werden erhöht, und neue Überschwemmungsflächen (Polder) werden angelegt."}, {"q": "Was ist ein Polder?", "o": ["Eine eingedeichte Fläche, die bei Hochwasser geflutet wird", "Ein besonders hoher Deich", "Ein Messgerät für den Wasserstand", "Ein Boot für Hochwasser"], "a": 0, "e": "Polder sind eingedeichte Wiesen oder Äcker, die bei Gefahr absichtlich geflutet werden."}, {"type": "order", "q": "Bring den Ablauf beim Polder in die richtige Reihenfolge.", "items": ["Gefährliches Hochwasser kommt", "Schleuse im Einlassbauwerk wird geöffnet", "Polder füllt sich, Pegel im Fluss sinkt", "Gefahr vorbei: Auslass öffnen, Wasser fließt zurück"], "e": "Einlass auf → Polder füllt sich → Pegel sinkt → Auslass auf."}, {"q": "Um wie viel kann der Hochwasserpegel am Oberrhein durch Polder gesenkt werden?", "o": ["Bis zu 4 cm", "Bis zu 40 cm", "Bis zu 4 m", "Bis zu 12,89 m"], "a": 1, "e": "Bis zu 40 cm. Das kann entscheiden, ob ein Deich hält oder eine Stadt überflutet wird."}]}, {"type": "fact", "title": "Klassenarbeits-Check: Hochwasser", "html": "<div class='box tipp'><b>Aufgabe:<\/b> „Nenne Ursachen für Hochwasserkatastrophen.“<br><br><b>Antwort (Stichpunkte reichen bei „Nenne“):<\/b><ul><li>Starkniederschläge oder lang anhaltender Regen, Schneeschmelze<\/li><li>Begradigte Flüsse, Uferbefestigungen und Dämme<\/li><li>Versiegelte Böden (Häuser, Straßen)<\/li><li>Intensive Landwirtschaft und Monokulturen<\/li><li>Fehlende Auen und Überschwemmungsflächen<\/li><\/ul><\/div><div class='box tipp'><b>Aufgabe:<\/b> „Erläutere die Funktion eines Polders.“<br><br><b>Antwort:<\/b> Ein Polder ist eine eingedeichte Fläche neben dem Fluss. Bei gefährlichem Hochwasser wird die Schleuse im Einlassbauwerk geöffnet, und das Wasser fließt in den Polder. Dadurch sinkt der Pegel im Fluss (am Oberrhein um bis zu 40 cm). Ist die Gefahr vorbei, fließt das Wasser durch das Auslassbauwerk zurück in den Fluss.<\/div><div class='box wow'>Zwischen Basel und Bingen hatte der Rhein einst <b>1.400 km²<\/b> Überschwemmungsfläche. Heute sind es gerade mal <b>440 km²<\/b>, also weniger als ein Drittel!<\/div>"}]}, {"id": "k5", "title": "Tornado: keiner dreht sich schneller", "emoji": "🌪️", "color": "#db2777", "bg": "#fce7f3", "badge": "🌪️", "badgeName": "Tornado-Profi", "recap": "<ul><li><b>Entstehung:<\/b> Kalte, trockene Luft (Norden) trifft auf warme, feuchte Luft (Süden), z. B. im Frühjahr im Mittleren Westen der USA. Feuchtwarme Luft steigt auf, Gewitterwolken entstehen. Kalte Höhenwinde aus der Gegenrichtung bringen die Luft zum Drehen → <b>Rüssel<\/b> wächst bis zum Boden.<\/li><li>Wind im Rüssel bis <b>500 km/h<\/b>, Zuggeschwindigkeit 30–50 km/h, sehr <b>kleinräumig<\/b>, Lebensdauer nur <b>wenige Minuten<\/b>. Stärke: <b>Fujita-Skala<\/b> (F0–F6).<\/li><li><b>Moore 2013:<\/b> F4, 800 m breit, 330 km/h, 24 Tote, 2.400 zerstörte Häuser.<\/li><li><b>Deutschland:<\/b> 20–60 Tornados pro Jahr, meist im Juli. Kleine Luftwirbel = <b>Windhose<\/b>. USA: bis zu 1.200 pro Jahr.<\/li><li><b>Verhalten:<\/b> in den Keller, weg von Fenstern, <b>nicht ins Auto<\/b>, draußen mind. 1 km Abstand, bei schwachen Tornados flach hinlegen.<\/li><\/ul>", "blocks": [{"type": "text", "title": "Der größte Staubsauger der Welt", "html": "<p class='lead'>Er entsteht wie aus dem Nichts. Am Anfang wächst aus einer Wolke ein weißer Saugrüssel. Er scheint den Boden zu suchen. Sobald er ihn erreicht, entfesselt er seine ungeheure Kraft.<\/p><div class='vocab'><div><b>Tornado<\/b>kleiner, extrem schnell drehender Luftwirbel über Land<\/div><div><b>Rüssel<\/b>der rotierende Wolkenschlauch des Tornados<\/div><div><b>Gewitterwolke<\/b>riesige Haufenwolke, aus der Blitz und Starkregen kommen<\/div><div><b>Windhose<\/b>kleiner Luftwirbel, schwächer als ein Tornado<\/div><\/div><div class='box merke'>Hurrikan und Tornado sind <b>nicht<\/b> dasselbe! Den Unterschied lernst du am Ende dieses Kapitels.<\/div>"}, {"type": "video", "title": "Wie ein Tornado entsteht", "scene": "k5a", "clips": [{"t": "Kommen wir zum schnellsten Wirbel der Welt: dem Tornado. Er entsteht wie aus dem Nichts. Aus einer dunklen Wolke wächst ein Rüssel nach unten, und wenn er den Boden erreicht, entfesselt er eine ungeheure Kraft.", "src": "audio/k5a_00_81c9f94d.mp3", "dur": 12.17}, {"t": "Die meisten Tornados gibt es im Mittleren Westen der USA. Im Frühjahr trifft dort kalte, trockene Luft aus dem Norden auf warme, feuchte Luft aus dem Süden. Dann beginnt die Tornadosaison. Voraussetzung sind also große Temperatur- und Feuchtigkeitsunterschiede zwischen zwei Luftschichten.", "src": "audio/k5a_01_d584fa0a.mp3", "dur": 17.88}, {"t": "Die Sonne heizt den Boden auf, und die feuchtwarme Luft steigt nach oben. Dabei kühlt sie ab, und der Wasserdampf kondensiert zu Wassertröpfchen. Es bilden sich Haufenwolken, die zu riesigen Gewitterwolken anwachsen.", "src": "audio/k5a_02_292b156a.mp3", "dur": 11.94}, {"t": "Treffen nun in der Höhe kalte Luftmassen aus der entgegengesetzten Richtung auf die Gewitterwolke, beginnt sich die Luft in der Wolke walzenförmig zu drehen. Die Drehung wird immer enger und immer schneller.", "src": "audio/k5a_03_bf76e041.mp3", "dur": 11.05}, {"t": "So entsteht ein rotierender Wolkenschlauch, der Rüssel des Tornados. Er wächst nach unten, bis er den Boden berührt. Im Rüssel rast die Luft mit bis zu 500 Kilometern pro Stunde. Das ist schneller als bei jedem Hurrikan.", "src": "audio/k5a_04_c7ec5e1f.mp3", "dur": 12.91}, {"t": "Zum Glück ist ein Tornado sehr klein und lebt meist nur wenige Minuten. Er zieht mit 30 bis 50 Kilometern pro Stunde über das Land und hinterlässt eine Schneise der Zerstörung.", "src": "audio/k5a_05_f161d4bb.mp3", "dur": 10.08}, {"t": "Ein Beispiel: Am 22. Mai 2013 traf ein Super-Tornado der Stärke F4 die Stadt Moore bei Oklahoma City. Er war 800 Meter breit, und sein Wirbel drehte sich mit bis zu 330 Kilometern pro Stunde. Häuser flogen von ihren Fundamenten. 24 Menschen starben, 2.400 Häuser wurden zerstört. Die Stärke von Tornados misst man übrigens mit der Fujita-Skala, von F0 bis F6.", "src": "audio/k5a_06_60644da7.mp3", "dur": 28.42}]}, {"type": "quiz", "title": "Quiz: Entstehung eines Tornados", "questions": [{"q": "Wo gibt es die meisten Tornados der Welt?", "o": ["Im Mittleren Westen der USA", "In der Sahara", "Am Nordpol", "Über dem Indischen Ozean"], "a": 0, "e": "Im Frühjahr treffen im Mittleren Westen der USA kalte und warme Luftmassen aufeinander. Dann beginnt die Tornadosaison."}, {"q": "Was ist die wichtigste Voraussetzung für einen Tornado?", "o": ["Große Temperatur- und Feuchtigkeitsunterschiede zweier Luftschichten", "Meerwasser mit mindestens 27 °C", "Eine dicke Schneedecke", "Ein Hochdruckgebiet mit Sonnenschein"], "a": 0, "e": "Kalte, trockene Luft trifft auf warme, feuchte Luft. 27 °C warmes Meerwasser braucht dagegen der Hurrikan."}, {"type": "order", "q": "Bring die Entstehung eines Tornados in die richtige Reihenfolge.", "items": ["Kalte und warme Luft treffen aufeinander", "Feuchtwarme Luft steigt auf, eine Gewitterwolke wächst", "Kalte Höhenwinde bringen die Luft in der Wolke zum Drehen", "Der Rüssel wächst bis zum Boden"], "e": "Aufeinandertreffen → Aufsteigen → Drehen → Rüssel."}, {"q": "Wie schnell kann sich die Luft im Rüssel eines Tornados drehen?", "o": ["Bis zu 50 km/h", "Bis zu 150 km/h", "Bis zu 350 km/h", "Bis zu 500 km/h"], "a": 3, "e": "Bis zu 500 km/h, schneller als bei jedem Hurrikan (bis 350 km/h)."}, {"q": "Welche Stärke hatte der Tornado von Moore (2013)?", "o": ["F0", "F2", "F4", "Kategorie 5"], "a": 2, "e": "Es war ein Super-Tornado der Stärke F4 auf der Fujita-Skala. Kategorien 1–5 gehören zur Saffir-Simpson-Skala für Hurrikans."}]}, {"type": "text", "title": "Tornados bei uns?", "html": "<p class='lead'>Tornados gibt es nicht nur in den USA. Auch in Deutschland werden jedes Jahr Tornados gesichtet. Wichtig ist, dass du weißt, <b>wie du dich verhältst<\/b>.<\/p><div class='vocab'><div><b>Schneise<\/b>Streifen der Zerstörung, den der Tornado hinterlässt<\/div><div><b>Vorhersage<\/b>Wettervorhersage im Voraus, bei Tornados schwierig<\/div><div><b>Fujita-Skala<\/b>Skala für die Stärke von Tornados (F0 bis F6)<\/div><\/div><p>Überleg vorher: Wo würdest du dich zu Hause bei einem Tornado verstecken? 🤔<\/p>"}, {"type": "video", "title": "Tornados in Deutschland und richtiges Verhalten", "scene": "k5b", "clips": [{"t": "Gibt es Tornados auch bei uns? Ja! In Deutschland werden jedes Jahr etwa 20 bis 60 Tornados gesichtet, am häufigsten im Juli. Kleine Luftwirbel nennt man Windhose. In den USA sind es dagegen bis zu 1.200 Tornados im Jahr, mit Schäden in Milliardenhöhe.", "src": "audio/k5b_00_e12b41fc.mp3", "dur": 17.18}, {"t": "Tornados vorherzusagen ist schwierig. Grob geht das bis zu 18 Stunden im Voraus. Wo genau ein Tornado entlangzieht, weiß man aber erst 10 bis 60 Minuten vorher. Das ist oft zu wenig Zeit, um eine ganze Region zu schützen.", "src": "audio/k5b_01_43bdf65f.mp3", "dur": 14.3}, {"t": "Was tust du, wenn ein Tornado kommt? Am gefährlichsten sind umherfliegende Gegenstände. Geh am besten in den Keller und warte, bis der Sturm vorbei ist. Halte dich von Fenstern fern, denn Glassplitter können dich verletzen.", "src": "audio/k5b_02_907cd0b3.mp3", "dur": 12.63}, {"t": "Ganz wichtig: Such keinen Schutz im Auto! Das kann tödlich sein, denn Autos werden durch die Luft geschleudert. Wirst du draußen überrascht, halte mindestens einen Kilometer Abstand. Bei schwächeren Tornados hilft es, sich flach auf den Boden zu legen.", "src": "audio/k5b_03_1850f2b0.mp3", "dur": 15.23}, {"t": "Zum Schluss ein Vergleich, der gern in Klassenarbeiten drankommt. Der Hurrikan entsteht über warmem Meer in den Tropen. Er ist mehrere hundert Kilometer groß, dreht sich mit bis zu 350 Kilometern pro Stunde und lebt fünf bis zehn Tage.", "src": "audio/k5b_04_9354ef0a.mp3", "dur": 13.98}, {"t": "Der Tornado entsteht über Land, wenn kalte und warme Luft aufeinandertreffen. Er ist nur einige hundert Meter breit, dreht sich mit bis zu 500 Kilometern pro Stunde, lebt aber nur wenige Minuten. Kurz gesagt: Der Hurrikan ist riesig und langlebig, der Tornado klein, schnell und kurzlebig.", "src": "audio/k5b_05_c4b778bf.mp3", "dur": 17.37}]}, {"type": "quiz", "title": "Quiz: Deutschland, Verhalten und Vergleich", "questions": [{"q": "Wie viele Tornados werden in Deutschland ungefähr pro Jahr gesichtet?", "o": ["Keine", "2 bis 6", "20 bis 60", "Bis zu 1.200"], "a": 2, "e": "Etwa 20 bis 60 pro Jahr, am häufigsten im Juli. Bis zu 1.200 pro Jahr gibt es in den USA."}, {"q": "Wie nennt man kleine, schwächere Luftwirbel?", "o": ["Windhose", "Taifun", "Jetstream", "Passat"], "a": 0, "e": "Nicht jeder Luftwirbel ist gleich ein Tornado. Kleine Luftwirbel heißen Windhose."}, {"q": "Ein Tornado kommt auf dein Haus zu. Wo bist du am sichersten?", "o": ["Im Keller", "Am Fenster, um ihn zu beobachten", "Im Auto", "Auf dem Dach"], "a": 0, "e": "Im Keller bist du vor umherfliegenden Gegenständen und Glassplittern am besten geschützt."}, {"q": "Warum solltest du bei einem Tornado nicht im Auto Schutz suchen?", "o": ["Autos können durch die Luft geschleudert werden", "Weil das Radio dann nicht funktioniert", "Weil Autos bei Regen rutschen", "Das ist eigentlich der sicherste Ort"], "a": 0, "e": "Tornados schleudern Fahrzeuge durch die Luft. Im Auto Zuflucht zu suchen, kann den Tod bedeuten."}, {"q": "Welche Aussage zum Vergleich Hurrikan und Tornado stimmt?", "o": ["Der Tornado ist kleiner, dreht sich schneller und lebt kürzer", "Der Tornado ist größer und lebt länger", "Beide entstehen nur über warmem Meer", "Der Hurrikan dreht sich schneller als der Tornado"], "a": 0, "e": "Tornado: einige 100 m, bis 500 km/h, Minuten. Hurrikan: mehrere 100 km, bis 350 km/h, 5–10 Tage."}]}, {"type": "fact", "title": "Klassenarbeits-Check: Tornado oder Hurrikan?", "html": "<table class='t'><tr><th><\/th><th>🌀 Hurrikan<\/th><th>🌪️ Tornado<\/th><\/tr><tr><td><b>Entstehungsgebiet<\/b><\/td><td>über warmem Meer (mind. 27 °C) in den Tropen<\/td><td>über Land, wo kalte und warme Luft aufeinandertreffen (z. B. Mittlerer Westen der USA)<\/td><\/tr><tr><td><b>Größe<\/b><\/td><td>mehrere hundert Kilometer<\/td><td>einige hundert Meter (Moore: 800 m)<\/td><\/tr><tr><td><b>Geschwindigkeit im Wirbel<\/b><\/td><td>bis 350 km/h<\/td><td>bis 500 km/h<\/td><\/tr><tr><td><b>Lebensdauer<\/b><\/td><td>5 bis 10 Tage<\/td><td>wenige Minuten<\/td><\/tr><tr><td><b>Stärke-Skala<\/b><\/td><td>Saffir-Simpson (Kategorie 1–5)<\/td><td>Fujita (F0–F6)<\/td><\/tr><\/table><div class='box tipp'>Diese Tabelle ist eine typische Aufgabe: „Vergleiche Tornado und Hurrikan. Fertige dafür eine Tabelle an.“ Präg sie dir gut ein!<\/div>"}]}, {"id": "k6", "title": "„Klima-Maschine“ Ozean", "emoji": "🐋", "color": "#1d4ed8", "bg": "#dbeafe", "badge": "🐋", "badgeName": "Ozean-Kenner", "recap": "<ul><li>Ozeane bedecken <b>71 %<\/b> der Erdoberfläche (Pazifik 36 %, Atlantik 20 %, Indischer Ozean 15 %), Festland 29 %.<\/li><li>Wasser erwärmt sich langsamer und kühlt langsamer ab als Land → an der Küste kühlere Sommer und mildere Winter: <b>ausgeglichenes Klima<\/b>.<\/li><li><b>Warme Meeresströmungen<\/b> (rot) erwärmen die Luft bis weit ins Land, <b>kalte<\/b> (blau) sorgen für kühleres Klima.<\/li><li><b>Golfstrom<\/b>: warmes Wasser aus Karibik und Golf von Mexiko bis Norwegen = „Warmwasserheizung Europas“ (milde Winter, Palmen in Cornwall). Gleiche Breite in Kanada: kalter <b>Labradorstrom<\/b> mit Eisbergen.<\/li><li><b>Benguelastrom<\/b> (kalt) vor Südwestafrika: kühle Luft → kaum Verdunstung → keine Wolken → kein Regen → <b>Küstenwüste Namib<\/b>.<\/li><\/ul>", "blocks": [{"type": "text", "title": "Der blaue Planet", "html": "<p class='lead'>Die Ozeane nehmen den größten Teil der Erdoberfläche ein. Diese riesigen Wasserflächen sind auch von größter Bedeutung für das <b>Klima<\/b> auf unserer Erde.<\/p><div class='vocab'><div><b>Klima<\/b>das typische Wetter eines Ortes über viele Jahre<\/div><div><b>Meeresströmung<\/b>riesiger „Fluss“ im Meer, warm oder kalt<\/div><div><b>Küstenwüste<\/b>Wüste direkt am Meer, entsteht durch kalte Meeresströmungen<\/div><div><b>Verdunstung<\/b>Wasser wird zu Wasserdampf und steigt in die Luft<\/div><\/div><p>Kleiner Gedanke vorab: Warum ist es im Winter an der Nordsee oft milder als in Bayern? 🤔 Gleich weißt du es.<\/p>"}, {"type": "video", "title": "Das Meer als Wärmespeicher", "scene": "k6a", "clips": [{"t": "Im letzten Kapitel geht es um die Klima-Maschine Ozean. Schau dir die Erde einmal von außen an: Sie ist fast überall blau. Die Ozeane bedecken 71 Prozent der Erdoberfläche, das Festland nur 29 Prozent.", "src": "audio/k6a_00_5e576df2.mp3", "dur": 13.42}, {"t": "Der größte Ozean ist der Pazifische Ozean mit 36 Prozent der Erdoberfläche. Dann folgen der Atlantische Ozean mit 20 und der Indische Ozean mit 15 Prozent.", "src": "audio/k6a_01_55bc9136.mp3", "dur": 10.08}, {"t": "Wasser hat eine besondere Eigenschaft: Es erwärmt sich langsamer als Land, kühlt aber auch langsamer wieder ab. Das Meer funktioniert also wie ein riesiger Wärmespeicher.", "src": "audio/k6a_02_4e41c63d.mp3", "dur": 9.98}, {"t": "Deshalb sind an der Küste die Sommer kühler und die Winter milder als weit im Landesinneren. Das Klima an der Küste ist ausgeglichener. Im Landesinneren dagegen sind die Sommer heißer und die Winter kälter.", "src": "audio/k6a_03_64f0515d.mp3", "dur": 11.52}, {"t": "Noch stärker wirken die Meeresströmungen. Das sind riesige Flüsse im Meer. Auf Karten sind warme Meeresströmungen rot und kalte blau eingezeichnet. Warme Strömungen erwärmen die Luft an der Küste, und das spürt man bis weit ins Landesinnere. Kalte Strömungen sorgen für ein deutlich kühleres Klima.", "src": "audio/k6a_04_c3a6a064.mp3", "dur": 19.27}]}, {"type": "quiz", "title": "Quiz: Ozeane und Küstenklima", "questions": [{"q": "Wie viel Prozent der Erdoberfläche bedecken die Ozeane?", "o": ["29 %", "50 %", "71 %", "90 %"], "a": 2, "e": "71 % sind Ozean, nur 29 % Festland."}, {"q": "Welcher ist der größte Ozean?", "o": ["Atlantischer Ozean", "Pazifischer Ozean", "Indischer Ozean", "Nordsee"], "a": 1, "e": "Der Pazifik bedeckt allein 36 % der Erdoberfläche, mehr als das gesamte Festland (29 %)."}, {"q": "Warum ist das Klima an der Küste ausgeglichener als im Landesinneren?", "o": ["Wasser erwärmt sich langsamer und kühlt langsamer ab als Land", "An der Küste scheint die Sonne nie", "Weil an der Küste mehr Menschen wohnen", "Weil es an der Küste keine Jahreszeiten gibt"], "a": 0, "e": "Das Meer speichert Wärme. Es macht die Sommer an der Küste kühler und die Winter milder."}, {"q": "Wie werden warme und kalte Meeresströmungen auf Karten meist dargestellt?", "o": ["Warm = rot, kalt = blau", "Warm = blau, kalt = rot", "Warm = grün, kalt = gelb", "Beide schwarz"], "a": 0, "e": "Rote Pfeile zeigen warme, blaue Pfeile kalte Meeresströmungen."}]}, {"type": "text", "title": "Heizung und Kühlschrank im Meer", "html": "<p class='lead'>Zwei Meeresströmungen solltest du für die Klassenarbeit unbedingt kennen:<\/p><table class='t'><tr><th><\/th><th>🔴 Golfstrom<\/th><th>🔵 Benguelastrom<\/th><\/tr><tr><td>Art<\/td><td>warm<\/td><td>kalt<\/td><\/tr><tr><td>Weg<\/td><td>Karibik / Golf von Mexiko → über den Atlantik → Norwegen<\/td><td>Antarktis → an der Südwestküste Afrikas entlang nach Norden<\/td><\/tr><tr><td>Folge<\/td><td>milde Winter in West- und Nordeuropa<\/td><td>Küstenwüste Namib<\/td><\/tr><\/table>"}, {"type": "video", "title": "Golfstrom und Namib", "scene": "k6b", "clips": [{"t": "Das berühmteste Beispiel für eine warme Meeresströmung ist der Golfstrom. Er bringt warmes Wasser aus der Karibik und dem Golf von Mexiko quer über den Atlantik bis hoch in den Norden Norwegens.", "src": "audio/k6b_00_1566070e.mp3", "dur": 11.1}, {"t": "Der Golfstrom ist wie eine Warmwasserheizung für West- und Nordeuropa. Ihm verdanken wir unsere milden Winter. Im Südwesten Englands, in Cornwall, wachsen sogar Palmen!", "src": "audio/k6b_01_ef2c290b.mp3", "dur": 9.89}, {"t": "Auf der gleichen geografischen Breite, auf der anderen Seite des Atlantiks, sieht es ganz anders aus. Vor der Küste Kanadas fließt der kalte Labradorstrom. Dort treiben große Eisberge nach Süden. Gleiche Breite, ganz anderes Klima, und das nur wegen der Meeresströmungen.", "src": "audio/k6b_02_8e372af9.mp3", "dur": 17.18}, {"t": "Jetzt das Beispiel für eine kalte Meeresströmung. Aus den Gewässern der Antarktis fließt der kalte Benguelastrom an der Südwestküste Afrikas entlang nach Norden.", "src": "audio/k6b_03_5a0edd68.mp3", "dur": 8.78}, {"t": "Das kalte Wasser kühlt die Luft darüber ab. Dadurch verdunstet kaum Wasser. Ohne Wasserdampf bilden sich keine Wolken, und ohne Wolken gibt es keinen Regen.", "src": "audio/k6b_04_792bd306.mp3", "dur": 9.15}, {"t": "Die Folge ist ein extrem trockenes Klima. Direkt am Meer breitet sich die Küstenwüste Namib aus, mit riesigen Sanddünen bis an den Strand. Deshalb sagt man: Die Namib ist ein Kind des Ozeans. Merke dir die Kette: kalte Strömung, kühle Luft, kaum Verdunstung, keine Wolken, kein Regen, Wüste.", "src": "audio/k6b_05_137d476f.mp3", "dur": 21.08}, {"t": "Geschafft! Du hast alle sechs Kapitel durchgearbeitet. Jetzt wartet noch der große Abschlusstest auf dich. Zeig, was du gelernt hast, und hol dir deine Urkunde. Viel Erfolg!", "src": "audio/k6b_06_fe52e4e3.mp3", "dur": 10.36}]}, {"type": "quiz", "title": "Quiz: Golfstrom und Namib", "questions": [{"q": "Warum können in Cornwall (Südwestengland) Palmen wachsen?", "o": ["Wegen des warmen Golfstroms", "Weil dort der Äquator verläuft", "Wegen des kalten Labradorstroms", "Weil es dort nie regnet"], "a": 0, "e": "Der Golfstrom bringt warmes Wasser aus der Karibik nach Europa und sorgt für milde Winter."}, {"q": "Woher kommt das warme Wasser des Golfstroms?", "o": ["Aus der Karibik und dem Golf von Mexiko", "Aus der Antarktis", "Aus der Nordsee", "Aus dem Indischen Ozean"], "a": 0, "e": "Der Golfstrom transportiert warmes tropisches Wasser aus Karibik und Golf von Mexiko bis nach Norwegen."}, {"q": "Welche kalte Meeresströmung fließt vor der Küste Kanadas?", "o": ["Golfstrom", "Benguelastrom", "Labradorstrom", "Passatstrom"], "a": 2, "e": "Im kalten Labradorstrom treiben große Eisberge nach Süden, auf gleicher Breite wie Cornwall."}, {"type": "order", "q": "Wie entsteht die Küstenwüste Namib? Bring die Kette in die richtige Reihenfolge.", "items": ["Kalter Benguelastrom", "Luft über dem Meer kühlt ab", "Kaum Verdunstung", "Keine Wolken, kein Regen", "Küstenwüste Namib"], "e": "Die Namib ist ein Kind des Ozeans!"}, {"q": "Was bedeutet die Aussage „Die Namib ist ein Kind des Ozeans“?", "o": ["Die Wüste entsteht durch die kalte Meeresströmung vor der Küste", "Die Namib lag früher unter Wasser", "In der Namib gibt es viele Seen", "Die Namib wird jedes Jahr überflutet"], "a": 0, "e": "Der kalte Benguelastrom verhindert Wolken und Regen. Ohne den Ozean gäbe es diese Küstenwüste nicht."}]}, {"type": "fact", "title": "Klassenarbeits-Check: Ozean", "html": "<div class='box tipp'><b>Aufgabe:<\/b> „Der Golfstrom ist die Warmwasserheizung Europas. Beurteile diese Aussage.“<br><br><b>So kannst du antworten:<\/b> Die Aussage stimmt. Der Golfstrom transportiert warmes Wasser aus der Karibik bis nach Norwegen. Er erwärmt die Luft, deshalb hat West- und Nordeuropa milde Winter (z. B. Palmen in Cornwall). Auf gleicher Breite ist es in Kanada wegen des kalten Labradorstroms viel kälter, dort treiben Eisberge. Der Vergleich zeigt, wie stark der Golfstrom Europa „heizt“.<\/div><div class='box wow'>Weitere Küstenwüsten an kalten Meeresströmungen: die <b>Atacama<\/b> in Chile (Humboldtstrom) und die Küstenwüste in <b>Peru<\/b>. Die Atacama ist eine der trockensten Wüsten der Welt!<\/div>"}]}], "final": {"title": "Der große Abschlusstest", "intro": "<p class='lead'>12 Fragen quer durch alle Kapitel, wie in der Klassenarbeit. Du hast pro Frage <b>einen Versuch<\/b>. Am Ende bekommst du deine Urkunde.<\/p><div class='box tipp'>Lies jede Frage genau und schließe zuerst die Antworten aus, die sicher falsch sind.<\/div>", "questions": [{"q": "Ein Flugzeug fliegt in 11.000 m Höhe über Wolken hinweg. In welcher Schicht der Atmosphäre ist es?", "o": ["Troposphäre", "Stratosphäre", "Mesosphäre", "Thermosphäre"], "a": 0, "e": "Flugverkehr findet bis etwa 12.000 m statt, also in der Troposphäre."}, {"q": "Welche Schicht schützt uns mit der Ozonschicht vor UV-Strahlung?", "o": ["Troposphäre", "Stratosphäre", "Exosphäre", "Mesosphäre"], "a": 1, "e": "Die Ozonschicht liegt in der Stratosphäre."}, {"q": "Welche Zuordnung ist richtig?", "o": ["Hoch: Luft sinkt ab · Tief: Luft steigt auf", "Hoch: Luft steigt auf · Tief: Luft sinkt ab", "Hoch und Tief: Luft bewegt sich nicht", "Hoch: Regen · Tief: immer Sonne"], "a": 0, "e": "Absinkende Luft erzeugt ein Hoch, aufsteigende Luft ein Tief. Wind weht vom Hoch zum Tief."}, {"q": "Wo liegt die ITC im Januar ungefähr?", "o": ["Südlich des Äquators", "Nördlich des Äquators", "Am Nordpol", "Sie verschwindet im Winter"], "a": 0, "e": "Im Dezember und Januar steht die Sonne über dem südlichen Wendekreis. Die ITC folgt ihr nach Süden."}, {"q": "Zwischen welchen Breitenkreisen liegt die Westwindzone?", "o": ["0° und 30°", "30° und 70°", "70° und 90°", "23° und 27°"], "a": 1, "e": "Die Westwindzone der Mittelbreiten liegt zwischen 30° und 70°. Deutschland liegt darin."}, {"q": "Welche zwei Voraussetzungen braucht ein Hurrikan?", "o": ["Riesige Wasserfläche und Wasser mit mindestens 27 °C", "Kalte und warme Luft über Land", "Starkregen und Schneeschmelze", "Hohe Berge und Wüstensand"], "a": 0, "e": "Ein tropischer Wirbelsturm braucht eine große Wasserfläche und mindestens 27 °C warmes Wasser."}, {"q": "Hurrikan, Taifun, Zyklon: Was ist richtig?", "o": ["Es sind verschiedene Namen für tropische Wirbelstürme, je nach Region", "Es sind drei verschiedene Tornado-Stärken", "Es sind drei Schichten der Atmosphäre", "Es sind drei Meeresströmungen"], "a": 0, "e": "Hurrikan (Nordatlantik, Ostpazifik), Taifun (Westpazifik), Zyklon (Indischer Ozean, Südpazifik)."}, {"q": "Ein Hurrikan hat 165 km/h. Welche Kategorie auf der Saffir-Simpson-Skala ist das?", "o": ["Kategorie 1", "Kategorie 2", "Kategorie 3", "Kategorie 4"], "a": 1, "e": "Kategorie 2 reicht von 154 bis 177 km/h (mäßig)."}, {"q": "Was ist <u>keine<\/u> Ursache für schwere Hochwasser?", "o": ["Breite Auen, in denen sich der Fluss ausbreiten kann", "Begradigte Flüsse", "Versiegelte Böden", "Lang anhaltender Starkregen"], "a": 0, "e": "Auen nehmen Hochwasser auf und schützen. Die anderen drei verstärken Hochwasser."}, {"q": "Was passiert, wenn bei einem Polder die Schleuse im Einlassbauwerk geöffnet wird?", "o": ["Wasser fließt in den Polder, der Pegel im Fluss sinkt", "Der Fluss wird begradigt", "Der Deich wird abgerissen", "Das Wasser fließt bergauf in die Alpen"], "a": 0, "e": "Der Polder nimmt Wasser auf, der Hochwasserpegel sinkt (am Oberrhein bis zu 40 cm)."}, {"q": "Welche Aussage über Tornados stimmt?", "o": ["Sie sind klein, extrem schnell und leben nur wenige Minuten", "Sie entstehen nur über warmem Meer", "Sie sind mehrere hundert Kilometer groß", "In Deutschland gibt es keine Tornados"], "a": 0, "e": "Tornados: einige 100 m breit, bis 500 km/h, wenige Minuten. In Deutschland gibt es 20 bis 60 pro Jahr."}, {"q": "Warum ist die Namib eine Wüste direkt am Meer?", "o": ["Der kalte Benguelastrom verhindert Verdunstung, Wolken und Regen", "Der warme Golfstrom trocknet sie aus", "Dort weht der Jetstream", "Dort liegt die ITC das ganze Jahr"], "a": 0, "e": "Kalte Strömung → kühle Luft → kaum Verdunstung → keine Wolken → kein Regen → Wüste."}]}};
