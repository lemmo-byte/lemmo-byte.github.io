  PAGES.push({type:"chapterEnd", ch:ci, bid:ch.id+"_end"});
});
PAGES.push({type:"quiz", ch:-1, bid:"final", final:true, title:DATA.final.title, intro:DATA.final.intro, questions:DATA.final.questions});
PAGES.push({type:"cert", ch:-1, bid:"cert"});
if(state.pos >= PAGES.length) state.pos = 0;

function chColor(ci){ return ci>=0 ? DATA.chapters[ci] : {color:"#f59e0b", bg:"#fef3c7"}; }
function setTheme(ci){
  const c = chColor(ci);
  document.documentElement.style.setProperty("--ch", c.color);
  document.documentElement.style.setProperty("--chbg", c.bg);
}
function fmtMin(sec){ return Math.max(1,Math.round(sec/60)); }
function pageSeconds(p){
  if(p.type==="video") return p.clips.reduce((a,c)=>a+(c.dur||6),0);
  if(p.type==="quiz") return p.questions.length*35;
  if(p.type==="text"||p.type==="fact") return 75;
  return 10;
}
function chapterSeconds(ci){ return PAGES.filter(p=>p.ch===ci).reduce((a,p)=>a+pageSeconds(p),0); }
function totalSeconds(){ return PAGES.reduce((a,p)=>a+pageSeconds(p),0); }

/* ---------- XP / toast ---------- */
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }
function addXP(n,msg){ state.xp += n; save(); renderTop(); if(msg) toast(msg); }
function confetti(){
  const box=document.createElement("div"); box.className="confetti";
  const cols=["#f59e0b","#2563eb","#16a34a","#ec4899","#8b5cf6","#06b6d4"];
  for(let i=0;i<70;i++){ const e=document.createElement("i"); e.style.left=Math.random()*100+"%"; e.style.background=cols[i%cols.length]; e.style.animationDelay=(Math.random()*.8)+"s"; e.style.animationDuration=(2+Math.random()*1.6)+"s"; box.appendChild(e); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),4200);
}
function chapterDone(ci){
  return PAGES.filter(p=>p.ch===ci && p.type==="quiz").every(p=>p.questions.every((q,i)=>state.q[p.bid+"_"+i]));
}
function renderTop(){
  $("#xp").textContent = "⭐ " + state.xp;
  $("#bar").style.width = (100*state.pos/(PAGES.length-1)) + "%";
  const nav = $("#nav"); nav.innerHTML="";
  const cur = PAGES[state.pos];
  DATA.chapters.forEach((ch,ci)=>{
    const b=document.createElement("button");
    b.innerHTML = ch.emoji+" "+(ci+1);
    b.title = ch.title;
    b.style.setProperty("--c",ch.color); b.style.setProperty("--cb",ch.bg);
    if(cur.ch===ci) b.classList.add("cur");
    if(chapterDone(ci)) b.classList.add("done");
    b.onclick=()=>go(PAGES.findIndex(p=>p.ch===ci));
    nav.appendChild(b);
  });
  const f=document.createElement("button"); f.innerHTML="🏆 Test"; f.title="Abschlusstest";
  f.style.setProperty("--c","#d97706"); f.style.setProperty("--cb","#fef3c7");
  if(cur.bid==="final"||cur.bid==="cert") f.classList.add("cur");
  if(state.q["final_0"]) f.classList.add("done");
  f.onclick=()=>go(PAGES.findIndex(p=>p.bid==="final"));
  nav.appendChild(f);
}

/* ---------- navigation ---------- */
let cleanup = null;
function go(i){
  if(cleanup){ cleanup(); cleanup=null; }
  state.pos = Math.max(0,Math.min(PAGES.length-1,i)); save();
  render(); window.scrollTo({top:0,behavior:"smooth"});
}
$("#home").onclick=()=>go(0);
function navRow(opts={}){
  const r=document.createElement("div"); r.className="navrow";
  const back=document.createElement("button"); back.className="btn ghost"; back.textContent="← Zurück"; back.onclick=()=>go(state.pos-1);
  if(state.pos===0) back.style.visibility="hidden";
  const pos=document.createElement("span"); pos.className="pos"; pos.textContent = opts.label||"";
  const sp=document.createElement("span"); sp.className="spacer";
  const next=document.createElement("button"); next.className="btn"; next.textContent=opts.nextText||"Weiter →";
  next.onclick=opts.onNext||(()=>go(state.pos+1));
  r.append(back,pos,sp,next);
  return {row:r, next};
}
function posLabel(p){
  if(p.ch<0) return "";
  const list=PAGES.filter(x=>x.ch===p.ch && x.type!=="chapterEnd");
  const i=list.indexOf(p);
  return i>=0 ? `Kapitel ${p.ch+1} · Schritt ${i+1} von ${list.length}` : "";
}
function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }

function render(){
  const p = PAGES[state.pos];
  setTheme(p.ch);
  renderTop();
  main.innerHTML="";
  ({start:renderStart,text:renderText,fact:renderText,video:renderVideo,quiz:renderQuiz,chapterEnd:renderChapterEnd,cert:renderCert})[p.type](p);
}

/* ---------- start ---------- */
function renderStart(){
  const c=el("div","card");
  const total=fmtMin(totalSeconds());
  c.innerHTML = `
  <div class="hero">
    <div>
      <span class="kicker">${DATA.meta.kicker}</span>
      <h1>${DATA.meta.title}</h1>
      <p class="lead">${DATA.meta.lead}</p>
      <p class="muted"><b>Dauer:</b> ungefähr ${total} Minuten. Du kannst jederzeit Pause machen, dein Fortschritt wird gespeichert.</p>
    </div>
    <div class="art">🌪️🌍<br>🌊⛈️</div>
  </div>
  <div class="box tipp">${DATA.meta.howto}</div>`;
  const grid=el("div","chgrid");
  DATA.chapters.forEach((ch,ci)=>{
    const b=el("button","chcard"+(chapterDone(ci)?" done":""));
    b.style.setProperty("--c",ch.color);
    b.innerHTML=`<span class="e">${ch.emoji}</span><span><b>${ci+1}. ${ch.title}</b><small>ca. ${fmtMin(chapterSeconds(ci))} Min${chapterDone(ci)?" · erledigt ✓":""}</small></span>`;
    b.onclick=()=>go(PAGES.findIndex(p=>p.ch===ci));
    grid.appendChild(b);
  });
  const fb=el("button","chcard"); fb.style.setProperty("--c","#d97706");
  fb.innerHTML=`<span class="e">🏆</span><span><b>Abschlusstest + Urkunde</b><small>${DATA.final.questions.length} Fragen</small></span>`;
  fb.onclick=()=>go(PAGES.findIndex(p=>p.bid==="final"));
  grid.appendChild(fb);
  c.appendChild(el("h3",null,"Deine Kapitel")); c.appendChild(grid);
  const startPos = state.pos>0 ? state.pos : 1;
  const {row,next}=navRow({nextText: state.pos>0||state.xp>0 ? "Weitermachen →" : "Los geht's! →", onNext:()=>go(startPos>0?startPos:1)});
  if(state.xp>0){
    const reset=el("button","btn ghost","Neu starten"); reset.onclick=()=>{ if(confirm("Fortschritt und Sterne wirklich löschen?")){ state={pos:0,xp:0,q:{},v:{},name:state.name}; save(); go(1);} };
    row.insertBefore(reset,next);
  }
  c.appendChild(row);
  main.appendChild(c);
  // remember last real position for "Weitermachen"
  const last = state.lastPos||1; next.onclick=()=>go(state.xp>0?last:1);
}

/* ---------- text ---------- */
function renderText(p){
  const ch=DATA.chapters[p.ch];
  const c=el("div","card textblock");
  const kick = p.type==="fact" ? "Wissen extra" : (p.kicker||"Kurz erklärt");
  c.innerHTML=`<span class="kicker">${ch.emoji} Kapitel ${p.ch+1} · ${kick}</span><h2>${p.title}</h2>${p.html}`;
  const {row}=navRow({label:posLabel(p)});
  c.appendChild(row); main.appendChild(c);
}

/* ---------- video ---------- */
function renderVideo(p){
  const ch=DATA.chapters[p.ch];
  const wrap=el("div");
  const head=el("div","card"); head.style.marginBottom="14px"; head.style.padding="16px 22px";
  head.innerHTML=`<span class="kicker">${ch.emoji} Kapitel ${p.ch+1} · Erklär-Animation</span><h2 style="margin:0">${p.title}</h2>`;
  wrap.appendChild(head);
  const player=el("div","player");
  const stage=el("div","stage");
  const tpl=document.getElementById("scene-"+p.scene);
  stage.innerHTML = tpl ? tpl.innerHTML : `<svg viewBox="0 0 960 540"><text x="480" y="270" fill="#fff" text-anchor="middle" font-size="30">Szene fehlt: ${p.scene}</text></svg>`;
  const svg=stage.querySelector("svg");
  if(svg) svg.setAttribute("aria-hidden","true");
  const ov=el("div","overlay",`<button class="playbig" aria-label="Abspielen">▶</button><div class="ttl">${p.title}</div><div class="sub">${p.clips.length} Abschnitte · ca. ${fmtMin(p.clips.reduce((a,c)=>a+(c.dur||6),0))} Min</div>`);
  stage.appendChild(ov);
  const cap=el("div","caption");
  const ctr=el("div","controls");
  const bPrev=el("button",null,"⏮"); bPrev.title="Abschnitt zurück";
  const bPlay=el("button",null,"▶"); bPlay.title="Abspielen / Pause (Leertaste)";
  const bNext=el("button",null,"⏭"); bNext.title="Abschnitt vor";
  const segs=el("div","segs");
  const time=el("span","time");
  const bRate=el("button",null,"1×"); bRate.title="Tempo";
  const bCC=el("button","on","CC"); bCC.title="Untertitel an/aus";
  ctr.append(bPrev,bPlay,bNext,segs,time,bRate,bCC);
  player.append(stage,cap,ctr);
  wrap.appendChild(player);
  const {row,next}=navRow({label:posLabel(p)});
  wrap.appendChild(row);
  main.appendChild(wrap);

  const totalDur=p.clips.reduce((a,c)=>a+(c.dur||6),0);
  p.clips.forEach((c,i)=>{ const d=el("div"); d.style.flex=String(c.dur||6); d.appendChild(el("i")); d.onclick=()=>{ playClip(i); }; segs.appendChild(d); });
  const audio=new Audio(); audio.preload="auto";
  let idx=0, playing=false, timer=null, rate=1, fallbackStart=0;
  const rates=[1,1.15,1.3];
  function setStep(i, restart){
    svg.querySelectorAll("[data-in]").forEach(e=>{
      const a=+e.dataset.in, b=e.dataset.out!==undefined?+e.dataset.out:1e9;
      const v=i>=a&&i<b;
      if(restart && a===i && v){ e.classList.remove("vis"); }
      e.classList.toggle("vis", v && !(restart && a===i));
    });
    if(restart){ void svg.getBoundingClientRect(); svg.querySelectorAll(`[data-in="${i}"]`).forEach(e=>{ const b=e.dataset.out!==undefined?+e.dataset.out:1e9; if(i<b) e.classList.add("vis"); }); }
    svg.querySelectorAll("[data-hl]").forEach(e=>{ e.classList.toggle("hl", e.dataset.hl.split(",").map(Number).includes(i)); });
  }
  function fmt(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
  function updSegs(){
    [...segs.children].forEach((d,i)=>{ d.classList.toggle("past", i<idx); if(i!==idx) d.firstChild.style.width=i<idx?"100%":"0"; });
    const before=p.clips.slice(0,idx).reduce((a,c)=>a+(c.dur||6),0);
    let cur=0; const c=p.clips[idx];
    if(c && audio.src && !isNaN(audio.duration) && audio.duration>0){ cur=audio.currentTime; segs.children[idx].firstChild.style.width=(100*audio.currentTime/audio.duration)+"%"; }
    else if(timer){ cur=(performance.now()-fallbackStart)/1000*rate; segs.children[idx].firstChild.style.width=Math.min(100,100*cur/(c.dur||6))+"%"; }
    time.textContent=fmt(before+cur)+" / "+fmt(totalDur);
  }
  let raf=0; function loop(){ updSegs(); raf=requestAnimationFrame(loop); }
  function stopTimers(){ clearTimeout(timer); timer=null; }
  function playClip(i){
    ov.style.display="none";
    stopTimers();
    idx=i; const c=p.clips[i];
    const restart = svg.dataset.step==String(i);
    svg.dataset.step=i;
    setStep(i, restart);
    cap.textContent=c.t;
    playing=true; bPlay.textContent="⏸";
    if(c.src){
      audio.src=c.src; audio.playbackRate=rate;
      audio.play().catch(()=>fallback(c));
    } else fallback(c);
    if(p.clips[i+1] && p.clips[i+1].src){ const pre=new Audio(); pre.preload="auto"; pre.src=p.clips[i+1].src; }
    updSegs();
  }
  function fallback(c){
    stopTimers();
    const d=(c.dur||Math.max(4,c.t.split(/\s+/).length*0.42))*1000/rate;
    fallbackStart=performance.now();
    timer=setTimeout(ended,d);
  }
  function ended(){
    stopTimers();
    if(idx+1<p.clips.length){ playClip(idx+1); }
    else finish();
  }
  function finish(){
    playing=false; bPlay.textContent="↻";
    idx=p.clips.length; updSegs(); idx=p.clips.length-1;
    if(!state.v[p.bid]){ state.v[p.bid]=1; addXP(20,"🎬 Animation geschafft: +20 ⭐"); }
    ov.innerHTML=`<div class="bigemoji">✅</div><div class="ttl">Super, geschafft!</div><div class="row" style="justify-content:center"><button class="btn ghost" id="rep">↻ Nochmal ansehen</button><button class="btn sun" id="cont">Weiter →</button></div>`;
    ov.style.display="flex";
    ov.querySelector("#rep").onclick=()=>playClip(0);
    ov.querySelector("#cont").onclick=()=>go(state.pos+1);
    next.classList.add("sun");
  }
  audio.addEventListener("ended", ended);
  audio.addEventListener("error", ()=>{ if(playing) fallback(p.clips[idx]); });
  function toggle(){
    if(!playing){
      if(ov.style.display!=="none" && idx>=p.clips.length-1 && svg.dataset.step==String(p.clips.length-1)){ playClip(0); return; }
      if(svg.dataset.step===undefined){ playClip(0); return; }
      playing=true; bPlay.textContent="⏸"; ov.style.display="none";
      if(p.clips[idx].src && !timer){ audio.play().catch(()=>fallback(p.clips[idx])); } else fallback(p.clips[idx]);
    } else {
      playing=false; bPlay.textContent="▶"; audio.pause(); stopTimers();
    }
  }
  ov.querySelector(".playbig").onclick=()=>playClip(0);
  bPlay.onclick=toggle;
  bPrev.onclick=()=>playClip(Math.max(0,idx-1));
  bNext.onclick=()=>{ if(idx+1<p.clips.length) playClip(idx+1); else { audio.pause(); finish(); } };
  bRate.onclick=()=>{ rate=rates[(rates.indexOf(rate)+1)%rates.length]; audio.playbackRate=rate; bRate.textContent=String(rate).replace(".",",")+"×"; };
  bCC.onclick=()=>{ cap.classList.toggle("off"); bCC.classList.toggle("on"); };
  const onKey=e=>{ if(e.code==="Space" && e.target.tagName!=="INPUT"){ e.preventDefault(); toggle(); } };
  document.addEventListener("keydown",onKey);
  setStep(0,false); cap.textContent="▶ Tippe auf Play. Ton an! 🔊";
  raf=requestAnimationFrame(loop);
  cleanup=()=>{ audio.pause(); audio.src=""; stopTimers(); cancelAnimationFrame(raf); document.removeEventListener("keydown",onKey); };
}

/* ---------- quiz ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderQuiz(p){
  const ch = p.ch>=0 ? DATA.chapters[p.ch] : {emoji:"🏆"};
  const c=el("div","card");
  main.appendChild(c);
  let qi = p.questions.findIndex((q,i)=>!state.q[p.bid+"_"+i]);
  if(qi<0) return showSummary();
  function intro(){
    if(!p.intro) return showQ();
    c.innerHTML=`<span class="kicker">${ch.emoji} ${p.final?"Abschlusstest":"Kapitel "+(p.ch+1)+" · Quiz"}</span><h2>${p.title}</h2><div class="textblock">${p.intro}</div>`;
    const {row}=navRow({label:posLabel(p), nextText:"Test starten →", onNext:showQ}); c.appendChild(row);
  }
  function dots(){
    return `<div class="qdots">${p.questions.map((q,i)=>{ const r=state.q[p.bid+"_"+i]; return `<i class="${r?(r.ok?"ok":"bad"):""}${i===qi?" cur":""}"></i>`; }).join("")}</div>`;
  }
  function showQ(){
    const q=p.questions[qi];
    c.innerHTML=`<span class="kicker">${ch.emoji} ${p.final?"Abschlusstest":"Kapitel "+(p.ch+1)+" · Quiz"}</span>
      <div class="qhead"><span class="qcount">Frage ${qi+1} von ${p.questions.length}</span><span class="spacer"></span>${dots()}</div>
      <div class="qtext">${q.q}</div>`;
    const area=el("div"); c.appendChild(area);
    const fb=el("div"); c.appendChild(fb);
    const {row,next}=navRow({label:p.title, nextText: qi+1<p.questions.length?"Nächste Frage →":"Auswertung →", onNext:()=>{ qi++; if(qi<p.questions.length) showQ(); else showSummary(); }});
    next.disabled=true; c.appendChild(row);
    const done=(ok,pts,html)=>{
      state.q[p.bid+"_"+qi]={ok}; save();
      if(ok) addXP(pts, pts+" ⭐ für dich!"); else renderTop();
      fb.className="feedback "+(ok?"ok":"bad");
      fb.innerHTML=(ok?"<b>✔ Richtig!</b> ":"<b>✘ Leider nicht.</b> ")+html;
      c.querySelector(".qdots").outerHTML=dots();
      next.disabled=false; next.classList.add("sun");
      fb.scrollIntoView({behavior:"smooth",block:"nearest"});
    };
    if(q.type==="order"){
      const picked=[]; const box=el("div","order-picked");
      q.items.forEach(()=>box.appendChild(el("div")));
      const hint=el("p","muted","Tippe die Begriffe in der richtigen Reihenfolge an.");
      const opts=el("div","opts");
      const reset=el("button","btn ghost","↺ Neu sortieren"); reset.style.marginTop="10px";
      const items=shuffle(q.items.map((t,i)=>({t,i})));
      const btns=items.map((it,k)=>{ const b=el("button","opt",`<span class="k">${"ABCDEFG"[k]}</span><span>${it.t}</span>`); b.onclick=()=>{ if(b.disabled) return; picked.push(it); b.disabled=true; b.style.opacity=.45; refresh(); }; opts.appendChild(b); return b; });
      function refresh(){
        [...box.children].forEach((d,i)=>{ d.textContent=picked[i]?picked[i].t:""; d.className=picked[i]?"f":""; });
        if(picked.length===q.items.length){
          const ok=picked.every((it,i)=>it.i===i);
          [...box.children].forEach((d,i)=>d.className=picked[i].i===i?"ok":"bad");
          btns.forEach(b=>b.disabled=true); reset.remove();
          done(ok, 15, (ok?"":"Richtig ist: <b>"+q.items.join(" → ")+"</b>. ")+(q.e||""));
        }
      }
      reset.onclick=()=>{ picked.length=0; btns.forEach(b=>{b.disabled=false;b.style.opacity=1;}); refresh(); };
      area.append(hint,box,opts,reset);
    } else {
      const opts=el("div","opts");
      const order=shuffle(q.o.map((t,i)=>({t,i})));
      order.forEach((o,k)=>{
        const b=el("button","opt",`<span class="k">${"ABCD"[k]}</span><span>${o.t}</span>`);
        b.onclick=()=>{
          const ok=o.i===q.a;
          [...opts.children].forEach((x,kk)=>{ x.disabled=true; if(order[kk].i===q.a) x.classList.add("ok"); });
          if(!ok) b.classList.add("bad");
          done(ok,10,q.e||"");
        };
        opts.appendChild(b);
      });
      area.appendChild(opts);
    }
  }
  function showSummary(){
    const n=p.questions.length, ok=p.questions.filter((q,i)=>(state.q[p.bid+"_"+i]||{}).ok).length;
    const ratio=ok/n, stars=ratio>=.9?3:ratio>=.6?2:ratio>0?1:0;
    const msg = ratio>=.9?"Wow, fast alles richtig! Du bist bereit.":ratio>=.6?"Gut gemacht! Schau dir die rot markierten Fragen nochmal an.":"Kein Problem, genau dafür üben wir. Schau dir die Animation nochmal an und versuch es erneut.";
    c.innerHTML=`<span class="kicker">${ch.emoji} ${p.final?"Abschlusstest":"Kapitel "+(p.ch+1)+" · Quiz"}</span>
      <div class="summary"><div class="stars">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div><h2>${ok} von ${n} richtig</h2><p class="lead">${msg}</p>${dots()}</div>`;
    if(ratio>=.9) confetti();
    const again=el("button","btn ghost","↻ Quiz wiederholen");
    again.onclick=()=>{ p.questions.forEach((q,i)=>delete state.q[p.bid+"_"+i]); save(); qi=0; intro(); };
    const {row,next}=navRow({label:posLabel(p), nextText: p.final?"Zur Urkunde →":"Weiter →"});
    row.insertBefore(again,next);
    c.appendChild(row);
    if(p.ch>=0 && chapterDone(p.ch)) renderTop();
  }
  intro();
}

/* ---------- chapter end ---------- */
function renderChapterEnd(p){
  const ch=DATA.chapters[p.ch];
  const quizzes=PAGES.filter(x=>x.ch===p.ch && x.type==="quiz");
  let n=0,ok=0; quizzes.forEach(qz=>qz.questions.forEach((q,i)=>{ n++; if((state.q[qz.bid+"_"+i]||{}).ok) ok++; }));
  const c=el("div","card summary");
  c.innerHTML=`<div class="bigemoji">${ch.badge}</div><span class="kicker">Kapitel ${p.ch+1} geschafft</span><h2>Abzeichen: ${ch.badgeName}</h2>
    <p class="lead">Du hast <b>${ok} von ${n}</b> Fragen in diesem Kapitel richtig beantwortet.</p>
    <div class="box merke" style="text-align:left">${ch.recap}</div>`;
  const nextCh = p.ch+1<DATA.chapters.length ? DATA.chapters[p.ch+1] : null;
  const {row}=navRow({nextText: nextCh ? `Weiter zu Kapitel ${p.ch+2}: ${nextCh.emoji} →` : "Zum Abschlusstest 🏆 →"});
  c.appendChild(row); main.appendChild(c);
  if(!state.v[p.bid]){ state.v[p.bid]=1; save(); confetti(); toast(ch.badge+" Abzeichen „"+ch.badgeName+"“ erhalten!"); }
}

/* ---------- certificate ---------- */
function renderCert(){
  const fq=DATA.final.questions; const ok=fq.filter((q,i)=>(state.q["final_"+i]||{}).ok).length;
  const ratio=ok/fq.length; const title=ratio>=.9?"Wetter-Profi":ratio>=.7?"Wetter-Experte":ratio>=.5?"Wetter-Detektiv":"Wetter-Entdecker";
  const badges=DATA.chapters.map((ch,ci)=>chapterDone(ci)?`<span title="${ch.badgeName}">${ch.badge}</span>`:`<span title="${ch.badgeName} (noch offen)" style="opacity:.25;filter:grayscale(1)">${ch.badge}</span>`).join(" ");
  const c=el("div","card");
  c.innerHTML=`<div class="cert">
    <div class="bigemoji">🏆</div>
    <h1>Urkunde</h1>
    <p class="lead">Hiermit wird bestätigt, dass</p>
    <div class="name" id="cn">${state.name?escapeHtml(state.name):"&nbsp;"}</div>
    <p class="lead">das Training <b>„Weltweite Wetter- und Klimaphänomene“</b> erfolgreich durchgearbeitet hat.</p>
    <h2 style="color:#b45309">Titel: ${title}</h2>
    <p>Abschlusstest: <b>${ok} von ${fq.length}</b> richtig · Sterne gesammelt: <b>⭐ ${state.xp}</b></p>
    <p style="font-size:30px">${badges}</p>
    <p class="muted">${new Date().toLocaleDateString("de-DE")}</p>
  </div>
  <div class="row noprint" style="margin-top:18px;justify-content:center">
    <input id="nm" placeholder="Dein Name" value="${state.name?escapeHtml(state.name):""}">
    <button class="btn sun" id="pr">🖨️ Urkunde drucken</button>
  </div>`;
  const {row}=navRow({nextText:"Zur Übersicht", onNext:()=>go(0)});
  c.appendChild(row); main.appendChild(c);
  c.querySelector("#nm").oninput=e=>{ state.name=e.target.value; save(); c.querySelector("#cn").innerHTML=state.name?escapeHtml(state.name):"&nbsp;"; };
  c.querySelector("#pr").onclick=()=>window.print();
  if(ratio>=.7) confetti();
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

// remember last position for "Weitermachen"
const _go=go;
go=function(i){ _go(i); if(state.pos>0){ state.lastPos=state.pos; save(); } };
$("#home").onclick=()=>go(0);
render();
})();
</script>
</body>
</html>
