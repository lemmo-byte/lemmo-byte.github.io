<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokabel-Trainer Wales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eefbf3;--card:#fff;--ink:#0f172a;--muted:#475569;--line:#d5e9dc;--red:#c8102e;--green:#00843d;--green2:#006b31;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--sun:#f59e0b;--r:18px;--shadow:0 6px 24px rgba(0,80,40,.10)}
*{box-sizing:border-box}html,body{margin:0}
body{background:linear-gradient(180deg,#e6f7ec,#f7fdf9 60%);color:var(--ink);font-family:'Nunito',system-ui,'Segoe UI',sans-serif;font-size:17px;line-height:1.5;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:900;font-size:19px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.brand .flag{font-size:26px}
.spacer{flex:1}
.pill{font-weight:900;border-radius:999px;padding:4px 12px;white-space:nowrap;border:2px solid}
.xp{background:#fff7e6;border-color:#fde3a7;color:#b45309}
.mast{background:#e8f7ee;border-color:#a7dcbc;color:var(--green2)}
.bar{height:6px;background:#dff0e5}.bar>div{height:100%;background:linear-gradient(90deg,#34d399,var(--green));width:0;transition:width .5s}
main{max-width:980px;margin:0 auto;padding:18px 16px 70px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;font-weight:900;color:var(--muted)}
.tab.on{border-color:var(--green);background:var(--green);color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-weight:800;font-size:14px;color:var(--muted)}
.chip.on{border-color:var(--red);color:var(--red);background:#fff1f2}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 26px;border:1px solid var(--line)}
h1{font-size:30px;line-height:1.15;margin:.1em 0 .3em;font-weight:900}
h2{font-size:24px;margin:.1em 0 .4em;font-weight:900}
.muted{color:var(--muted)}
.kicker{display:inline-block;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--red);background:#fff1f2;border-radius:999px;padding:3px 12px;margin-bottom:8px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:900;font-size:17px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green2)}
.btn.ghost{background:#fff;color:var(--green2);box-shadow:0 0 0 2px var(--line) inset}
.btn.red{background:var(--bad);box-shadow:0 4px 0 #991b1b}
.btn.sun{background:var(--sun);box-shadow:0 4px 0 #b45309}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.spk{border:0;background:#e8f7ee;color:var(--green2);border-radius:50%;width:44px;height:44px;font-size:20px;flex:none}
/* flashcard */
.flash{perspective:1200px;max-width:560px;margin:10px auto 18px;cursor:pointer}
.flash-in{position:relative;height:280px;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:var(--shadow)}
.front{background:linear-gradient(135deg,#00843d,#00a650);color:#fff}
.back{background:#fff;border:3px solid var(--green);transform:rotateY(180deg)}
.front .w{font-size:42px;font-weight:900}
.back .w{font-size:30px;font-weight:900;color:var(--green2)}
.back .ex{margin-top:12px;color:var(--muted);font-style:italic}
.hint{font-size:14px;opacity:.85;margin-top:10px}
.tip{display:inline-block;margin-top:10px;background:#fff7e6;color:#92400e;border-radius:10px;padding:5px 10px;font-weight:800;font-size:14px}
/* quiz + write */
.prompt{font-size:30px;font-weight:900;margin:6px 0 4px}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:14px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-weight:800;font-size:18px;text-align:left}
.opt:hover:not([disabled]){border-color:var(--green)}
.opt[disabled]{color:var(--ink);opacity:1;cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.inp{width:100%;font-size:26px;font-weight:800;padding:12px 16px;border-radius:14px;border:3px solid var(--line);outline:none;margin-top:12px}
.inp:focus{border-color:var(--green)}
.inp.ok{border-color:var(--ok);background:var(--okbg)}.inp.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:14px;border-radius:14px;padding:12px 16px;font-weight:700}
.fb.ok{background:var(--okbg);border:2px solid #86efac}.fb.bad{background:var(--badbg);border:2px solid #fca5a5}
.diff{font-family:ui-monospace,Consolas,monospace;font-size:22px;letter-spacing:1px}
.diff .x{background:#fecaca;color:#991b1b;text-decoration:line-through}
.diff .m{background:#fde68a;color:#92400e;text-decoration:underline}
.progress{display:flex;gap:4px;margin:4px 0 10px}
.progress i{flex:1;height:8px;border-radius:4px;background:#e2e8f0}
.progress i.ok{background:var(--ok)}.progress i.bad{background:var(--bad)}.progress i.cur{background:#93c5fd}
/* table */
table.t{border-collapse:collapse;width:100%;font-size:16px}
table.t td,table.t th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{background:#f0faf4}
.dots{white-space:nowrap}.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e2e8f0;margin-right:3px}.dots i.on{background:var(--ok)}
.grade{font-size:64px;font-weight:900;color:var(--green2);line-height:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(160%);opacity:0;background:#0f172a;color:#fff;border-radius:16px;padding:10px 18px;font-weight:900;transition:all .3s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.mode{border:2px solid var(--line);border-radius:16px;padding:14px;background:#fff;text-align:left}
.mode:hover{border-color:var(--green)}
.mode .e{font-size:30px}.mode b{display:block;font-size:17px}.mode small{color:var(--muted);font-weight:700}
@media (max-width:640px){.opts{grid-template-columns:1fr}.prompt{font-size:24px}.front .w{font-size:32px}.flash-in{height:240px}.brand .txt{display:none}.card{padding:18px}}
</style>
</head>

function answers(w){ const a=[w.en.replace(/\s*\(.*?\)\s*/g," ").trim(), ...(w.alt||[])]; return [...new Set(a)]; }
function check(w,input){
  const n=norm(input); if(!n) return {ok:false,empty:true};
  for(const a of answers(w)){
    if(norm(a)===n){
      if(/[A-Z]/.test(a) && input.trim()!==a && input.trim().toLowerCase()===a.toLowerCase()) return {ok:false,caseOnly:true,target:a};
      return {ok:true,target:a};
    }
  }
  // closest answer for diff
  let best=answers(w)[0],bd=1e9; answers(w).forEach(a=>{const d=lev(norm(a),n); if(d<bd){bd=d;best=a;}});
  return {ok:false,target:best,dist:bd};
}
function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}
function diffHtml(inp,target){ // show target, marking letters missing/wrong in input
  const a=inp.trim(), b=target; const n=a.length,m=b.length; const L=[...Array(n+1)].map(()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i].toLowerCase()===b[j].toLowerCase()?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,yours="",right="";
  while(i<n&&j<m){ if(a[i].toLowerCase()===b[j].toLowerCase()){yours+=esc(a[i]);right+=esc(b[j]);i++;j++;} else if(L[i+1][j]>=L[i][j+1]){yours+=`<span class="x">${esc(a[i])}</span>`;i++;} else {right+=`<span class="m">${esc(b[j])}</span>`;j++;} }
  while(i<n){yours+=`<span class="x">${esc(a[i])}</span>`;i++;} while(j<m){right+=`<span class="m">${esc(b[j])}</span>`;j++;}
  return `<div class="diff">Du: ${yours||"–"}</div><div class="diff">Richtig: ${right}</div>`;
}
/* layout */
const MODES=[["home","🏠 Start"],["cards","🃏 Karten"],["quiz","❓ Quiz"],["write","✍️ Schreiben"],["listen","🎧 Diktat"],["grammar","🪞 Grammatik"],["test","📝 Probetest"],["list","📋 Liste"]];
let mode="home", cleanup=null;
function tabs(){ const t=$("#tabs"); t.innerHTML=""; MODES.forEach(([k,l])=>{const b=document.createElement("button"); b.className="tab"+(k===mode?" on":""); b.textContent=l; b.onclick=()=>go(k); t.appendChild(b);});
  const f=$("#filters"); f.innerHTML=""; if(["home","grammar"].includes(mode)) return;
  [["all","Alle "+W.length]].concat(DATA.sections.map(s=>[s.id,s.emoji+" "+s.name])).forEach(([k,l])=>{const b=document.createElement("button"); b.className="chip"+(st.sec===k?" on":""); b.textContent=l; b.onclick=()=>{st.sec=k; save(); go(mode);}; f.appendChild(b);}); }
function go(k,arg){ if(cleanup){cleanup();cleanup=null;} mode=k; tabs(); $("#view").innerHTML=""; ({home,cards,quiz,write,listen,grammar,test,list})[k](arg); window.scrollTo({top:0}); }
function el(h){const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstElementChild;}

function home(){
  const m=W.filter(w=>box(w)>=MASTER).length;
  const v=el(`<div class="card"><span class="kicker">${esc(DATA.test)}</span><h1>${esc(DATA.title)}</h1>
  <p class="muted">${W.length} Vokabeln von S. 32 bis 34. Jedes Wort ist <b>sicher</b>, wenn du es <b>dreimal hintereinander</b> richtig weißt. Du kannst schon <b>${m}</b> sicher.</p>
  <p class="muted">Tipp: Erst <b>Karten</b> anschauen und anhören, dann <b>Schreiben</b> üben (so wie im Test), am Ende den <b>Probetest</b> machen. 🔊 Ton an, dann hörst du die Aussprache.</p>
  <div class="home-grid"></div></div>`);
  const g=v.querySelector(".home-grid");
  [["cards","🃏","Karteikarten","Anschauen, anhören, umdrehen"],["quiz","❓","Quiz","Richtige Übersetzung antippen"],["write","✍️","Schreiben","Deutsch → Englisch tippen, wie im Test"],["listen","🎧","Diktat","Hören und richtig schreiben"],["grammar","🪞","Grammatik","myself, ourselves, themselves …"],["test","📝","Probetest","20 Wörter mit Note"]].forEach(([k,e,b,s])=>{const x=el(`<button class="mode"><span class="e">${e}</span><b>${b}</b><small>${s}</small></button>`); x.onclick=()=>go(k); g.appendChild(x);});
  $("#view").appendChild(v);
}

function cards(){
  let list=pick(pool().length), i=0;
  const v=el(`<div class="card center"><div class="muted" id="cpos"></div><div class="flash" id="fl"><div class="flash-in"><div class="face front"><div class="w" id="cen"></div><div class="hint">Tippen zum Umdrehen</div></div><div class="face back"><div class="w" id="cde"></div><div class="ex" id="cex"></div><div id="ctip"></div></div></div></div>
  <div class="row" style="justify-content:center"><button class="spk" id="s1" title="Wort anhören">🔊</button><button class="spk" id="s2" title="Satz anhören">💬</button></div>
  <div class="row" style="justify-content:center;margin-top:16px"><button class="btn red" id="no">✗ Nochmal</button><button class="btn" id="yes">✓ Wusste ich</button></div></div>`);
  $("#view").appendChild(v);
  const fl=v.querySelector("#fl");
  function show(){ const w=list[i]; fl.classList.remove("flip"); v.querySelector("#cpos").textContent=`Karte ${i+1} von ${list.length}`; v.querySelector("#cen").textContent=w.en; v.querySelector("#cde").textContent=w.de; v.querySelector("#cex").textContent=w.ex; v.querySelector("#ctip").innerHTML=w.tip?`<span class="tip">💡 ${esc(w.tip)}</span>`:""; setTimeout(()=>sayW(w),250); }
  fl.onclick=()=>fl.classList.toggle("flip");
  v.querySelector("#s1").onclick=()=>sayW(list[i]); v.querySelector("#s2").onclick=()=>sayS(list[i]);
  const next=()=>{ i++; if(i>=list.length){ list=pick(pool().length); i=0; toast("Runde geschafft! 🎉"); } show(); };
  v.querySelector("#yes").onclick=()=>{ setBox(list[i],box(list[i])+1); addXP(2); next(); };
  v.querySelector("#no").onclick=()=>{ setBox(list[i],0); list.splice(Math.min(list.length,i+4),0,list[i]); next(); };
  show();
}

function quiz(){
  const N=10; const list=pick(N); let i=0, res=[];
  const v=el(`<div class="card"><div class="progress" id="qp"></div><div class="muted" id="qdir"></div><div class="row"><div class="prompt" id="qq"></div><button class="spk" id="qs" style="display:none">🔊</button></div><div class="opts" id="qo"></div><div id="qf"></div><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="qn" style="display:none">Weiter →</button></div></div>`);
  $("#view").appendChild(v);
  function prog(){ v.querySelector("#qp").innerHTML=list.map((_,k)=>`<i class="${k<res.length?(res[k]?"ok":"bad"):(k===i?"cur":"")}"></i>`).join(""); }
  function show(){
    prog(); const w=list[i]; const en2de=Math.random()<.5;
    v.querySelector("#qdir").textContent=en2de?"Was heißt das auf Deutsch?":"Was heißt das auf Englisch?";
    v.querySelector("#qq").textContent=en2de?w.en:w.de;
    const qs=v.querySelector("#qs"); qs.style.display=en2de?"":"none"; qs.onclick=()=>sayW(w); if(en2de) sayW(w);
    const others=shuffle(W.filter(x=>x.id!==w.id)).slice(0,3); const opts=shuffle([w,...others]);
    const o=v.querySelector("#qo"); o.innerHTML=""; v.querySelector("#qf").innerHTML=""; v.querySelector("#qn").style.display="none";
    opts.forEach(x=>{ const b=el(`<button class="opt">${esc(en2de?x.de:x.en)}</button>`); b.onclick=()=>{
      const ok=x.id===w.id; [...o.children].forEach((c,k)=>{c.disabled=true; if(opts[k].id===w.id) c.classList.add("ok");}); if(!ok) b.classList.add("bad");
      res.push(ok); if(ok){addXP(5); setBox(w,box(w)+1);} else setBox(w,0);
      v.querySelector("#qf").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✔ Richtig!":"✘ Richtig ist: <b>"+esc(w.en)+"</b> = "+esc(w.de)}<br><span class="muted"><i>${esc(w.ex)}</i></span></div>`;
      if(!en2de) sayW(w); prog(); v.querySelector("#qn").style.display=""; v.querySelector("#qn").focus(); }; o.appendChild(b); });
  }
  v.querySelector("#qn").onclick=()=>{ i++; if(i<list.length) show(); else done(); };
  function done(){ const ok=res.filter(Boolean).length; v.innerHTML=`<div class="center"><div class="grade">${ok}/${list.length}</div><h2>${ok>=9?"Super! 🎉":ok>=6?"Gut gemacht!":"Weiter üben, das wird! 💪"}</h2><button class="btn" id="again">Neue Runde</button></div>`; v.querySelector("#again").onclick=()=>go("quiz"); }
  show();
}

function writeRound(list, opts){
  // generic typing trainer used by write, listen and test
  opts=opts||{}; let i=0, res=[], wrong=[], first=true;
  const v=el(`<div class="card"><div class="progress" id="wp"></div><div class="muted" id="wdir"></div><div class="row"><div class="prompt" id="wq"></div><button class="spk" id="ws">🔊</button></div><div id="wtip"></div>
   <input class="inp" id="wi" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="auf Englisch …"><div id="wf"></div>
   <div class="row" style="margin-top:16px;justify-content:space-between"><span class="muted" id="wl"></span><button class="btn" id="wb">Prüfen</button></div></div>`);
  $("#view").appendChild(v);
  const inp=v.querySelector("#wi"), btn=v.querySelector("#wb");
  let checked=false;
  function prog(){ v.querySelector("#wp").innerHTML=list.map((_,k)=>`<i class="${k<res.length?(res[k]?"ok":"bad"):(k===i?"cur":"")}"></i>`).join(""); }
  function show(){
    prog(); checked=false; const w=list[i];
    v.querySelector("#wdir").textContent=opts.listen?"Hör genau hin und schreib das englische Wort:":"Schreib auf Englisch:";
    v.querySelector("#wq").textContent=opts.listen?"🎧 ?":w.de;
    v.querySelector("#ws").style.display=opts.listen?"":"none"; v.querySelector("#ws").onclick=()=>sayW(w);
    v.querySelector("#wtip").innerHTML=""; v.querySelector("#wf").innerHTML="";
    v.querySelector("#wl").textContent=`${i+1} / ${list.length}`;
    inp.value=""; inp.className="inp"; inp.disabled=false; btn.textContent="Prüfen"; setTimeout(()=>inp.focus(),50);
    if(opts.listen) setTimeout(()=>sayW(w),300);
  }
  function doCheck(){
    const w=list[i]; const r=check(w,inp.value);
    if(r.empty){ inp.focus(); return; }
    checked=true; inp.disabled=true; res.push(r.ok); inp.className="inp "+(r.ok?"ok":"bad");
    if(r.ok){ addXP(opts.test?0:10); if(!opts.test) setBox(w,box(w)+1); }
    else { wrong.push(w); if(!opts.test) setBox(w,0); }
    let html="";
    if(r.ok) html=`<div class="fb ok">✔ Richtig! <b>${esc(w.en)}</b> = ${esc(w.de)}${opts.test?"":`<br><span class="muted"><i>${esc(w.ex)}</i></span>`}</div>`;
    else if(r.caseOnly) html=`<div class="fb bad">✘ Fast! Achte auf die Großschreibung: <b>${esc(r.target)}</b></div>`;
    else html=`<div class="fb bad">✘ Nicht ganz.${diffHtml(inp.value,r.target)}${w.tip?`<div class="tip">💡 ${esc(w.tip)}</div>`:""}</div>`;
    v.querySelector("#wf").innerHTML=html;
    if(!opts.test){ sayW(w); if(!r.ok && !opts.noRepeat){ list.splice(Math.min(list.length,i+3),0,w); } }
    prog(); btn.textContent="Weiter →"; btn.focus();
  }
  function next(){ i++; if(i<list.length) show(); else (opts.onDone||done)(res,wrong,list); }
  btn.onclick=()=>checked?next():doCheck();
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); checked?next():doCheck(); } });
  const key=e=>{ if(e.key==="Enter" && checked && document.activeElement!==inp){ e.preventDefault(); next(); } };
  document.addEventListener("keydown",key); cleanup=()=>document.removeEventListener("keydown",key);
  function done(res,wrong){ const ok=res.filter(Boolean).length; const uniq=[...new Map(wrong.map(w=>[w.id,w])).values()];
    v.innerHTML=`<div class="center"><div class="grade">${ok}/${res.length}</div><h2>${ok===res.length?"Perfekt! 🏆":"Runde geschafft!"}</h2>${uniq.length?`<p class="muted">Diese Wörter üben wir nochmal: <b>${uniq.map(w=>esc(w.en)).join(", ")}</b></p>`:""}<div class="row" style="justify-content:center"><button class="btn" id="again">Neue Runde</button></div></div>`;
    v.querySelector("#again").onclick=()=>go(mode); }
  show();
}
function write(arg){ writeRound(arg||pick(10)); }
function listen(){ writeRound(pick(10),{listen:true}); }

function test(){
  const N=Math.min(20,pool().length);
  const v=el(`<div class="card"><span class="kicker">Probetest</span><h2>Wie im echten Test</h2><p class="muted">${N} zufällige Wörter, Deutsch → Englisch. Keine Tipps, keine zweite Chance, Rechtschreibung zählt. Am Ende siehst du eine geschätzte Note.</p><button class="btn sun" id="go">Test starten</button></div>`);
  $("#view").appendChild(v);
  v.querySelector("#go").onclick=()=>{ v.remove(); writeRound(shuffle(pool()).slice(0,N),{test:true,noRepeat:true,onDone:(res,wrong,list)=>{
    const ok=res.filter(Boolean).length, p=ok/res.length; const note=p>=.92?1:p>=.81?2:p>=.67?3:p>=.5?4:p>=.3?5:6;
    addXP(ok*5);
    const box=$("#view").firstElementChild;
    box.innerHTML=`<div class="center"><span class="kicker">Ergebnis</span><div class="grade">Note ${note}</div><h2>${ok} von ${res.length} richtig (${Math.round(p*100)} %)</h2>
      ${wrong.length?`<p>Diese Wörter musst du noch üben:</p><table class="t">${wrong.map(w=>`<tr><td><b>${esc(w.en)}</b></td><td>${esc(w.de)}</td></tr>`).join("")}</table><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="pr">Diese Wörter üben ✍️</button></div>`:`<p>🏆 Alles richtig, du bist bereit für Donnerstag!</p>`}
      <p class="muted" style="margin-top:14px">Die Note ist nur eine Schätzung nach üblichem Notenschlüssel.</p></div>`;
    const pr=box.querySelector("#pr"); if(pr) pr.onclick=()=>go("write",shuffle(wrong));
  }}); };
}

function grammar(){
  const g=DATA.grammar;
  const v=el(`<div class="card"><span class="kicker">Grammatik Unit 2</span><h2>${esc(g.title)}</h2>
  <p>Reflexivpronomen zeigen, dass jemand etwas <b>mit sich selbst</b> macht oder es <b>selbst</b> macht. Im Deutschen sagen wir oft „sich“ oder „selbst“.</p>
  <table class="t" style="max-width:420px">${g.table.map(r=>`<tr><td>${esc(r[0])}</td><td><b>${esc(r[1])}</b></td></tr>`).join("")}</table>
  <p style="margin-top:12px">⚠️ Mehrzahl endet auf <b>-selves</b>: ourselves, yourselves, themselves.<br>⚠️ <b>each other</b> heißt „einander, gegenseitig“: <i>They help each other.</i> = Sie helfen einander.</p>
  <h2 style="margin-top:20px">Übung: Setz das richtige Wort ein</h2><div id="gaps"></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="gc">Prüfen</button><span id="gr" class="muted"></span></div></div>`);
  $("#view").appendChild(v);
  const box=v.querySelector("#gaps");
  g.gaps.forEach((x,k)=>{ const parts=x.s.split("___"); const r=el(`<div style="margin:10px 0;font-size:19px">${k+1}. ${esc(parts[0])}<input class="inp" style="display:inline-block;width:170px;font-size:18px;padding:6px 10px;margin:0 4px" data-k="${k}" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(parts[1])}</div>`); box.appendChild(r); });
  v.querySelector("#gc").onclick=()=>{ let ok=0; box.querySelectorAll("input").forEach(inp=>{ const a=g.gaps[+inp.dataset.k].a; const r=norm(inp.value)===a; inp.classList.remove("ok","bad"); inp.classList.add(r?"ok":"bad"); if(r) ok++; else inp.title="Richtig: "+a; if(!r && inp.value) inp.value=inp.value; });
    v.querySelector("#gr").innerHTML=`<b>${ok} von ${g.gaps.length}</b> richtig.${ok<g.gaps.length?" Rote Felder: Maus drauf halten oder nochmal überlegen.":" 🎉"}`; if(ok===g.gaps.length) addXP(30); };
}

function list(){
  const v=el(`<div class="card"><span class="kicker">Alle Wörter</span><h2>Wortliste</h2><p class="muted">Grüne Punkte = so oft hintereinander richtig. Drei Punkte = sicher.</p><table class="t"><thead><tr><th></th><th>Englisch</th><th>Deutsch</th><th>Stand</th></tr></thead><tbody></tbody></table></div>`);
  const tb=v.querySelector("tbody");
  pool().forEach(w=>{ const r=el(`<table><tr><td><button class="spk" style="width:34px;height:34px;font-size:15px">🔊</button></td><td><b>${esc(w.en)}</b>${w.tip?`<br><small class="muted">💡 ${esc(w.tip)}</small>`:""}</td><td>${esc(w.de)}</td><td class="dots">${[0,1,2].map(k=>`<i class="${box(w)>k?"on":""}"></i>`).join("")}</td></tr></table>`).querySelector("tr"); r.querySelector("button").onclick=()=>sayW(w); tb.appendChild(r); });
  $("#view").appendChild(v);
}
top(); go("home");
})();
